<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Netlandia Network Map</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/net.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/" } }
</script>
</head>
<body>
<!--HUD-->
<div id="app">
  <canvas id="view" aria-label="3D map of Netlandia's networks"></canvas>
  <div id="labels" aria-hidden="true"></div>
  <div id="detail-labels" class="labels" aria-hidden="true" hidden></div>
  <div id="tips" class="labels" aria-hidden="true"></div>

  <header class="title">
    <h1>Netlandia</h1>
    <p>Transport on one side, the data network on the other</p>
  </header>

  <nav id="panel" class="panel" aria-label="Networks">
    <div class="sides" role="group" aria-label="Side of the globe">
      <button data-side="0" aria-pressed="true"><b>Side A</b><span>Transport</span></button>
      <button data-side="1" aria-pressed="false"><b>Side B</b><span>Data network</span></button>
    </div>
    <h2 id="side-name"></h2>
    <ul id="majors"></ul>
    <div class="opts" role="group" aria-label="Display">
      <button data-opt="traffic" aria-pressed="true">Traffic</button>
      <button data-opt="labels" aria-pressed="true">Labels</button>
      <button data-opt="clouds" aria-pressed="true">Clouds</button>
    </div>
  </nav>

  <section id="detail" class="panel detail" hidden aria-live="polite">
    <button id="btn-back" class="back">&larr; Back to the globe</button>
    <h2 id="d-title"></h2>
    <p id="d-stats" class="d-stats"></p>
    <p id="d-blurb"></p>
    <div id="d-layers" class="d-layers"></div>
    <h3 class="d-h">Explore the technology</h3>
    <div id="d-topics" class="topics"></div>
  </section>

  <section id="tech" class="tech" hidden aria-live="polite">
    <button id="t-close" class="x" aria-label="Close">&times;</button>
    <span id="t-tag" class="t-tag"></span>
    <h3 id="t-title"></h3>
    <p id="t-say"></p>
    <div class="t-foot">
      <div id="t-dots" class="dots" aria-hidden="true"></div>
      <div class="t-btns">
        <button id="t-back">Back</button>
        <button id="t-next" class="primary">Next</button>
      </div>
    </div>
  </section>

  <aside id="card" class="card" hidden aria-live="polite">
    <button id="card-close" class="x" aria-label="Close">&times;</button>
    <span class="card-k"></span>
    <h3 class="card-t"></h3>
    <div class="card-layers"></div>
    <p class="card-role"></p>
    <dl><dt>Equipment</dt><dd class="card-gear"></dd></dl>
    <h4 class="card-links-h">Connects to</h4>
    <ul class="card-links"></ul>
  </aside>

  <p class="hint">Drag to spin the planet · Scroll or pinch to zoom · Click a part of the country to open its network</p>
</div>
<!--/HUD-->
<script type="module" src="js/main.js"></script>
</body>
</html>
