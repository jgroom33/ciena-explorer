// The submarine network's region also follows the cables themselves: a band of sea
// either side of every cable, all the way round the planet. buildWorld fills this in.
const BAND = 7;
let seaBand = [];
const bandCos = Math.cos(BAND / PLANET_R);

// Which major's region a spot on a side's map falls in, if any: the smallest circle
// it is inside (so a network nested in another's area, like the core pair in the
// middle of Coreburg's metro ring, wins there); failing that, the cable band.
function regionAt(x, z, side) {
  let best = null, bestR = Infinity;
  for (const m of MAJORS) {
    for (const [cx, cz, r, cs = m.side] of m.region) {
      if (cs !== side || r >= bestR) continue;
      if (Math.hypot(x - cx, z - cz) < r) { bestR = r; best = m.id; }
    }
  }
  // at sea, the cable band wins over any circle that happens to reach the water
  if (!best || heightAt(x, z, side) < -0.5) {
    const d = flatToDir(x, z, side);
    for (const p of seaBand) if (dot(d, p) > bandCos) return 'submarine';
  }
  return best;
}

// For each major: the link ids it owns and every node id that belongs in its own view.
function majorParts(world) {
  const parts = {};
  for (const m of MAJORS) {
    const links = world.links.filter((l) => m.owns(l, world));
    const nodes = new Set();
    for (const l of links) {
      nodes.add(l.a); nodes.add(l.b);
      for (const n of world.nodes) {
        if (n.id.startsWith(`ila_${l.a}_${l.b}_`) || n.id.startsWith(`rep_${l.a}_${l.b}_`)) nodes.add(n.id);
      }
    }
    parts[m.id] = { links: links.map((l) => l.id), nodes: [...nodes] };
  }
  return parts;
}

// Everything three.js: the little planet, towns, equipment models, cables and traffic.

const INK = new THREE.Color('#1d2a44');

// ---------------------------------------------------------------- materials

const gradient = (() => {
  const t = new THREE.DataTexture(new Uint8Array([110, 185, 255]), 3, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
})();

const matCache = new Map();
function toon(color, opts = {}) {
  const key = !Object.keys(opts).length && String(color);
  if (key && matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshToonMaterial({ color, gradientMap: gradient, ...opts });
  if (key) matCache.set(key, m);
  return m;
}
// Faceted look: toon materials have no flatShading, so split the vertices instead.
function flat(geo) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  g.computeVertexNormals();
  return g;
}
const inkMat = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide });

// A black back-face shell slightly bigger than the mesh: the cartoon outline.
function outline(mesh, t = 0.09) {
  mesh.geometry.computeBoundingBox();
  const s = new THREE.Vector3();
  mesh.geometry.boundingBox.getSize(s);
  const o = new THREE.Mesh(mesh.geometry, inkMat);
  o.scale.set((s.x + 2 * t) / Math.max(s.x, 1e-3), (s.y + 2 * t) / Math.max(s.y, 1e-3), (s.z + 2 * t) / Math.max(s.z, 1e-3));
  o.raycast = () => {};
  mesh.add(o);
  return mesh;
}

function box(w, h, d, color, x = 0, y = 0, z = 0, line = 0.08) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), toon(color));
  m.position.set(x, y + h / 2, z);
  m.castShadow = m.receiveShadow = true;
  return line ? outline(m, line) : m;
}
function cyl(rt, rb, h, color, x = 0, y = 0, z = 0, seg = 12, line = 0.06) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), toon(color));
  m.position.set(x, y + h / 2, z);
  m.castShadow = true;
  return line ? outline(m, line) : m;
}
function ball(r, color, x, y, z, line = 0.06) {
  const m = new THREE.Mesh(flat(new THREE.IcosahedronGeometry(r, 1)), toon(color));
  m.position.set(x, y, z);
  m.castShadow = true;
  return line ? outline(m, line) : m;
}
// Gable roof: a triangular prism along x.
function gable(w, h, d, color, y) {
  const shape = new THREE.Shape();
  shape.moveTo(-d / 2, 0); shape.lineTo(d / 2, 0); shape.lineTo(0, h); shape.closePath();
  const g = new THREE.ExtrudeGeometry(shape, { depth: w, bevelEnabled: false });
  g.translate(0, 0, -w / 2);
  g.rotateY(Math.PI / 2);
  const m = new THREE.Mesh(g, toon(color));
  m.position.y = y;
  m.castShadow = true;
  return outline(m, 0.07);
}

// ---------------------------------------------------------------- planet

// Flat map point (x, z) at height y -> position on the planet.
function sph(x, y, z, side = 0, out = new THREE.Vector3()) {
  const [a, b, c] = flatToDir(x, z, side);
  return out.set(a, b, c).multiplyScalar(PLANET_R + y);
}

// Orientation that stands an object upright on the planet at (x, z), with its
// local +x pointing map-east and +z map-south, as it would on the flat map.
const _e = new THREE.Vector3(), _u = new THREE.Vector3(), _so = new THREE.Vector3(), _bm = new THREE.Matrix4();
function frameAt(x, z, side = 0, out = new THREE.Quaternion()) {
  sph(x, 0, z, side, _u).normalize();
  sph(x + 0.05, 0, z, side, _e).sub(sph(x - 0.05, 0, z, side, _so));
  _so.crossVectors(_e, _u).normalize();
  _e.crossVectors(_u, _so).normalize();
  return out.setFromRotationMatrix(_bm.makeBasis(_e, _u, _so));
}

// Put an object on the planet where it would sit on the flat map.
function place(obj, x, y, z, ry = 0, side = 0) {
  sph(x, y, z, side, obj.position);
  frameAt(x, z, side, obj.quaternion);
  if (ry) obj.rotateY(ry);
  return obj;
}

function buildPlanet(scene) {
  // Ground and sea floor in one closed, faceted sphere.
  const geo = new THREE.IcosahedronGeometry(1, 110);
  const pos = geo.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const c = new THREE.Color();
  const pal = {
    deep: new THREE.Color('#1c5fa8'), shelf: new THREE.Color('#5fd0e0'), sand: new THREE.Color('#f3dc9a'),
    grass: new THREE.Color('#8fd16a'), grass2: new THREE.Color('#6dbb55'), hill: new THREE.Color('#4f9d4a'),
    rock: new THREE.Color('#a39283'), snow: new THREE.Color('#ffffff'), ice: new THREE.Color('#e3f4ff'),
  };
  const v = new THREE.Vector3();
  const cache = new Map();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    const key = `${v.x.toFixed(5)},${v.y.toFixed(5)},${v.z.toFixed(5)}`;
    let hit = cache.get(key);
    if (!hit) {
      const [x, z, side] = dirToFlat(v.x, v.y, v.z);
      const h = heightAt(x, z, side);
      if (h < 0) c.copy(pal.deep).lerp(pal.shelf, smoothstep(SEA_FLOOR, -1, h));
      else if (icy(x, z, side)) c.copy(pal.ice);
      else if (h < 0.9 && landness(x, z, side) < 0.12) c.copy(pal.sand);
      else if (h > 13) c.copy(pal.snow);
      else if (h > 8) c.copy(pal.rock);
      else if (h > 4.5) c.copy(pal.hill);
      else c.copy(((Math.sin(x * 0.3) + Math.cos(z * 0.27)) > 0.4) ? pal.grass2 : pal.grass);
      hit = [h, c.r, c.g, c.b];
      cache.set(key, hit);
    }
    v.multiplyScalar(PLANET_R + hit[0]);
    pos.setXYZ(i, v.x, v.y, v.z);
    col.set([hit[1], hit[2], hit[3]], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const terrain = new THREE.Mesh(geo, new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: gradient }));
  terrain.receiveShadow = true;
  terrain.name = 'terrain';
  scene.add(terrain);

  // Sea: a translucent shell so the sea floor and its cables show through.
  const waterMat = new THREE.MeshToonMaterial({ color: '#36b5e8', gradientMap: gradient, transparent: true, opacity: 0.55, depthWrite: false });
  const water = new THREE.Mesh(new THREE.SphereGeometry(PLANET_R, 160, 120), waterMat);
  water.renderOrder = 2;
  scene.add(water);

  // Atmosphere: a soft rim of light around the planet.
  const glow = new THREE.Mesh(new THREE.SphereGeometry(PLANET_R * 1.16, 64, 48), new THREE.ShaderMaterial({
    side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { color: { value: new THREE.Color('#9fe3ff') } },
    vertexShader: `varying vec3 vN; varying vec3 vV;
      void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform vec3 color; varying vec3 vN; varying vec3 vV;
      void main() { float k = clamp(-dot(vN, vV), 0.0, 1.0); gl_FragColor = vec4(color, k * k * 1.7); }`,
  }));
  glow.raycast = () => {};
  scene.add(glow);

  // Foam: white dabs where land meets water.
  const foam = [];
  for (const side of [0, 1]) {
    for (let x = -158; x < 158; x += 1.6) {
      for (let z = -158; z < 158; z += 1.6) {
        if (Math.hypot(x, z) > 157) continue;
        const h = heightAt(x, z, side);
        if (h < 0 && h > -0.9 && landness(x, z, side) > -0.04 && Math.random() < squeeze(x, z) + 0.1) foam.push([x, z, side]);
      }
    }
  }
  const foamMesh = new THREE.InstancedMesh(new THREE.CircleGeometry(0.9, 8), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.7, depthWrite: false }), foam.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), qx = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));
  const one = new THREE.Vector3(1, 1, 1), p = new THREE.Vector3();
  foam.forEach(([x, z, side], i) => foamMesh.setMatrixAt(i, m4.compose(sph(x, 0.04, z, side, p), frameAt(x, z, side, q).multiply(qx), one)));
  foamMesh.renderOrder = 4;
  foamMesh.raycast = () => {};
  scene.add(foamMesh);

  return { terrain, water, waterMat, foamMesh };
}

// ---------------------------------------------------------------- instanced helpers

const _m = new THREE.Matrix4(), _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _qy = new THREE.Quaternion(), _s = new THREE.Vector3(), _c = new THREE.Color();

// items: {x, y, z, sx, sy, sz, color, ry}
function instanced(geo, items, { line = 0.1, shadow = true, faceted = false } = {}) {
  if (faceted) geo = flat(geo);
  const g = new THREE.Group();
  if (!items.length) return g;
  const body = new THREE.InstancedMesh(geo, toon('#ffffff'), items.length);
  const ink = line ? new THREE.InstancedMesh(geo, inkMat, items.length) : null;
  geo.computeBoundingBox();
  const size = new THREE.Vector3();
  geo.boundingBox.getSize(size);
  items.forEach((it, i) => {
    sph(it.x, it.y, it.z, it.side || 0, _p);
    frameAt(it.x, it.z, it.side || 0, _q).multiply(_qy.setFromAxisAngle(THREE.Object3D.DEFAULT_UP, it.ry || 0));
    _s.set(it.sx, it.sy, it.sz);
    body.setMatrixAt(i, _m.compose(_p, _q, _s));
    body.setColorAt(i, _c.set(it.color));
    if (ink) {
      _s.set(it.sx + (2 * line) / size.x, it.sy + (2 * line) / size.y, it.sz + (2 * line) / size.z);
      ink.setMatrixAt(i, _m.compose(_p, _q, _s));
    }
  });
  body.castShadow = shadow;
  body.receiveShadow = true;
  g.add(body);
  if (ink) { ink.raycast = () => {}; g.add(ink); }
  return g;
}

const unitBox = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
const unitRoof = (() => {
  const s = new THREE.Shape();
  s.moveTo(-0.5, 0); s.lineTo(0.5, 0); s.lineTo(0, 0.6); s.closePath();
  return new THREE.ExtrudeGeometry(s, { depth: 1, bevelEnabled: false }).translate(0, 0, -0.5);
})();

function rand(seed) {
  let s = seed >>> 0;
  return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296);
}

// Segments of every ground link, to keep buildings and trees off the cables.
function cableSegments(world) {
  const segs = [];
  for (const l of world.links) {
    if (l.sea) continue;
    const p = linkPath(world, l), side = world.byId[l.a].side;
    for (let i = 1; i < p.length; i++) segs.push([p[i - 1][0], p[i - 1][1], p[i][0], p[i][1], side]);
  }
  return segs;
}
const clearOf = (segs, nodes, side, x, z, cable, node) =>
  segs.every((s) => s[4] !== side || distToSegment(x, z, s[0], s[1], s[2], s[3]) > cable) &&
  nodes.every((n) => n.side !== side || Math.hypot(n.x - x, n.z - z) > node);

// ---------------------------------------------------------------- towns and scenery

const BUILDING_COLORS = ['#f6f1e7', '#ffd6a5', '#bde0fe', '#cdb4db', '#ffc8dd', '#caffbf', '#e9edc9', '#a2d2ff'];
const ROOF_COLORS = ['#e76f51', '#c0504d', '#6d597a', '#457b9d', '#e9a03b'];

function buildTowns(world) {
  const segs = cableSegments(world);
  const ground = world.nodes.filter((n) => !['router', 'repeater'].includes(n.type));
  const r = rand(11);
  const towers = [], roofs = [], caps = [];
  for (const c of world.cities) {
    // the far side of the planet squeezes the map sideways, so space lots out there
    const step = (c.town ? 1.9 : c.dense ? 1.85 : 2.3) / squeeze(c.x, c.z);
    for (let x = c.x - c.r; x <= c.x + c.r; x += step) {
      for (let z = c.z - c.r; z <= c.z + c.r; z += step) {
        const d = Math.hypot(x - c.x, z - c.z) / c.r;
        if (d > 1 || r() < 0.12) continue;
        const jx = x + (r() - 0.5) * 0.4, jz = z + (r() - 0.5) * 0.4;
        if (heightAt(jx, jz, c.side) < 0.6 || !clearOf(segs, ground, c.side, jx, jz, 1.5, 2.6)) continue;
        const y = heightAt(jx, jz, c.side) - 0.3, side = c.side;
        const color = BUILDING_COLORS[Math.floor(r() * BUILDING_COLORS.length)];
        if (c.town || (d > 0.6 && r() < 0.6)) {
          const w = 1.1 + r() * 0.5, dd = 0.9 + r() * 0.4, h = 0.9 + r() * 0.5, ry = r() < 0.5 ? 0 : Math.PI / 2;
          towers.push({ x: jx, y, z: jz, side, sx: w, sy: h + 0.3, sz: dd, color, ry });
          roofs.push({ x: jx, y: y + h + 0.3, z: jz, side, sx: dd + 0.15, sy: 1.1, sz: w + 0.15, color: ROOF_COLORS[Math.floor(r() * ROOF_COLORS.length)], ry: ry + Math.PI / 2 });
        } else {
          const w = 1.3 + r() * 0.6, h = 1.5 + (1 - d) * (c.tall ?? 0.4) * 12 * (0.5 + r());
          towers.push({ x: jx, y, z: jz, side, sx: w, sy: h, sz: w, color });
          caps.push({ x: jx, y: y + h, z: jz, side, sx: w * 0.6, sy: 0.35, sz: w * 0.6, color: '#8d99ae' });
        }
      }
    }
  }
  const g = new THREE.Group();
  g.add(instanced(unitBox, towers, { line: 0.09 }), instanced(unitRoof, roofs, { line: 0.08 }), instanced(unitBox, caps, { line: 0.05 }));
  return g;
}

function buildTrees(world) {
  const segs = cableSegments(world);
  const ground = world.nodes.filter((n) => !['router', 'repeater'].includes(n.type));
  const r = rand(5);
  const pines = [], rounds = [], trunks = [];
  for (const side of [0, 1]) for (let x = -158; x < 158; x += 1.7) {
    for (let z = -158; z < 158; z += 1.7) {
      const jx = x + (r() - 0.5) * 1.4, jz = z + (r() - 0.5) * 1.4;
      if (Math.hypot(jx, jz) > 157) continue;
      const h = heightAt(jx, jz, side);
      if (h < 1 || h > 12.5 || icy(jx, jz, side) || r() > squeeze(jx, jz)) continue;
      const forest = Math.sin(jx * 0.11 + 1.3 + side * 2) * Math.cos(jz * 0.13) + Math.sin(jx * 0.05 - jz * 0.07);
      if (forest < 0.55 || r() < 0.35) continue;
      if (world.cities.some((c) => c.side === side && Math.hypot(c.x - jx, c.z - jz) < c.r + 2.5)) continue;
      if (!clearOf(segs, ground, side, jx, jz, 1.6, 3)) continue;
      const s = 0.7 + r() * 0.6;
      trunks.push({ x: jx, y: h - 0.2, z: jz, side, sx: 0.25 * s, sy: 0.8 * s, sz: 0.25 * s, color: '#8a5a3b' });
      if (h > 5 || r() < 0.3) pines.push({ x: jx, y: h + 0.5 * s, z: jz, side, sx: s, sy: s * 1.4, sz: s, color: r() < 0.5 ? '#2f8f5b' : '#3a9f60' });
      else rounds.push({ x: jx, y: h + 1.0 * s, z: jz, side, sx: s, sy: s, sz: s, color: r() < 0.5 ? '#5cb85c' : '#7bc96f' });
    }
  }
  const g = new THREE.Group();
  g.add(
    instanced(unitBox, trunks, { line: 0 }),
    instanced(new THREE.ConeGeometry(0.9, 2, 7).translate(0, 1, 0), pines, { line: 0.08, faceted: true }),
    instanced(new THREE.IcosahedronGeometry(0.9, 0), rounds, { line: 0.08, faceted: true }),
  );
  return g;
}

// A cable-laying ship: white hull, yellow deckhouse, the cable sheave over the stern.
function cableShip() {
  const ship = new THREE.Group();
  ship.add(box(5, 0.9, 1.8, '#f1faee', 0, -0.3, 0, 0.08), box(1.6, 1.2, 1.4, '#ffc300', 1.2, 0.6, 0, 0.07),
    cyl(0.12, 0.12, 2.2, '#1d2a44', -1.4, 0.6, 0, 6, 0), box(0.2, 0.2, 1.8, '#1d2a44', -1.9, 2.6, 0, 0),
    cyl(0.5, 0.5, 0.25, '#1d2a44', -2.6, 0.7, 0, 12, 0.04));
  ship.children[4].rotation.x = Math.PI / 2;
  return ship;
}

// A whale, nose along +x: body, flukes, two flippers, a pale belly.
function whale(scale = 1) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(1.1, 3.6, 4, 10), toon('#3d5a80'));
  body.rotation.z = Math.PI / 2;
  body.castShadow = true;
  g.add(outline(body, 0.08));
  const belly = new THREE.Mesh(new THREE.CapsuleGeometry(0.8, 3.2, 4, 10), toon('#c7d7e8'));
  belly.rotation.z = Math.PI / 2;
  belly.position.y = -0.5;
  g.add(belly);
  const tail = new THREE.Group();
  tail.position.x = -2.9;
  const fluke = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.18, 3), toon('#3d5a80'));
  fluke.position.x = -0.6;
  tail.add(outline(fluke, 0.06));
  g.add(tail);
  for (const sgn of [-1, 1]) {
    const fin = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.14, 0.7), toon('#3d5a80'));
    fin.position.set(0.6, -0.5, sgn * 1.2);
    fin.rotation.y = sgn * 0.5;
    g.add(outline(fin, 0.05));
  }
  g.add(ball(0.17, '#1d2a44', 1.6, 0.4, 0.95, 0), ball(0.17, '#1d2a44', 1.6, 0.4, -0.95, 0));
  g.scale.setScalar(scale);
  g.userData.tail = tail;
  return g;
}

// Little things that move: boats, wind turbines, clouds.
function buildLife(scene) {
  const movers = [];
  const boat = (color) => {
    const b = new THREE.Group();
    b.add(box(2.6, 0.6, 1.1, color, 0, -0.2, 0, 0.07), box(1, 0.7, 0.8, '#ffffff', -0.3, 0.4, 0, 0.06));
    return b;
  };
  for (const [cx, cz, r, sp, color, side = 0] of [[52, -20, 10, 0.12, '#e63946'], [60, 50, 14, -0.08, '#264653'], [-112, -40, 9, 0.1, '#f4a261'], [10, 66, 12, 0.07, '#2a9d8f'],
    [-84, 30, 10, 0.1, '#ffbe0b', 1], [70, 20, 12, -0.09, '#3a86ff', 1], [0, 64, 11, 0.08, '#e63946', 1]]) {
    const b = boat(color);
    scene.add(b);
    movers.push((t) => {
      const a = t * sp;
      place(b, cx + Math.cos(a) * r, Math.sin(t * 2 + cx) * 0.08, cz + Math.sin(a) * r, -a + (sp > 0 ? -Math.PI / 2 : Math.PI / 2), side);
    });
  }

  // Cable ship parked over the Lumen City – Coherent Isle cable.
  const ship = cableShip();
  scene.add(ship);
  movers.push((t) => { place(ship, 56, Math.sin(t * 1.6) * 0.1, 30, 0.5); ship.rotateX(Math.sin(t * 1.3) * 0.03); });

  // Wind farm on the moor.
  for (const [x, z] of [[-100, -6], [-104, 0], [-97, -12], [-108, -10]]) {
    const y = heightAt(x, z);
    const t = new THREE.Group();
    t.add(cyl(0.15, 0.3, 6, '#ffffff', 0, 0, 0, 8, 0.05));
    const rotor = new THREE.Group();
    rotor.position.set(0, 6, 0.35);
    for (let k = 0; k < 3; k++) {
      const blade = box(0.25, 3, 0.08, '#ffffff', 0, 0, 0, 0.04);
      const arm = new THREE.Group();
      arm.rotation.z = (k * Math.PI * 2) / 3;
      arm.add(blade);
      rotor.add(arm);
    }
    rotor.add(ball(0.3, '#e63946', 0, 0, 0, 0.04));
    t.add(rotor);
    place(t, x, y, z, 0.4);
    scene.add(t);
    movers.push((tt) => { rotor.rotation.z = -tt * 1.4 + x; });
  }

  // Clouds that drift across and cast soft shadows.
  const clouds = new THREE.Group();
  const cr = rand(3);
  const cloudMat = toon('#ffffff', { transparent: true, opacity: 0.92 });
  const Y = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < 16; i++) {
    const c = new THREE.Group();
    for (let k = 0; k < 5; k++) {
      const m = new THREE.Mesh(flat(new THREE.IcosahedronGeometry(2.4 + cr() * 2, 1)), cloudMat);
      m.position.set((k - 2) * 2.6 + cr(), cr() * 1.2, (cr() - 0.5) * 3);
      m.castShadow = true;
      c.add(m);
    }
    // anywhere between the polar circles, floating above the hills
    const dir = new THREE.Vector3().setFromSphericalCoords(1, 0.5 + cr() * (Math.PI - 1), cr() * Math.PI * 2);
    c.position.copy(dir).multiplyScalar(PLANET_R + 19 + cr() * 4);
    c.quaternion.setFromUnitVectors(Y, dir);
    clouds.add(c);
  }
  scene.add(clouds);
  movers.push((t, dt) => { clouds.rotation.y += dt * 0.012; });
  return { movers, clouds, cloudMat };
}

// ---------------------------------------------------------------- equipment models

const routerTop = (() => {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = '#2f80ed'; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = '#ffffff'; g.fillStyle = '#ffffff'; g.lineWidth = 9; g.lineCap = 'round';
  const arrow = (a, inward) => {
    g.save(); g.translate(64, 64); g.rotate(a);
    const [s, e] = inward ? [46, 14] : [14, 46];
    g.beginPath(); g.moveTo(s, 0); g.lineTo(e, 0); g.stroke();
    g.beginPath(); g.moveTo(e + (inward ? -2 : 2), 0); g.lineTo(e + (inward ? 12 : -12), -11); g.lineTo(e + (inward ? 12 : -12), 11); g.closePath(); g.fill();
    g.restore();
  };
  arrow(Math.PI / 4, false); arrow(-3 * Math.PI / 4, false); arrow(3 * Math.PI / 4, true); arrow(-Math.PI / 4, true);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

function puckModel(r, color) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.6, 24), [toon(color), new THREE.MeshToonMaterial({ map: routerTop, gradientMap: gradient }), toon(color)]);
  m.castShadow = true;
  return outline(m, 0.06);
}

function modelFor(n, layerColor) {
  const g = new THREE.Group();
  const s = n.size || 1;
  switch (n.type) {
    case 'dc': {
      g.add(box(7 * s, 2.4, 4.6 * s, '#eef2f7', 0, -0.4));
      g.add(box(7.1 * s, 0.35, 4.7 * s, layerColor, 0, 1.6, 0, 0.05));
      for (let i = 0; i < 4; i++) for (let k = 0; k < 2; k++) {
        g.add(box(1.1, 0.5, 1.1, '#8d99ae', (-2.4 + i * 1.6) * s, 1.95, (-0.9 + k * 1.8) * s, 0.04));
        g.add(cyl(0.38, 0.38, 0.08, '#2b2d42', (-2.4 + i * 1.6) * s, 2.45, (-0.9 + k * 1.8) * s, 10, 0));
      }
      g.add(box(1.6, 1.1, 1.2, '#fca311', 4.3 * s, -0.3, 1.2 * s, 0.05));
      if (s > 1.2) g.add(box(7 * s, 2.4, 3.4, '#eef2f7', 0, -0.4, 4.6 * s, 0.08), box(7.1 * s, 0.35, 3.5, layerColor, 0, 1.6, 4.6 * s, 0.05));
      break;
    }
    case 'hub': {
      g.add(box(4.6, 4.2, 3.6, '#e8edf5', 0, -0.4));
      g.add(box(4.8, 0.4, 3.8, layerColor, 0, 3.8, 0, 0.05));
      for (let i = -1; i <= 1; i++) for (let k = 0; k < 2; k++) g.add(box(0.8, 0.6, 0.05, '#7cc6fe', i * 1.3, 0.8 + k * 1.4, 1.82, 0));
      g.add(cyl(0.6, 0.6, 0.12, '#1d2a44', 1.2, 4.2, -0.6, 12, 0));
      break;
    }
    case 'pop': {
      g.add(box(3.8, 3.2, 3.2, '#c8553d', 0, -0.4));
      g.add(box(4, 0.35, 3.4, layerColor, 0, 2.8, 0, 0.05));
      for (let i = -1; i <= 1; i++) g.add(box(0.6, 0.6, 0.05, '#bde0fe', i * 1.1, 1.2, 1.62, 0));
      g.add(cyl(0.08, 0.08, 2.4, '#adb5bd', 1.3, 3.1, -1, 6, 0));
      g.add(ball(0.18, '#e63946', 1.3, 5.6, -1, 0));
      break;
    }
    case 'regional': {
      g.add(box(2.2, 1.6, 1.8, '#fff3e0', 0, -0.3));
      g.add(gable(2.5, 1, 2.1, layerColor, 1.3));
      g.add(box(0.5, 0.9, 0.05, '#8d5524', 0.5, -0.1, 0.92, 0));
      break;
    }
    case 'ila': {
      g.add(box(1.4, 1.1, 1.2, '#dee2e6', 0, -0.2, 0, 0.06));
      g.add(gable(1.6, 0.6, 1.4, layerColor, 0.9));
      break;
    }
    case 'cls': {
      g.add(box(3, 2, 2.4, '#ffffff', 0, -0.3));
      g.add(box(3.2, 0.35, 2.6, layerColor, 0, 1.7, 0, 0.05));
      g.add(cyl(0.6, 0.6, 0.15, '#495057', 2.6, 0, 0.8, 12, 0.05));
      break;
    }
    case 'repeater': {
      const r = cyl(0.45, 0.45, 1.8, layerColor, 0, 0, 0, 10, 0.06);
      r.rotation.z = Math.PI / 2;
      r.position.y = 0.5;
      g.add(r);
      break;
    }
    case 'router': {
      const geo = new THREE.CylinderGeometry(n.tier === 'core' ? 1.4 : 1.05, n.tier === 'core' ? 1.4 : 1.05, 0.8, 24);
      const side = toon(layerColor);
      const top = new THREE.MeshToonMaterial({ map: routerTop, gradientMap: gradient });
      const m = new THREE.Mesh(geo, [side, top, side]);
      m.castShadow = true;
      g.add(outline(m, 0.08));
      break;
    }
    case 'core': {
      // a router building with the classic router puck on its roof
      g.add(box(3.6, 2.6, 3.2, '#e8edf5', 0, -0.4));
      g.add(box(3.8, 0.3, 3.4, layerColor, 0, 2.2, 0, 0.05));
      for (let i = -1; i <= 1; i++) g.add(box(0.7, 0.5, 0.05, '#7cc6fe', i * 1.05, 0.9, 1.62, 0));
      const puck = puckModel(1.2, layerColor);
      puck.position.y = 2.95;
      g.add(puck);
      break;
    }
    case 'agg': {
      g.add(box(1.8, 1.4, 1.4, '#e8edf5', 0, -0.3, 0, 0.06));
      const puck = puckModel(0.75, layerColor);
      puck.position.y = 1.45;
      g.add(puck);
      break;
    }
    case 'xhub': {
      g.add(box(1.6, 1.2, 1.3, '#fff3e0', 0, -0.3, 0, 0.06));
      g.add(gable(1.8, 0.7, 1.5, layerColor, 0.9));
      g.add(cyl(0.08, 0.12, 3.2, '#adb5bd', 1.1, -0.2, 0, 6, 0.03));
      g.add(box(0.25, 0.7, 0.1, '#ffffff', 1.1, 2.6, 0.12, 0.03));
      break;
    }
    case 'ixp': {
      // the internet exchange: a hall with a ring of flag poles for the networks that peer there
      g.add(box(4.4, 2.2, 3, '#f8f9fa', 0, -0.4));
      g.add(box(4.6, 0.3, 3.2, layerColor, 0, 1.8, 0, 0.05));
      const flags = ['#e63946', '#ffbe0b', '#2a9d8f', '#8338ec', '#fb5607'];
      flags.forEach((c, i) => {
        const a = (i / flags.length) * Math.PI * 2;
        g.add(cyl(0.05, 0.05, 2.4, '#6c757d', Math.cos(a) * 3.2, -0.2, Math.sin(a) * 2.6, 6, 0));
        g.add(box(0.7, 0.45, 0.04, c, Math.cos(a) * 3.2 + 0.36, 1.75, Math.sin(a) * 2.6, 0.02));
      });
      break;
    }
    case 'access': {
      g.add(box(1, 1.4, 0.7, '#cfd8dc', 0, -0.2, 0, 0.06));
      g.add(box(0.75, 0.9, 0.05, layerColor, 0, 0.1, 0.37, 0));
      break;
    }
    case 'bank': {
      g.add(box(3.2, 0.3, 2.6, '#e9ecef', 0, -0.2));
      g.add(box(2.8, 1.8, 2, '#fdfdfd', 0, 0, -0.2));
      for (let i = 0; i < 4; i++) g.add(cyl(0.14, 0.14, 1.8, '#ffffff', -1.1 + i * 0.73, 0.1, 1, 8, 0.04));
      g.add(box(3, 0.25, 2.5, '#f2c14e', 0, 1.8, 0, 0.05));
      g.add(gable(2.5, 0.9, 3, '#f2c14e', 2.05));
      break;
    }
    case 'tower': {
      const parts = 4;
      for (let i = 0; i < parts; i++) {
        const r0 = 0.5 - (i * 0.32) / parts, r1 = 0.5 - ((i + 1) * 0.32) / parts;
        g.add(cyl(r1, r0, 1.8, i % 2 ? '#ffffff' : '#e63946', 0, -0.2 + i * 1.8, 0, 4, 0.05));
      }
      for (let k = 0; k < 3; k++) {
        const a = (k * Math.PI * 2) / 3;
        const p = box(0.35, 1.1, 0.12, '#f8f9fa', Math.cos(a) * 0.45, 5.6, Math.sin(a) * 0.45, 0.04);
        p.rotation.y = -a + Math.PI / 2;
        g.add(p);
      }
      const light = ball(0.2, '#ff1744', 0, 7.2, 0, 0);
      light.material = new THREE.MeshBasicMaterial({ color: '#ff1744' });
      light.userData.blink = true;
      g.add(light);
      break;
    }
    case 'office': {
      g.add(box(2.4, 6.5, 2.4, '#7cc6fe', 0, -0.3));
      for (let i = 0; i < 6; i++) g.add(box(2.45, 0.12, 2.45, '#ffffff', 0, 0.4 + i * 1, 0, 0));
      g.add(box(1.4, 0.5, 1.4, '#8d99ae', 0, 6.2, 0, 0.04));
      break;
    }
    case 'hospital': {
      g.add(box(3.8, 2.2, 3, '#ffffff', 0, -0.3));
      g.add(box(1.8, 0.1, 0.5, '#e63946', 0, 1.9, 0, 0));
      g.add(box(0.5, 0.1, 1.8, '#e63946', 0, 1.9, 0, 0));
      g.add(box(1.2, 1.2, 0.9, '#bde0fe', 1.6, -0.3, 1.6, 0.05));
      break;
    }
    case 'school': {
      g.add(box(3.6, 1.6, 2, '#ffd166', 0, -0.3));
      g.add(gable(3.8, 1, 2.3, '#c0504d', 1.3));
      g.add(cyl(0.05, 0.05, 3, '#6c757d', 2.3, -0.2, 0.8, 6, 0));
      g.add(box(0.8, 0.5, 0.04, '#2f80ed', 2.72, 2.2, 0.8, 0.02));
      break;
    }
    case 'factory': {
      g.add(box(4, 2, 3, '#a8dadc', 0, -0.3));
      for (let i = 0; i < 3; i++) g.add(gable(3, 0.7, 1.3, '#457b9d', 1.7).translateX(-1.3 + i * 1.3).rotateY(Math.PI / 2));
      g.add(cyl(0.35, 0.45, 4, '#e9ecef', 1.5, -0.3, -1, 10, 0.05));
      g.add(cyl(0.36, 0.36, 0.5, '#e63946', 1.5, 3.2, -1, 10, 0.03));
      for (let k = 0; k < 3; k++) {
        const puff = ball(0.45 + k * 0.15, '#f1f3f5', 1.5, 4.4 + k * 0.9, -1, 0.03);
        puff.userData.puff = k;
        g.add(puff);
      }
      break;
    }
    case 'hotel': {
      g.add(box(2.8, 3.6, 2, '#ffafcc', 0, -0.3));
      for (let i = 0; i < 3; i++) g.add(box(2.85, 0.12, 2.05, '#ffffff', 0, 0.7 + i * 0.9, 0, 0));
      g.add(cyl(0.12, 0.16, 2.4, '#8a5a3b', 2.2, -0.2, 0.8, 6, 0));
      g.add(ball(0.8, '#52b788', 2.2, 2.4, 0.8, 0.05));
      break;
    }
  }
  return g;
}

// Height a node's model stands at.
function nodeY(world, n) {
  if (n.type === 'repeater') return heightAt(n.x, n.z, n.side);
  return Math.max(0.4, heightAt(n.x, n.z, n.side));
}

// ---------------------------------------------------------------- cables

const LIFT = { backbone: 0.55, regional: 0.45, dci: 0.45, metro: 0.5, submarine: 0.35, ipcore: 0.55, agg: 0.45, access: 0.35, xhaul: 0.4 };
const RADIUS = { backbone: 0.42, regional: 0.32, dci: 0.34, metro: 0.36, submarine: 0.36, ipcore: 0.4, agg: 0.32, access: 0.2, xhaul: 0.26 };

function groundY(x, z, side) {
  let h = -Infinity;
  for (const [dx, dz] of [[0, 0], [0.8, 0], [-0.8, 0], [0, 0.8], [0, -0.8]]) h = Math.max(h, heightAt(x + dx, z + dz, side));
  return h;
}

const dash = (() => {
  const cv = document.createElement('canvas');
  cv.width = 64; cv.height = 4;
  const g = cv.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 64, 4);
  g.fillStyle = '#fff'; g.fillRect(0, 0, 40, 4);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = THREE.RepeatWrapping;
  return t;
})();

// A cable's centre line as a three.js curve. On the planet by default. Given `space`
// it is laid out for the drill-down instead, with no terrain under it: flat around
// (cx, cz) for a network on one side, or round an invisible planet ({ sphere: true })
// for one that wraps from side to side.
function linkCurve(world, l, nodeYs, space = null) {
  const side = world.byId[l.a].side;
  const len = linkLength(world, l);
  let pts;
  if (l.cross || space?.sphere) {
    pts = linkDirs(world, l, 1.4).map((d) => {
      const h = space ? 0.5 * space.k : heightDir(...d) + LIFT[l.layer];
      return new THREE.Vector3(...d).multiplyScalar(PLANET_R + h);
    });
  } else {
    pts = samplePath(linkPath(world, l), 1.4).map(([x, z]) => {
      if (space) return new THREE.Vector3(x - space.cx, 0.5 * space.k, z - space.cz);
      const h = groundY(x, z, side);
      const y = h < 0 ? heightAt(x, z, side) + LIFT.submarine : h + LIFT[l.layer];
      return sph(x, y, z, side);
    });
  }
  return { curve: new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5), len };
}

function buildCable(world, l, color, nodeYs, space = null) {
  const { curve, len } = linkCurve(world, l, nodeYs, space);
  const r = RADIUS[l.layer] * (space ? space.k : 1);
  const segs = Math.max(8, Math.ceil(len * 1.6));
  // data-network links are dashed: packets, not glass
  const dashed = LAYER[l.layer].data;
  const mat = dashed
    ? new THREE.MeshToonMaterial({ color, gradientMap: gradient, alphaMap: dash.clone(), alphaTest: 0.5 })
    : new THREE.MeshToonMaterial({ color, gradientMap: gradient });
  if (mat.alphaMap) {
    mat.alphaMap.repeat.set(Math.max(2, Math.round(len / (1.6 * (space ? space.k : 1)))), 1);
    mat.alphaMap.needsUpdate = true;
  }
  const sides = space ? 12 : 6;   // fat cables in open space need rounder tubes
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, segs, r, sides, false), mat);
  mesh.castShadow = l.layer !== 'submarine';
  const ink = new THREE.Mesh(new THREE.TubeGeometry(curve, segs, r + 0.11 * (space ? space.k : 1), sides, false),
    dashed ? new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide, alphaMap: mat.alphaMap, alphaTest: 0.5 }) : inkMat.clone());
  ink.raycast = () => {};
  mesh.add(ink);
  const table = curve.getSpacedPoints(Math.max(8, Math.ceil(len * 2)));
  return { mesh, table, len, mat, ink };
}

// The dashed pole that ties a floating router to the building it lives in.
function routerPole(x, yTop, yBottom, z, color) {
  const h = yTop - yBottom;
  const mat = new THREE.MeshBasicMaterial({ color, alphaMap: dash.clone(), alphaTest: 0.5 });
  mat.alphaMap.repeat.set(Math.max(2, Math.round(h / 0.9)), 1);
  mat.alphaMap.needsUpdate = true;
  const geo = new THREE.CylinderGeometry(0.08, 0.08, h, 6, 1, true);
  // swap uv so the dash runs up the pole
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) { const u = uv.getX(i); uv.setXY(i, uv.getY(i), u); }
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, yBottom + h / 2, z);
  m.raycast = () => {};
  return m;
}

// The drill-down view: one major network on its own, floating in open space.
// No planet, terrain or buildings: just its sites, its cables and the traffic on them,
// laid out where they sit on the map but flat, and scaled so a far-flung network
// (the submarine cables) reads as clearly as a compact one (the metro).

const DETAIL_SPEED = { dci: 16, backbone: 20, regional: 13, metro: 15, submarine: 14, ipcore: 18, agg: 13, access: 8, xhaul: 10 };

function buildDetail(world, part) {
  const scene = new THREE.Scene();
  const nodes = part.nodes.map((id) => world.byId[id]);
  const links = part.links.map((id) => world.links.find((l) => l.id === id));

  // A network on one side is laid flat; one that wraps between sides (the subsea
  // cables) keeps its shape round an invisible planet instead.
  const sphere = new Set(nodes.map((n) => n.side)).size > 1;
  const box = new THREE.Box3();
  for (const n of nodes) box.expandByPoint(sphere ? sph(n.x, 0, n.z, n.side) : new THREE.Vector3(n.x, 0, n.z));
  const size = box.getSize(new THREE.Vector3());
  const extent = Math.max(size.x, size.y, size.z, 30);
  const mid = box.getCenter(new THREE.Vector3());
  const space = { sphere, cx: mid.x, cz: mid.z, k: THREE.MathUtils.clamp(extent / 70, 1, 4) };
  const center = sphere ? new THREE.Vector3(0, mid.y, 0) : new THREE.Vector3();
  // the side of the network to look at it from
  // (a wrap-round network is seen from high over the pole, so the whole loop of it shows)
  // (the subsea cables cross round the southern ocean, so that view is from the south)
  const viewDir = sphere
    ? new THREE.Vector3().setFromSphericalCoords(1, Math.PI - 0.62, Math.atan2(mid.x, mid.z) + 0.4)
    : new THREE.Vector3().setFromSphericalCoords(1, 0.85, 0.3);

  // Sites sit on an invisible floor; routers float above the hubs that house them.
  // In the undersea view the landing stations stand on the shore, above the water,
  // and everything else lies on the sea floor.
  const SURFACE = 5.5 * space.k;
  const ys = {};
  for (const n of nodes) ys[n.id] = n.type === 'router' ? (n.tier === 'core' ? 12 : 8.5) * space.k : sphere && n.type === 'cls' ? SURFACE : 0;

  scene.add(new THREE.HemisphereLight('#ffffff', '#8a9bb5', 1.7));
  const sun = new THREE.DirectionalLight('#fff4e0', 2.2);
  sun.position.copy(center).addScaledVector(viewDir, extent * 1.3).add(new THREE.Vector3(-extent * 0.4, extent * 0.5, 0));
  sun.target.position.copy(center);
  scene.add(sun.target);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -extent, right: extent, top: extent, bottom: -extent, near: 1, far: extent * 4 });
  sun.shadow.bias = -0.003;
  sun.shadow.normalBias = 0.5 * space.k;
  scene.add(sun);

  // Nothing to stand on, but soft shadows underneath give the network some depth.
  if (!sphere) {
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(extent * 3, extent * 3), new THREE.ShadowMaterial({ opacity: 0.16 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.7 * space.k;
  floor.receiveShadow = true;
  floor.raycast = () => {};
  scene.add(floor);
  }

  const movers = [], toys = [];
  if (sphere) {
    // The sea: a sandy floor, a translucent surface above the network, and whales.
    // deep water behind, a sandy floor under the cables, sunlight filtering down
    scene.background = new THREE.Color('#1b6fa8');
    scene.fog = new THREE.Fog('#1b6fa8', PLANET_R * 1.6, PLANET_R * 4.6);
    scene.add(new THREE.AmbientLight('#7fc4e8', 0.9));
    const floor = new THREE.Mesh(new THREE.SphereGeometry(PLANET_R - 0.9 * space.k, 96, 72),
      new THREE.MeshToonMaterial({ color: '#d8c48c', transparent: true, opacity: 0.6, depthWrite: false }));
    floor.receiveShadow = true;
    floor.raycast = () => {};
    floor.renderOrder = 1;
    scene.add(floor);
    const water = new THREE.Mesh(new THREE.SphereGeometry(PLANET_R + SURFACE - 0.6 * space.k, 96, 72),
      new THREE.MeshToonMaterial({ color: '#5ecbff', transparent: true, opacity: 0.18, depthWrite: false, side: THREE.DoubleSide }));
    water.renderOrder = 2;
    water.raycast = () => {};
    scene.add(water);
    // risers: the cable climbs from the floor up to each landing station
    for (const l of links) for (const id of [l.a, l.b]) {
      const n = world.byId[id];
      if (n.type !== 'cls') continue;
      const bottom = sph(n.x, 0.5 * space.k, n.z, n.side), top = sph(n.x, SURFACE - 0.2 * space.k, n.z, n.side);
      const h = bottom.distanceTo(top);
      const riser = new THREE.Mesh(new THREE.CylinderGeometry(0.36 * space.k, 0.36 * space.k, h, 8), toon(LAYER.submarine.color));
      riser.position.lerpVectors(bottom, top, 0.5);
      riser.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), top.clone().sub(bottom).normalize());
      riser.raycast = () => {};
      scene.add(riser);
    }
    // whales cruising just above the floor, each on its own slow circle round the planet
    const Y = new THREE.Vector3(0, 1, 0);
    [[0.25, 0.9, 1.0], [-0.4, 0.7, 1.3], [0.9, -0.3, 0.8]].forEach(([ax, az, sc], i) => {
      const w = whale(sc * space.k * 0.9);
      scene.add(w);
      toys.push(w);
      const axis = new THREE.Vector3(ax, 1, az).normalize();
      const u0 = new THREE.Vector3().crossVectors(axis, Y).normalize();
      const v0 = new THREE.Vector3().crossVectors(axis, u0).normalize();
      const speed = 0.045 + i * 0.012, phase = i * 2.1;
      movers.push((t) => {
        const a = t * speed + phase;
        const up = u0.clone().multiplyScalar(Math.cos(a)).addScaledVector(v0, Math.sin(a)).normalize();
        const fwd = u0.clone().multiplyScalar(-Math.sin(a)).addScaledVector(v0, Math.cos(a)).normalize();
        const right = new THREE.Vector3().crossVectors(up, fwd).normalize();
        w.position.copy(up).multiplyScalar(PLANET_R + (1.8 + 0.6 * Math.sin(t * 0.7 + phase)) * space.k);
        w.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(fwd, up, right));
        w.userData.tail.rotation.z = Math.sin(t * 2.2 + phase) * 0.35;
      });
    });
  }

  const nodeObjs = {}, pickables = [];
  for (const n of nodes) {
    const g = modelFor(n, LAYER[n.layers[0]].color);
    if (sphere) place(g, n.x, ys[n.id], n.z, 0, n.side);
    else g.position.set(n.x - space.cx, ys[n.id], n.z - space.cz);
    g.scale.setScalar(space.k);
    g.traverse((o) => {
      o.userData.nodeId = n.id;
      // the underwater haze is for the water, not the equipment lying in it
      if (sphere && o.material) for (const m of [].concat(o.material)) m.fog = false;
    });
    if (n.type === 'router' && ys[n.host] !== undefined) {
      g.add(routerPole(0, -0.4, (ys[n.host] + 3 * space.k - ys[n.id]) / space.k, 0, LAYER.mpls.color));
    }
    scene.add(g);
    nodeObjs[n.id] = g;
    pickables.push(g);
  }

  const linkObjs = {};
  for (const l of links) {
    const c = buildCable(world, l, LAYER[l.layer].color, ys, space);
    if (sphere) { c.mesh.renderOrder = 5; c.ink.renderOrder = 5; c.mat.fog = false; c.ink.material.fog = false; c.mat.depthTest = true; }
    scene.add(c.mesh);
    linkObjs[l.id] = { ...c, layer: l.layer };
  }

  // Traffic, one instanced mesh per layer present.
  const packets = [];
  for (const layer of new Set(links.map((l) => l.layer))) {
    const runs = [];
    for (const l of links.filter((x) => x.layer === layer)) {
      const n = Math.max(1, Math.round(linkObjs[l.id].len / (layer === 'access' ? 6 : 10)));
      for (let k = 0; k < n; k++) runs.push({ link: linkObjs[l.id], phase: (k + Math.random() * 0.5) / n, dir: k % 2 ? -1 : 1 });
    }
    const col = new THREE.Color(LAYER[layer].color).lerp(new THREE.Color('#ffffff'), 0.45);
    const mesh = new THREE.InstancedMesh(new THREE.SphereGeometry((layer === 'access' ? 0.32 : 0.48) * space.k, 10, 8), new THREE.MeshBasicMaterial({ color: col }), runs.length);
    mesh.raycast = () => {};
    scene.add(mesh);
    packets.push({ layer, mesh, runs });
  }
  let fxRef = null;
  const m4 = new THREE.Matrix4(), v = new THREE.Vector3();
  function update(t, traffic, dt = 0) {
    fxRef.update(dt, t);
    for (const m of movers) m(t);
    for (const { layer, mesh, runs } of packets) {
      mesh.visible = traffic;
      if (!traffic) continue;
      runs.forEach((p, i) => {
        const tab = p.link.table;
        let u = (p.phase + (t * DETAIL_SPEED[layer]) / p.link.len) % 1;
        if (p.dir < 0) u = 1 - u;
        const f = u * (tab.length - 1), k = Math.floor(f);
        v.copy(tab[k]).lerp(tab[Math.min(k + 1, tab.length - 1)], f - k);
        mesh.setMatrixAt(i, m4.makeTranslation(v.x, v.y, v.z));
      });
      mesh.instanceMatrix.needsUpdate = true;
    }
    for (const id in linkObjs) if (linkObjs[id].mat.alphaMap) linkObjs[id].mat.alphaMap.offset.x = -t * 0.8;
  }

  // Selection ring, laid flat under the picked site (on whatever counts as flat there).
  const ring = new THREE.Group();
  const ringMesh = new THREE.Mesh(new THREE.TorusGeometry(3 * space.k, 0.28 * space.k, 8, 40), new THREE.MeshBasicMaterial({ color: '#ffffff' }));
  ringMesh.rotation.x = -Math.PI / 2;
  ringMesh.raycast = () => {};
  ring.add(ringMesh);
  ring.visible = false;
  scene.add(ring);

  const fx = buildFx({ scene, nodes, links, nodeObjs, linkObjs, space });
  fxRef = fx;
  return { scene, nodes, links, nodeObjs, linkObjs, pickables, ring, ringMesh, update, extent, space, center, viewDir, fx, toys };
}

// ---------------------------------------------------------------- effects
//
// What a technology explainer can do to the network on screen: light links up or
// dim them, cut or block one, put a glow under a site, run a labelled packet along
// a path, pin an HTML tag or a queue readout to a point. `clear()` puts it all back.


function buildFx({ scene, nodes, links, nodeObjs, linkObjs, space }) {
  const k = space.k;
  const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
  const base = {};
  for (const id in linkObjs) base[id] = linkObjs[id].mat.color.clone();
  const packets = [], spots = [], anchors = [], temps = [];
  const Y = new THREE.Vector3(0, 1, 0);
  const upAt = (o) => Y.clone().applyQuaternion(o.quaternion);

  // the link joining two sites in this view, if any
  const link = (a, b) => links.find((l) => (l.a === a && l.b === b) || (l.a === b && l.b === a))?.id ?? null;
  // every link in this view, or just those of one layer
  const linksOf = (layer) => links.filter((l) => !layer || l.layer === layer).map((l) => l.id);

  // shortest path by hops from one site to another, optionally keeping off some links
  function path(from, to, avoid = []) {
    const skip = new Set(avoid);
    const prev = { [from]: null }, queue = [from];
    while (queue.length) {
      const cur = queue.shift();
      if (cur === to) break;
      for (const l of links) {
        if (skip.has(l.id)) continue;
        const next = l.a === cur ? l.b : l.b === cur ? l.a : null;
        if (next && !(next in prev)) { prev[next] = cur; queue.push(next); }
      }
    }
    if (!(to in prev)) return null;
    const out = [];
    for (let n = to; n; n = prev[n]) out.unshift(n);
    return out;
  }

  const nodePos = (id, lift = 0) => nodeObjs[id].position.clone().addScaledVector(upAt(nodeObjs[id]), lift * k);

  function linkState(id, state) {
    const o = linkObjs[id];
    if (!o) return;
    o.mat.transparent = state === 'dim';
    o.mat.opacity = state === 'dim' ? 0.14 : 1;
    o.mat.depthWrite = state !== 'dim';
    o.ink.visible = state !== 'dim';
    o.mesh.visible = state !== 'off';
    o.mat.color.copy(base[id]);
    if (state === 'glow') o.mat.color.lerp(new THREE.Color('#ffffff'), 0.3);
    if (state === 'cut') o.mat.color.set('#b0b7c3');
    o.mat.needsUpdate = true;
  }

  // light a set of links (and nothing else)
  function focus(linkIds) {
    const keep = new Set(linkIds);
    for (const id in linkObjs) linkState(id, keep.has(id) ? 'glow' : 'dim');
  }
  const pathLinks = (ids) => ids.slice(1).map((b, i) => link(ids[i], b));

  function spot(id, color = '#ffffff') {
    const o = nodeObjs[id];
    const m = new THREE.Mesh(new THREE.TorusGeometry(2.6 * k, 0.22 * k, 8, 36), new THREE.MeshBasicMaterial({ color }));
    m.rotation.x = -Math.PI / 2;
    m.raycast = () => {};
    const g = new THREE.Group();
    g.position.copy(o.position);
    g.quaternion.copy(o.quaternion);
    g.add(m);
    scene.add(g);
    spots.push({ g, m, phase: Math.random() * 6 });
    o.scale.setScalar(k * 1.1);
    return g;
  }

  // an HTML element that follows a 3D point (a fixed vector or a function returning one)
  function anchor(html, at, cls = '') {
    const el = document.createElement('div');
    el.className = 'fxtag ' + cls;
    el.innerHTML = html;
    document.querySelector('#detail-labels').append(el);
    const a = { el, at: typeof at === 'function' ? at : () => at };
    anchors.push(a);
    return a;
  }

  // a cut or a block marker on the middle of a link; the words come from `fx.words`
  // so the beginner and the engineer read it in their own vocabulary
  function marker(linkId, kind) {
    const o = linkObjs[linkId];
    const mid = o.table[Math.floor(o.table.length / 2)].clone();
    if (kind === 'cut') linkState(linkId, 'cut');
    return anchor(kind === 'cut' ? `<b>✕</b> ${fx.words.cut}` : `<b>▮</b> ${fx.words.block}`, mid, 'mark ' + kind);
  }

  // a packet running along a path of sites; `tag` is HTML that rides with it
  function packet(ids, { color = '#ffffff', speed = 14, loop = true, tag = null, size = 0.55, onHop = null, delay = 0 } = {}) {
    const pts = [], hops = [0];
    for (let i = 1; i < ids.length; i++) {
      const lid = link(ids[i - 1], ids[i]);
      if (!lid) continue;
      const l = links.find((x) => x.id === lid);
      let tab = linkObjs[lid].table;
      if (l.a !== ids[i - 1]) tab = [...tab].reverse();
      for (const p of tab) if (!pts.length || pts[pts.length - 1].distanceTo(p) > 1e-4) pts.push(p.clone());
      hops.push(pts.length - 1);
    }
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(size * k, 12, 10), new THREE.MeshBasicMaterial({ color }));
    const halo = new THREE.Mesh(new THREE.SphereGeometry(size * k * 1.5, 12, 10), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3 }));
    mesh.add(halo);
    mesh.raycast = () => {};
    mesh.visible = false;
    scene.add(mesh);
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + pts[i].distanceTo(pts[i - 1]));
    const total = cum[cum.length - 1] || 1;
    const pk = { mesh, pts, cum, total, hops, speed: speed * k, loop, s: -delay * speed * k, hop: 0, onHop, tagEl: null, done: false };
    if (tag) pk.tag = anchor(tag, () => mesh.position.clone().addScaledVector(Y, 1.6 * k), 'ride');
    packets.push(pk);
    return pk;
  }

  // a queue readout pinned above a site: lanes of bars, each a class of traffic
  function queue(id, lanes) {
    const html = `<div class="q">${lanes.map((l) => `<div class="lane"><i style="--c:${l.color};height:${Math.round(l.fill * 100)}%"></i><span>${l.name}</span></div>`).join('')}</div>`;
    const a = anchor(html, nodePos(id, 7), 'queue');
    return { set: (i, fill) => { a.el.querySelectorAll('i')[i].style.height = Math.round(fill * 100) + '%'; } };
  }

  function clear() {
    for (const id in linkObjs) linkState(id, 'normal');
    for (const pk of packets) { scene.remove(pk.mesh); }
    for (const s of spots) scene.remove(s.g);
    for (const a of anchors) a.el.remove();
    for (const o of temps) scene.remove(o);
    for (const n of nodes) nodeObjs[n.id].scale.setScalar(k);
    packets.length = spots.length = anchors.length = temps.length = 0;
  }

  function update(dt, t) {
    for (const s of spots) {
      const p = 1 + 0.12 * Math.sin(t * 4 + s.phase);
      s.m.scale.set(p, p, 1);
    }
    for (const pk of packets) {
      if (pk.done) continue;
      pk.s += pk.speed * dt;
      if (pk.s < 0) continue;
      if (pk.s >= pk.total) {
        if (pk.loop) { pk.s -= pk.total; pk.hop = 0; if (pk.onHop) pk.onHop(0, pk); }
        else { pk.s = pk.total; pk.done = true; if (pk.onHop) pk.onHop(pk.hops.length - 1, pk); }
      }
      pk.mesh.visible = true;
      let i = 1;
      while (i < pk.cum.length - 1 && pk.cum[i] < pk.s) i++;
      const f = (pk.s - pk.cum[i - 1]) / ((pk.cum[i] - pk.cum[i - 1]) || 1);
      pk.mesh.position.lerpVectors(pk.pts[i - 1], pk.pts[i], Math.min(1, f));
      const hop = pk.hops.findIndex((h, j) => j === pk.hops.length - 1 || pk.hops[j + 1] > i - 1);
      if (hop !== pk.hop) { pk.hop = hop; if (pk.onHop) pk.onHop(hop, pk); }
    }
  }

  const fx = { byId, link, linksOf, path, pathLinks, nodePos, linkState, focus, spot, anchor, marker, packet, queue, clear, update, anchors, words: { cut: 'fibre cut', block: 'RPL blocked' } };
  return fx;
}


// Technology explainers: for each network, the technologies that matter in that
// space, each told in a few steps that play out live on the network. A step gets
// a clean scene and describes everything it wants shown, so Back and Next are
// just "show step i". No three.js in here; the steps talk to the view's `fx`.

const TC = {
  wave: '#ff7f50', wave2: '#9b5de5', wave3: '#2ec4b6', red: '#e63946', white: '#ffffff',
  voice: '#e63946', video: '#ff8c1a', biz: '#2f80ed', best: '#8d99ae', ccm: '#2ec4b6', frame: '#7b2cbf',
};

// Reusable scene recipes.
const glowPath = (fx, ids) => { fx.focus(fx.pathLinks(ids)); return ids; };
const cores = (fx) => Object.values(fx.byId).filter((n) => n.type === 'core').map((n) => n.id);
const ofType = (fx, t) => Object.values(fx.byId).filter((n) => n.type === t).map((n) => n.id);
const sidTag = (sid) => `<span class="sid">${sid}</span>`;
const stackTag = (labels) => `<span class="stack">${labels.map((l) => `<b>${l}</b>`).join('')}</span>`;

// A packet whose label stack pops one label at each hop.
function srPacket(fx, ids, sids, color = TC.biz, speed = 9) {
  const pk = fx.packet(ids, { color, speed, tag: stackTag(sids) });
  pk.onHop = (hop) => { pk.tag.el.innerHTML = stackTag(sids.slice(hop)) || '<span class="stack empty">payload</span>'; };
  return pk;
}

// Continuity-check heartbeats both ways between two MEPs.
function ccm(fx, a, b, period = 1.4) {
  const ids = fx.path(a, b);
  fx.focus(fx.pathLinks(ids));
  fx.anchor('<b>MEP</b>', fx.nodePos(a, 6), 'mep');
  fx.anchor('<b>MEP</b>', fx.nodePos(b, 6), 'mep');
  fx.packet(ids, { color: TC.ccm, speed: 16, size: 0.35, tag: '<span class="ccm">CCM</span>' });
  fx.packet([...ids].reverse(), { color: TC.ccm, speed: 16, size: 0.35, delay: period / 2, tag: '<span class="ccm">CCM</span>' });
  return ids;
}

// Steps through a topic on a view's fx. Each step starts from a clean scene.
export class TechPlayer {
  constructor(fx) { this.fx = fx; this.topic = null; this.i = 0; }
  open(topic, i = 0) { this.topic = topic; return this.show(i); }
  show(i) {
    this.i = Math.max(0, Math.min(this.topic.steps.length - 1, i));
    this.fx.clear();
    this.topic.steps[this.i].run(this.fx);
    return this.topic.steps[this.i];
  }
  next() { return this.show(this.i + 1); }
  back() { return this.show(this.i - 1); }
  close() { this.fx.clear(); this.topic = null; }
}

// and down the open-sea stretch of its route, so the ocean is busy on both sides.
const ships = [];

  const route = linkDirs(world, l, 1).map((d) => new THREE.Vector3(...d));
  // the longest stretch that is properly at sea
  let best = [0, 0], run = 0, start = 0;
  route.forEach((d, i) => {
    if (heightDir(d.x, d.y, d.z) < -1.2) { if (!run) start = i; run++; if (run > best[1] - best[0]) best = [start, start + run]; } else run = 0;
  });
  if (best[1] - best[0] < 20) continue;
  const ship = cableShip();
  ship.scale.setScalar(0.9);
  scene.add(ship);
  ships.push({ ship, route: route.slice(best[0] + 3, best[1] - 3), s: Math.random() * 40, dir: 1 });
}
const _sU = new THREE.Vector3(), _sF = new THREE.Vector3(), _sR = new THREE.Vector3(), _sM = new THREE.Matrix4();
function sailShips(t, dt) {
  for (const sh of ships) {
    sh.s += dt * 1.1 * sh.dir;
    if (sh.s >= sh.route.length - 2) { sh.s = sh.route.length - 2; sh.dir = -1; }
    if (sh.s <= 0) { sh.s = 0; sh.dir = 1; }
    const i = Math.floor(sh.s), f = sh.s - i;
    _sU.lerpVectors(sh.route[i], sh.route[i + 1], f).normalize();
    _sF.subVectors(sh.route[i + 1], sh.route[i]).multiplyScalar(sh.dir).normalize();
    _sR.crossVectors(_sU, _sF).normalize();
    _sF.crossVectors(_sR, _sU).normalize();
    sh.ship.position.copy(_sU).multiplyScalar(R + 0.15 + Math.sin(t * 1.6 + i) * 0.08);
    sh.ship.quaternion.setFromRotationMatrix(_sM.makeBasis(_sF, _sU, _sR));
  }
}

  if (mode !== 'detail') return;
  if (e.key === 'ArrowRight' && player) $('#t-next').click();
  if (e.key === 'ArrowLeft' && player) $('#t-back').click();
  if (e.key !== 'Escape') return;
  if (selected) selectInDetail(null); else if (player) closeTopic(); else $('#btn-back').click();
});

// ---------------------------------------------------------------- switching mode

function applyMode(id) {
  modeId = id;
  V = vocab(id);
  document.documentElement.dataset.mode = id;
  try { localStorage.setItem(MODE_KEY, id); } catch {}
  for (const b of document.querySelectorAll('.modes [data-mode]')) b.setAttribute('aria-pressed', String(b.dataset.mode === id));
  $('#subtitle').textContent = V.subtitle;
  plane.visible = V.plain;
  for (const k in details) dressDetail(details[k]);
  listSide(listedSide, true);
  if (mode === 'detail') {
    // the explainers differ between modes, so an open one closes
    if (player) { player.close(); player = null; }
    techCard.hidden = true;
    if (location.hash.includes('.')) history.replaceState(null, '', `#${detailId}`);
    renderDetailPanel(detailId);
    if (selected) selectInDetail(selected);
  } else {
    hint.textContent = V.hints.globe;
  }
}
for (const b of document.querySelectorAll('.modes [data-mode]')) b.addEventListener('click', () => { if (b.dataset.mode !== modeId) applyMode(b.dataset.mode); });
applyMode(modeId);

// ---------------------------------------------------------------- loop

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false);
    camera.aspect = rig.aspect = detailCam.aspect = w / h;
    camera.updateProjectionMatrix();
    rig.updateProjectionMatrix();
    detailCam.updateProjectionMatrix();
  }
}

const clock = new THREE.Clock();
let t = 0;
function frame(now) {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (!reduceMotion) t += dt;
  resize();
  if (mode === 'globe') {
    stepFlight(now);
    controls.update();
    aimCamera();
    if (!flight) listSide(sideInView());
    for (const m of life.movers) m(t, reduceMotion ? 0 : dt);
    flyPlane(t);
    sailShips(t, dt);
    tweenHalos(dt, t);
    for (const b of blinkers) b.visible = Math.sin(t * 4 + b.id) > -0.2;
    for (const p of puffs) p.position.y = 4.4 + p.userData.puff * 0.9 + ((t * 0.8 + p.userData.puff / 3) % 1) * 0.9;
    hover();
    placeLabels();
    renderer.render(scene, camera);
  } else {
    detailControls.update();
    detail.update(t, opts.traffic && !player, dt);
    detail.ringMesh.rotation.z = t;
    hover();
    const r = canvas.getBoundingClientRect();
    for (const L of detail.labels) {
      const [x, y, z] = toScreen(L.pos, detailCam, r);
      L.el.hidden = !opts.labels || z > 1 || !!player;
      L.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`;
    }
    for (const a of detail.fx.anchors) {
      const [x, y, z] = toScreen(a.at(), detailCam, r);
      a.el.hidden = z > 1;
      a.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -100%)`;
    }
    renderer.render(detail.scene, detailCam);
  }
  requestAnimationFrame(frame);
}
route();
requestAnimationFrame(frame);
window.netlandia = { world, openMajor, closeMajor, selectInDetail, emphasise, flyTo, camera, controls, nodeObjs, get player() { return player; } };
window.netlandiaFlat = (x, z, side = 0) => flatToDir(x, z, side);

</script>
