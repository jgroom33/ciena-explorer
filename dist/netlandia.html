<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Netlandia Network Map</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Two looks, picked by html[data-mode]. Explorer (the default) is the board game:
   sticker cards with ink outlines over a daylight sky. Engineer swaps the tokens at
   the bottom of this file for a quiet, flat console. Every colour is set explicitly;
   the OS theme is not consulted. */
:root {
  --ink: #1d2a44;
  --paper: #ffffff;
  --sky-1: #a9dcff;
  --sky-2: #e3f4ff;
  --muted: #56627a;
  --accent: #2f80ed;
  --display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --line: 2.5px solid var(--ink);
  --lift: 0 4px 0 var(--ink);
  --lift-s: 0 2px 0 var(--ink);
  --lift-m: 0 3px 0 var(--ink);
  --rule: 2px solid var(--ink);
  --radius: 16px;
  --radius-s: 10px;
  --tilt: rotate(-1.5deg);
  --well: #eef4fb;
  --sel-bg: var(--ink);
  --sel-fg: var(--paper);
  --sel-sub: var(--sky-1);
  --hint-bg: rgb(29 42 68 / 0.82);
  --title-stroke: 1.5px var(--ink);
  --city-stroke: 4px var(--ink);
  --town-stroke: 3px var(--ink);
  --city-shadow: 0 3px 0 var(--ink);
  --town-shadow: 0 2px 0 var(--ink);
  --press: translateY(2px);
  --label-case: none;
  --label-space: 0.12em;
  color-scheme: light;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 30%, var(--sky-2), var(--sky-1));
  color: var(--ink);
  font: 500 14px/1.4 var(--body);
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app { position: relative; height: 100%; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels, .labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

/* ------------------------------------------------ labels on the map */
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
.lbl.city {
  font: 400 15px/1 var(--display);
  letter-spacing: 0.02em;
  color: var(--paper);
  -webkit-text-stroke: var(--city-stroke);
  paint-order: stroke fill;
  text-shadow: var(--city-shadow);
}
.lbl.city.big { font-size: 21px; }
.lbl.city.town { font-size: 12.5px; -webkit-text-stroke: var(--town-stroke); text-shadow: var(--town-shadow); }
.lbl.tag {
  font: 800 11px/1 var(--body);
  background: var(--paper);
  border: var(--rule);
  border-left: 7px solid var(--c);
  border-radius: 6px;
  padding: 3px 6px;
  box-shadow: var(--lift-s);
}
.lbl.tip {
  display: grid; gap: 1px;
  background: var(--paper); border: var(--line); border-radius: var(--radius-s);
  padding: 6px 10px; box-shadow: var(--lift);
  border-top: 6px solid var(--c);
}
.lbl.tip b { font: 400 15px/1.1 var(--display); letter-spacing: 0.01em; }
.lbl.tip span { font-size: 12px; color: var(--muted); font-weight: 700; }

/* ------------------------------------------------ HUD pieces */
.title, .panel, .card, .caption {
  position: absolute;
  background: var(--paper);
  border: var(--line);
  border-radius: var(--radius);
  box-shadow: var(--lift);
}
.title {
  top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
  padding: 8px 16px 10px;
  transform: var(--tilt);
}
.title h1 {
  margin: 0;
  font: 400 34px/1 var(--display);
  letter-spacing: 0.02em;
  color: var(--accent);
  -webkit-text-stroke: var(--title-stroke);
  paint-order: stroke fill;
}
.title p { margin: 2px 0 0; font-weight: 800; font-size: 13px; color: var(--muted); }
/* the reading-mode switch under the title */
.modes { display: grid; grid-template-columns: 1fr 1fr; margin-top: 8px; border: var(--rule); border-radius: var(--radius-s); overflow: hidden; }
.modes button { display: grid; padding: 4px 10px; border: 0; background: var(--paper); text-align: center; }
.modes button + button { border-left: var(--rule); }
.modes b { font: 400 14px/1.1 var(--display); letter-spacing: 0.02em; }
.modes span { font-size: 10.5px; font-weight: 800; color: var(--muted); }
.modes button[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-fg); }
.modes button[aria-pressed="true"] span { color: var(--sel-sub); }

.panel {
  /* sits under the title card, whose height the script measures into --title-h */
  top: calc(var(--title-h, 86px) + 30px + env(safe-area-inset-top, 0px)); left: 16px;
  width: 268px;
  padding: 12px;
  display: grid; gap: 10px;
  max-height: calc(100% - var(--title-h, 86px) - 74px);
  overflow: auto;
}
.panel h2 { margin: 0 2px; font: 400 13px/1 var(--display); letter-spacing: var(--label-space); text-transform: uppercase; color: var(--muted); }
.sides { display: grid; grid-template-columns: 1fr 1fr; border: var(--rule); border-radius: 12px; overflow: hidden; }
.sides button {
  display: grid; gap: 0; padding: 6px 8px; border: 0; background: var(--paper); text-align: center;
}
.sides button + button { border-left: var(--rule); }
.sides b { font: 400 16px/1.1 var(--display); letter-spacing: 0.02em; }
.sides span { font-size: 11.5px; font-weight: 800; color: var(--muted); }
.sides button[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-fg); }
.sides button[aria-pressed="true"] span { color: var(--sel-sub); }
#majors { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.major {
  width: 100%;
  display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 9px;
  text-align: left; padding: 8px 10px;
  background: var(--paper); border: var(--rule); border-radius: 12px;
  box-shadow: var(--lift-m);
  min-width: 0;
}
.major:hover, .major.lit { background: color-mix(in srgb, var(--c) 18%, var(--paper)); }
.major:active { transform: var(--press); box-shadow: none; }
.wire {
  height: 10px; border-radius: 6px; background: var(--c);
  border: var(--rule);
  position: relative;
}
.wire::after { content: ''; position: absolute; top: 1px; left: 3px; width: 5px; height: 4px; border-radius: 3px; background: rgb(255 255 255 / 0.8); }
/* data-network links are drawn dashed on the globe, so their swatch is too */
.wire.dashed { background: repeating-linear-gradient(90deg, var(--c) 0 6px, transparent 6px 10px); }
.wire.dashed::after { display: none; }
.txt { display: grid; min-width: 0; }
.nm { font-weight: 800; font-size: 14px; line-height: 1.15; }
.st { font-size: 11.5px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.go {
  font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px;
  border: var(--rule); background: var(--c);
}
.opts { display: flex; gap: 6px; flex-wrap: wrap; }
.opts button {
  flex: 1; padding: 4px 8px; font-size: 12px; font-weight: 800;
  border: var(--rule); border-radius: 999px; background: var(--paper);
}
.opts button[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-fg); }

/* drill-down header */
.detail { border-top: 10px solid var(--c); gap: 6px; }
.detail h2 { font: 400 26px/1.05 var(--display); letter-spacing: 0.01em; text-transform: none; color: var(--ink); margin: 2px 0 0; text-wrap: balance; }
.detail p { margin: 0; }
.d-stats { font-size: 12px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.d-layers { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.back {
  justify-self: start; padding: 6px 12px; font-weight: 800;
  border: var(--rule); border-radius: 999px; background: var(--accent); color: var(--paper);
  box-shadow: var(--lift-s);
}
.back:active { transform: var(--press); box-shadow: none; }

/* technology topics in the network panel */
.d-h { margin: 10px 0 0; font: 400 12px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.topics { display: grid; gap: 6px; }
.topic {
  display: grid; gap: 1px; text-align: left; padding: 7px 10px;
  background: var(--paper); border: var(--rule); border-radius: var(--radius-s); box-shadow: var(--lift-s);
  min-width: 0;
}
.topic b { font-size: 13.5px; font-weight: 800; }
.topic span { font-size: 11.5px; color: var(--muted); font-weight: 700; line-height: 1.25; }
.topic:hover { background: color-mix(in srgb, var(--c) 14%, var(--paper)); }
.topic[aria-pressed="true"] { background: var(--c); color: var(--paper); transform: var(--press); box-shadow: none; }
.topic[aria-pressed="true"] span { color: rgb(255 255 255 / 0.85); }

/* the explainer card */
.tech {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(44px + env(safe-area-inset-bottom, 0px));
  width: min(560px, calc(100% - 32px));
  padding: 12px 16px 14px;
  background: var(--paper); border: var(--line); border-radius: var(--radius); box-shadow: var(--lift);
  border-top: 10px solid var(--c);
  display: grid; gap: 4px;
}
.tech .x {
  position: absolute; top: 6px; right: 8px; width: 30px; height: 30px;
  border: var(--rule); border-radius: 50%; background: var(--paper); font-size: 20px; line-height: 1; padding: 0;
}
.t-tag { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.tech h3 { margin: 0 36px 2px 0; font: 400 24px/1.05 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
.tech p { margin: 0; max-width: 62ch; min-height: 3.6em; }
.t-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
.dots { display: flex; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: var(--rule); background: var(--paper); }
.dots i.on { background: var(--c); }
.t-btns { display: flex; gap: 8px; }
.t-btns button {
  padding: 7px 14px; border: var(--rule); border-radius: var(--radius-s);
  background: var(--paper); box-shadow: var(--lift-s); font-weight: 800;
}
.t-btns button:disabled { opacity: 0.4; box-shadow: none; }
.t-btns button:active:not(:disabled) { transform: var(--press); box-shadow: none; }
.tech:not([hidden]) ~ .hint { display: none; }

/* tags the explainers pin to the scene */
.fxtag {
  position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform;
  font: 800 11.5px/1 var(--body); color: var(--ink);
  background: var(--paper); border: var(--rule); border-radius: 8px; padding: 4px 7px;
  box-shadow: var(--lift-s);
}
.fxtag.ride { font-variant-numeric: tabular-nums; }
.fxtag.mark.cut { background: #ffe5e8; border-color: #e63946; color: #b3202c; }
.fxtag.mark.block { background: #fff4d6; }
.fxtag.mep { background: #e0f7f4; border-radius: 999px; }
.fxtag.note { background: var(--well); }
.fxtag.note.warn { background: #ffe5e8; color: #b3202c; border-color: #e63946; }
.fxtag .sid { font-family: var(--display); font-weight: 400; font-size: 13px; letter-spacing: 0.04em; }
.fxtag .stack { display: inline-flex; gap: 2px; }
.fxtag .stack b { display: inline-block; padding: 2px 6px; background: #2f80ed; color: #fff; border-radius: 4px; font-family: var(--display); font-weight: 400; letter-spacing: 0.04em; }
.fxtag .stack.empty { color: var(--muted); }
.fxtag .ccm { color: #0b7a6f; }
.fxtag.queue { padding: 6px 8px 4px; }
.q { display: flex; gap: 6px; align-items: flex-end; }
.lane { display: grid; justify-items: center; gap: 3px; }
.lane i { display: block; width: 14px; height: 10%; min-height: 3px; background: var(--c); border: var(--rule); border-radius: 3px; align-self: end; transition: height 0.8s ease; }
.lane { height: 54px; grid-template-rows: 1fr auto; }
.lane span { font-size: 9.5px; font-weight: 800; color: var(--muted); }

/* info card */
.card {
  top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px;
  width: 300px;
  padding: 14px 16px 16px;
  border-top: 10px solid var(--c);
  max-height: calc(100% - 80px); overflow: auto;
}
.card .x {
  position: absolute; top: 6px; right: 8px; width: 30px; height: 30px;
  border: var(--rule); border-radius: 50%; background: var(--paper);
  font-size: 20px; line-height: 1; padding: 0;
}
.card-k { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.card h3 { margin: 2px 36px 6px 0; font: 400 23px/1.05 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
.card-layers { display: flex; gap: 4px; flex-wrap: wrap; }
.chip {
  font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px;
  border: var(--rule); background: var(--c);
}
.card-role { margin: 8px 0; }
.card dl { margin: 0; padding: 8px 10px; background: var(--well); border-radius: var(--radius-s); }
.card dt { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.card dd { margin: 2px 0 0; font-weight: 800; }
.card dl + dl { margin-top: 6px; }
.card h4 { margin: 12px 0 4px; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.card-links { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.card-links button {
  border: var(--rule); background: var(--paper); border-radius: 8px;
  padding: 2px 8px; font-size: 12.5px; font-weight: 700;
}
.card-links button:hover { background: var(--well); }

.hint {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  margin: 0; padding: 4px 12px; border-radius: 999px;
  background: var(--hint-bg); color: var(--paper);
  font-size: 12px; font-weight: 700; white-space: nowrap;
  max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
}

/* ------------------------------------------------ Netlandia Quest (js/game.js) */
.major.locked { background: var(--well); }
.major.locked .nm { color: var(--muted); }
.major.locked .wire { opacity: 0.35; }
.major.locked .go { background: var(--paper); }

/* the score bar, top right */
.quest {
  position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px;
  display: flex; align-items: center; gap: 8px; max-width: calc(100% - 32px);
}
.quest button, .qcard button, .intro button {
  border: var(--rule); border-radius: var(--radius-s); background: var(--paper);
  box-shadow: var(--lift-s); font-weight: 800; padding: 8px 14px; min-height: 40px;
}
.quest button:active, .qcard button:active, .intro button:active { transform: var(--press); box-shadow: none; }
.q-play { display: grid; text-align: left; gap: 0; border: var(--line) !important; box-shadow: var(--lift) !important; }
.q-play b { font: 400 17px/1.1 var(--display); letter-spacing: 0.02em; }
.q-play span { font-size: 11.5px; color: var(--muted); }
.q-stats {
  display: grid; justify-items: end; padding: 4px 12px; gap: 0;
  background: var(--paper); border: var(--line); border-radius: var(--radius-s); box-shadow: var(--lift-s);
  font-variant-numeric: tabular-nums;
}
.q-rank { font: 400 14px/1.1 var(--display); letter-spacing: 0.02em; color: var(--accent); }
.q-score { font-size: 12px; font-weight: 800; }
.q-score b { font: 400 17px/1 var(--display); }
.q-prog { font-size: 11px; color: var(--muted); font-weight: 800; }
.q-next { background: var(--c) !important; color: #fff; }
.q-menu { width: 40px; padding: 0 !important; font-size: 18px; }

/* the challenge card, bottom centre: taunt, question, win, you died */
.qcard {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(44px + env(safe-area-inset-bottom, 0px));
  width: min(600px, calc(100% - 32px)); max-height: calc(100% - 140px); overflow: auto;
  padding: 14px 18px 16px; z-index: 4;
  background: var(--paper); border: var(--line); border-radius: var(--radius); box-shadow: var(--lift);
  border-top: 10px solid var(--c);
  display: grid; gap: 8px;
}
.qcard h3 { margin: 0; font: 400 26px/1.05 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
.qcard p { margin: 0; }
.q-k { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.q-villain { display: flex; align-items: center; gap: 12px; }
.q-face { font-size: 46px; line-height: 1; filter: drop-shadow(0 3px 0 rgb(0 0 0 / 0.15)); }
.q-say { font-size: 15px; max-width: 62ch; }
.qcard[data-kind="taunt"] .q-say { font-style: italic; }
.qcard dl { margin: 0; padding: 8px 10px; background: var(--well); border-radius: var(--radius-s); }
.qcard dt { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.qcard dd { margin: 2px 0 0; }
.q-sum { font-size: 13px; font-weight: 800; color: var(--muted); }
.q-sum b { color: var(--accent); }
.q-btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 4px; }
.qcard .primary, .intro .primary { background: var(--c, var(--accent)); color: #fff; }
.q-head { display: flex; align-items: center; gap: 10px; }
.q-head .q-k { flex: 1; min-width: 0; }
.q-hearts i { font-style: normal; font-size: 18px; color: var(--muted); opacity: 0.3; }
.q-hearts i.on { color: #e63946; opacity: 1; }
.q-pts { font: 400 16px/1 var(--display); font-variant-numeric: tabular-nums; }
.q-time { height: 8px; border: var(--rule); border-radius: 999px; overflow: hidden; background: var(--well); }
.q-time i { display: block; height: 100%; width: 100%; background: var(--c); transition: width 0.1s linear; }
.q-q { font-size: 21px !important; }
.q-answers { display: grid; gap: 8px; }
.q-answers button { display: flex; align-items: center; gap: 10px; text-align: left; min-height: 48px; font-weight: 700; }
.q-answers button:hover { background: color-mix(in srgb, var(--c) 16%, var(--paper)); }
.q-answers kbd { flex: none; display: grid; place-items: center; width: 24px; height: 24px; border: var(--rule); border-radius: 6px; font: 800 12px/1 var(--body); }
.q-flash { font-weight: 800; }
.q-flash.ok { color: #12825a; }
.q-flash.bad { color: #c2263a; }
.q-level-tag { justify-self: start; font-size: 11px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--well); border: var(--rule); color: var(--muted); }
.q-levelup { display: grid; gap: 2px; padding: 10px 12px; border: var(--line); border-radius: var(--radius-s); background: color-mix(in srgb, #ffc43d 26%, var(--paper)); }
.q-levelup b { font-weight: 800; }
.q-levelup > b:first-child { font: 400 19px/1.1 var(--display); letter-spacing: 0.01em; }
.qcard dl dt:not(:first-child) { margin-top: 6px; }
.q-lanes button:disabled { opacity: 0.35; box-shadow: none; }
.q-review { display: grid; gap: 6px; border: 2px solid #e6a23c; background: color-mix(in srgb, #ffc43d 14%, var(--paper)) !important; }
.q-review dd { display: grid; gap: 1px; margin: 0; padding-top: 6px; border-top: 1px dashed color-mix(in srgb, var(--muted) 50%, transparent); }
.q-review dd:first-of-type { border-top: 0; padding-top: 0; }
.q-review .no { color: #c2263a; font-weight: 700; }
.q-review .yes { color: #12825a; font-weight: 800; }
.q-news { padding: 8px 10px; border: var(--rule); border-radius: var(--radius-s); background: color-mix(in srgb, #2f80ed 12%, var(--paper)); font-weight: 800; }

.qcard[data-kind="game"] { width: min(760px, calc(100% - 32px)); }
.q-canvas { display: block; width: 100%; height: clamp(240px, 46vh, 400px); border: var(--rule); border-radius: var(--radius-s); background: var(--paper); touch-action: none; }
.q-canvas.tall { height: clamp(320px, 58vh, 520px); }
.q-lanes button.tinted { border-color: var(--lane); border-left: 10px solid var(--lane); }
.q-lanes button.tinted kbd { background: var(--lane); border-color: var(--lane); color: #fff; }
.q-lanes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.q-lanes button { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; font-weight: 800; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.q-lanes button.hit { background: color-mix(in srgb, var(--c) 30%, var(--paper)); transform: var(--press); box-shadow: none; }
.q-lanes kbd { display: grid; place-items: center; width: 22px; height: 22px; border: var(--rule); border-radius: 6px; font: 800 11px/1 var(--body); }
.q-quit { min-height: 32px !important; width: 32px; padding: 0 !important; border-radius: 50% !important; }

/* the start screen */
.intro { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; padding: 16px; background: rgb(15 22 40 / 0.45); }
.i-box {
  width: min(460px, 100%); display: grid; gap: 10px; justify-items: center; text-align: center;
  padding: 22px 22px 20px; background: var(--paper); border: var(--line); border-radius: var(--radius); box-shadow: var(--lift);
}

import { OrbitControls } from 'three/addons/OrbitControls.js';
// The world of Netlandia: terrain, places and every network, as plain data.
// No three.js in here, so the tests can check it under node.

// A small planet with a country on each face. Side A (facing +Z) is Photonia and
// carries the transport networks; side B (facing -Z) is Packetland and carries the
// data network. Each side is drawn on its own flat map in x/z and wrapped onto its
// hemisphere with an azimuthal equidistant projection: distance from that side's
// (0, 0) is arc length on the planet. Map north (-z) is +Y on both sides.
const PLANET_R = 100;
const SEA_FLOOR = -6;
const EDGE = (Math.PI / 2) * PLANET_R;   // flat radius of each side's rim

const SIDES = [
  { id: 0, key: 'A', name: 'Transport', land: 'Photonia', home: [-32, 8] },
  { id: 1, key: 'B', name: 'Data network', land: 'Packetland', home: [2, 6] },
];

// Flat (x, z) on a side -> unit vector from the planet centre.
function flatToDir(x, z, side = 0) {
  const r = Math.hypot(x, z);
  const s = r > 1e-9 ? Math.sin(r / PLANET_R) / r : 1 / PLANET_R;
  const a = x * s, b = -z * s, c = Math.cos(r / PLANET_R);
  return side ? [-a, b, -c] : [a, b, c];
}
// Unit vector -> [x, z, side] on whichever side's map it falls.
function dirToFlat(a, b, c) {
  const side = c >= 0 ? 0 : 1;
  if (side) { a = -a; c = -c; }
  const th = Math.acos(Math.max(-1, Math.min(1, c)));
  const st = Math.sin(th);
  if (st < 1e-9) return [0, 0, side];
  const k = (th * PLANET_R) / st;
  return [a * k, -b * k, side];
}
// How much a side's map is squeezed sideways at a point: 1 at its centre, ~0.64 at its rim.
function squeeze(x, z) {
  const th = Math.hypot(x, z) / PLANET_R;
  return th < 1e-6 ? 1 : Math.sin(th) / th;
}

// ---------------------------------------------------------------- noise

function hash(ix, iz) {
  let h = (ix * 374761393 + iz * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
const smooth = (t) => t * t * (3 - 2 * t);
function valueNoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = smooth(x - ix), fz = smooth(z - iz);
  const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
  return (a + (b - a) * fx) + ((c + (d - c) * fx) - (a + (b - a) * fx)) * fz;
}
function fbm(x, z) {
  let s = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 4; i++) { s += amp * (valueNoise(x * f, z * f) * 2 - 1); amp *= 0.5; f *= 2.03; }
  return s;
}
function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

// ---------------------------------------------------------------- land

// Each blob is an ellipse of land on one side's map; the coast is where the best blob reaches zero.
const BLOBS = [
  [
    [-50, 0, 62, 50],    // Photonia: western heartland
    [-5, 12, 48, 42],    //   eastern lowlands, Lumen City
    [-78, -35, 32, 28],  //   northern highlands
    [-15, -40, 42, 26],  //   Raman Ridge plateau
    [95, 2, 24, 34],     // Coherent Isle
    [108, -30, 14, 14],  //   Palm Point
  ],
  [
    [0, 0, 62, 48],      // Packetland: the heartland around Coreburg
    [-40, 16, 34, 30],   //   Gateway Bay lobe
    [32, -22, 36, 30],   //   Edgewater highlands
    [38, 30, 22, 18],    //   Framefield peninsula
    [-8, -34, 36, 20],   //   Northport coast
  ],
];

// Polar ice: round caps measured on the sphere, shared by both sides.
const ICE = [{ dir: [0, 1, 0], r: 0.3 }, { dir: [0, -1, 0], r: 0.24 }];

// > 0 on land, < 0 at sea. Roughly the fraction of the way in from the coast.
function landness(x, z, side = 0) {
  let f = -Infinity;
  for (const [cx, cz, rx, rz] of BLOBS[side]) {
    const dx = (x - cx) / rx, dz = (z - cz) / rz;
    f = Math.max(f, 1 - (dx * dx + dz * dz));
  }
  if (Math.hypot(x, z) > 110) {
    const d = flatToDir(x, z, side);
    for (const c of ICE) {
      const ang = Math.acos(Math.min(1, d[0] * c.dir[0] + d[1] * c.dir[1] + d[2] * c.dir[2])) / c.r;
      f = Math.max(f, 1 - ang * ang);
    }
  }
  return f + fbm(x * 0.045 + side * 37.1, z * 0.045 - side * 11.3) * 0.14;
}

// True on the polar ice caps.
function icy(x, z, side = 0) {
  return Math.abs(flatToDir(x, z, side)[1]) > 0.93;
}

const MOUNTAINS = [
  [[-88, -44, 16, 14], [-70, -56, 10, 9], [-100, -24, 10, 7], [104, -32, 6, 5]],
  [[36, -36, 13, 10], [52, -30, 9, 7], [-18, -46, 7, 6]],
];

function rawHeight(x, z, side) {
  const f = landness(x, z, side);
  if (f <= 0) return SEA_FLOOR * smoothstep(0, 0.5, -f) - 0.6 * (1 - smoothstep(0, 0.5, -f));
  let h = 0.4 + smoothstep(0, 0.25, f) * 2.2 + Math.max(0, fbm(x * 0.06 + 7 + side * 50, z * 0.06 - 3)) * 5;
  for (const [mx, mz, mh, s] of MOUNTAINS[side]) {
    const d2 = ((x - mx) ** 2 + (z - mz) ** 2) / (s * s);
    h += mh * Math.exp(-d2);
  }
  return h;
}

// Terraced, so the hills read as toy-like steps.
const STEP = 1.6;
function heightAt(x, z, side = 0) {
  const h = rawHeight(x, z, side);
  if (h <= 0.4) return h;
  if (Math.hypot(x, z) > 120 && icy(x, z, side)) return 0.9;   // flat polar ice sheets
  const base = Math.floor(h / STEP) * STEP;
  return Math.max(0.4, base + STEP * smoothstep(0.7, 1, (h - base) / STEP));
}

// ---------------------------------------------------------------- geometry helpers

function distToSegment(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz || 1)));
  return Math.hypot(px - (ax + t * dx), pz - (az + t * dz));
}

// Polyline in x/z for a link on one side's map, endpoint to endpoint through its waypoints.
// (Cross-side cables have no single flat map; use linkDirs for those.)
function linkPath(world, link) {
  const a = world.byId[link.a], b = world.byId[link.b];
  return [[a.x, a.z], ...(link.via || []).map(([x, z]) => [x, z]), [b.x, b.z]];
}

function pathLength(pts) {
  let s = 0;
  for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  return s;
}

// Evenly spaced samples along a polyline.
function samplePath(pts, step = 1) {
  const out = [];
  for (let i = 1; i < pts.length; i++) {
    const [ax, az] = pts[i - 1], [bx, bz] = pts[i];
    const n = Math.max(1, Math.ceil(Math.hypot(bx - ax, bz - az) / step));
    for (let k = i === 1 ? 0 : 1; k <= n; k++) out.push([ax + ((bx - ax) * k) / n, az + ((bz - az) * k) / n]);
  }
  return out;
}

const dot = (u, v) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
function slerp(u, v, t) {
  const w = Math.acos(Math.max(-1, Math.min(1, dot(u, v))));
  if (w < 1e-6) return u.slice();
  const s = Math.sin(w), p = Math.sin((1 - t) * w) / s, q = Math.sin(t * w) / s;
  return [u[0] * p + v[0] * q, u[1] * p + v[1] * q, u[2] * p + v[2] * q];
}

// Points along any link as unit directions from the planet centre, about `step` apart.
// Links on one side follow their flat map; cross-side cables follow great circles
// between their waypoints.
function linkDirs(world, link, step = 1) {
  const a = world.byId[link.a], b = world.byId[link.b];
  if (!link.cross) return samplePath(linkPath(world, link), step).map(([x, z]) => flatToDir(x, z, a.side));
  const way = [flatToDir(a.x, a.z, a.side), ...link.via.map(([x, z, s]) => flatToDir(x, z, s)), flatToDir(b.x, b.z, b.side)];
  const out = [way[0]];
  for (let i = 1; i < way.length; i++) {
    const n = Math.max(1, Math.ceil((Math.acos(Math.min(1, dot(way[i - 1], way[i]))) * PLANET_R) / step));
    for (let k = 1; k <= n; k++) out.push(slerp(way[i - 1], way[i], k / n));
  }
  return out;
}

// Length of a link along the planet's surface.
function linkLength(world, link) {
  const d = linkDirs(world, link, 1);
  let s = 0;
  for (let i = 1; i < d.length; i++) s += Math.acos(Math.min(1, dot(d[i - 1], d[i]))) * PLANET_R;
  return s;
}

// ---------------------------------------------------------------- build

function buildWorld() {
  const nodes = PLACED.map((n) => ({ ...n }));
  for (const n of nodes) if (n.coastOf) Object.assign(n, coastPoint(CITY[n.coastOf], n.toward));
  const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
  const links = LINKS.map((l) => ({ ...l }));

  const used = {};
  const pick = (type) => {
    const i = (used[type] = (used[type] ?? -1) + 1);
    return type === 'tower' ? `Cell site ${i + 1}` : NAMES[type][i % NAMES[type].length];
  };
  ACCESS_RINGS.forEach(({ layer, from, to, stops }, r) => {
    let prev = from;
    stops.forEach(([type, x, z, split], i) => {
      const e = NB(`end_${r}_${i}`, type, pick(type), x, z, [layer], { role: ENDPOINT[type].label, gear: ENDPOINT[type].gear });
      if (split) e.ran = { du: split.du ?? e.id, cu: split.cu };
      nodes.push(e); byId[e.id] = e;
      links.push(L(layer, prev, e.id));
      prev = e.id;
    });
    links.push(L(layer, prev, to));
  });

  // homes on Popcorn Hill, each on its own fibre from the street splitter
  SOFA_STREET.forEach(([x, z], i) => {
    const h = NB(`home_${i}`, 'home', `${i + 1} Sofa Street`, x, z, ['pon'], { role: 'Fibre-to-the-home subscriber' });
    nodes.push(h); byId[h.id] = h;
    links.push(L('pon', 'spl_pop', h.id));
  });

  // each hub's share of the RAN: the C-RAN sites whose DUs it pools, and the DUs its CU serves
  for (const h of nodes) {
    if (h.type !== 'xhub') continue;
    const sites = nodes.filter((n) => n.ran);
    const pool = sites.filter((n) => n.ran.du === h.id).map((n) => n.id);
    const cu = [...new Set(sites.filter((n) => n.ran.cu === h.id).map((n) => n.ran.du))];
    if (pool.length || cu.length) h.ran = { pool, cu };
  }

  // RLS line amplifiers along the countrywide spans.
  for (const link of links) {
    if (link.layer !== 'backbone') continue;
    const pts = linkPath({ byId }, link);
    const len = pathLength(pts);
    const n = Math.floor(len / 15);
    for (let k = 1; k <= n; k++) {
      const [x, z] = pointAt(pts, (k / (n + 1)) * len);
      const ila = N(`ila_${link.a}_${link.b}_${k}`, 'ila', 'In-line amplifier', x, z, [link.layer],
        { role: `Amplifier hut on ${byId[link.a].name} – ${byId[link.b].name}` });
      nodes.push(ila); byId[ila.id] = ila;
    }
  }

  // Submarine repeaters, every ~9 units along each cable where it is properly underwater.
  for (const link of links) {
    if (!link.sea) continue;
    const dirs = linkDirs({ byId }, link, 1);
    let k = 0;
    for (let i = 9; i < dirs.length - 4; i += 9) {
      if (heightDir(...dirs[i]) > -3) continue;
      const [x, z, side] = dirToFlat(...dirs[i]);
      const rep = N(`rep_${link.a}_${link.b}_${k++}`, 'repeater', 'Undersea repeater', x, z, ['submarine'],
        { side, role: `Repeater on the ${link.name}` });
      nodes.push(rep); byId[rep.id] = rep;
    }
  }

  // the sea along every cable, for the submarine region on the globe
  seaBand = [];
  for (const link of links) {
    if (!link.sea) continue;
    for (const d of linkDirs({ byId }, link, 2)) if (heightDir(...d) < -0.5) seaBand.push(d);
  }

  for (const n of nodes) {
    n.gear = n.gear || gearFor(n);
    n.links = [];
  }
  links.forEach((l, i) => {
    l.id = 'link' + i;
    byId[l.a].links.push(l.id);
    byId[l.b].links.push(l.id);
  });

  return { nodes, links, byId, cities: CITIES, layers: LAYERS, seaBand };
}

// Last dry spot walking from a town toward a point at sea, on the town's side.
function coastPoint(c, [tx, tz]) {
  let x = c.x, z = c.z;
  const len = Math.hypot(tx - x, tz - z), ux = (tx - x) / len, uz = (tz - z) / len;
  while (heightAt(x + ux * 1.5, z + uz * 1.5, c.side) >= 0.6) { x += ux * 0.5; z += uz * 0.5; }
  return { x, z };
}

function pointAt(pts, d) {
  for (let i = 1; i < pts.length; i++) {
    const seg = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (d <= seg) {
      const t = d / seg;
      return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t];
    }
    d -= seg;
  }
  return pts[pts.length - 1];
}

function gearFor(n) {
  switch (n.type) {
    case 'dc': return n.side ? 'Data center gateway on Ciena 8100 Coherent Routers' : 'Ciena Waveserver 5 with WaveLogic 6 Extreme';

// The submarine network's region also follows the cables themselves: a band of sea
// either side of every cable, all the way round the planet. buildWorld fills this in.
const BAND = 7;
let seaBand = [];
const bandCos = Math.cos(BAND / PLANET_R);

// Which major's region a spot on a side's map falls in, if any: the smallest circle
// it is inside (so a network nested in another's area, like the core pair in the
// middle of Coreburg's metro ring, wins there); failing that, the cable band.
function regionAt(x, z, side) {
  let best = null, bestR = Infinity;
  for (const m of MAJORS) {
    for (const [cx, cz, r, cs = m.side] of m.region) {
      if (cs !== side || r >= bestR) continue;
      if (Math.hypot(x - cx, z - cz) < r) { bestR = r; best = m.id; }
    }
  }
  // at sea, the cable band wins over any circle that happens to reach the water
  if (!best || heightAt(x, z, side) < -0.5) {
    const d = flatToDir(x, z, side);
    for (const p of seaBand) if (dot(d, p) > bandCos) return 'submarine';
  }
  return best;
}

// For each major: the link ids it owns and every node id that belongs in its own view.
function majorParts(world) {
  const parts = {};
  for (const m of MAJORS) {
    const links = world.links.filter((l) => m.owns(l, world));
    const nodes = new Set();
    for (const l of links) {
      nodes.add(l.a); nodes.add(l.b);
      for (const n of world.nodes) {
        if (n.id.startsWith(`ila_${l.a}_${l.b}_`) || n.id.startsWith(`rep_${l.a}_${l.b}_`)) nodes.add(n.id);
      }
    }
    parts[m.id] = { links: links.map((l) => l.id), nodes: [...nodes] };
  }
  return parts;
}

// Everything three.js: the little planet, towns, equipment models, cables and traffic.

const INK = new THREE.Color('#1d2a44');

// ---------------------------------------------------------------- materials

const gradient = (() => {
  const t = new THREE.DataTexture(new Uint8Array([110, 185, 255]), 3, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
})();

const matCache = new Map();
function toon(color, opts = {}) {
  const key = !Object.keys(opts).length && String(color);
  if (key && matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshToonMaterial({ color, gradientMap: gradient, ...opts });
  if (key) matCache.set(key, m);
  return m;
}
// Faceted look: toon materials have no flatShading, so split the vertices instead.
function flat(geo) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  g.computeVertexNormals();
  return g;
}
const inkMat = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide });

// A black back-face shell slightly bigger than the mesh: the cartoon outline.
function outline(mesh, t = 0.09) {
  mesh.geometry.computeBoundingBox();
  const s = new THREE.Vector3();
  mesh.geometry.boundingBox.getSize(s);
  const o = new THREE.Mesh(mesh.geometry, inkMat);
  o.scale.set((s.x + 2 * t) / Math.max(s.x, 1e-3), (s.y + 2 * t) / Math.max(s.y, 1e-3), (s.z + 2 * t) / Math.max(s.z, 1e-3));
  o.raycast = () => {};
  mesh.add(o);
  return mesh;
}

function box(w, h, d, color, x = 0, y = 0, z = 0, line = 0.08) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), toon(color));
  m.position.set(x, y + h / 2, z);
  m.castShadow = m.receiveShadow = true;
  return line ? outline(m, line) : m;
}
function cyl(rt, rb, h, color, x = 0, y = 0, z = 0, seg = 12, line = 0.06) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), toon(color));
  m.position.set(x, y + h / 2, z);
  m.castShadow = true;
  return line ? outline(m, line) : m;
}
function ball(r, color, x, y, z, line = 0.06) {
  const m = new THREE.Mesh(flat(new THREE.IcosahedronGeometry(r, 1)), toon(color));
  m.position.set(x, y, z);
  m.castShadow = true;
  return line ? outline(m, line) : m;
}
// Gable roof: a triangular prism along x.
function gable(w, h, d, color, y) {
  const shape = new THREE.Shape();
  shape.moveTo(-d / 2, 0); shape.lineTo(d / 2, 0); shape.lineTo(0, h); shape.closePath();
  const g = new THREE.ExtrudeGeometry(shape, { depth: w, bevelEnabled: false });
  g.translate(0, 0, -w / 2);
  g.rotateY(Math.PI / 2);
  const m = new THREE.Mesh(g, toon(color));
  m.position.y = y;
  m.castShadow = true;
  return outline(m, 0.07);
}

// ---------------------------------------------------------------- planet

// Flat map point (x, z) at height y -> position on the planet.
function sph(x, y, z, side = 0, out = new THREE.Vector3()) {
  const [a, b, c] = flatToDir(x, z, side);
  return out.set(a, b, c).multiplyScalar(PLANET_R + y);
}

// Orientation that stands an object upright on the planet at (x, z), with its
// local +x pointing map-east and +z map-south, as it would on the flat map.
const _e = new THREE.Vector3(), _u = new THREE.Vector3(), _so = new THREE.Vector3(), _bm = new THREE.Matrix4();
function frameAt(x, z, side = 0, out = new THREE.Quaternion()) {
  sph(x, 0, z, side, _u).normalize();
  sph(x + 0.05, 0, z, side, _e).sub(sph(x - 0.05, 0, z, side, _so));
  _so.crossVectors(_e, _u).normalize();
  _e.crossVectors(_u, _so).normalize();
  return out.setFromRotationMatrix(_bm.makeBasis(_e, _u, _so));
}

// Put an object on the planet where it would sit on the flat map.
function place(obj, x, y, z, ry = 0, side = 0) {
  sph(x, y, z, side, obj.position);
  frameAt(x, z, side, obj.quaternion);
  if (ry) obj.rotateY(ry);
  return obj;
}

function buildPlanet(scene) {
  // Ground and sea floor in one closed, faceted sphere.
  const geo = new THREE.IcosahedronGeometry(1, 110);
  const pos = geo.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const c = new THREE.Color();
  const pal = {
    deep: new THREE.Color('#1c5fa8'), shelf: new THREE.Color('#5fd0e0'), sand: new THREE.Color('#f3dc9a'),
    grass: new THREE.Color('#8fd16a'), grass2: new THREE.Color('#6dbb55'), hill: new THREE.Color('#4f9d4a'),
    rock: new THREE.Color('#a39283'), snow: new THREE.Color('#ffffff'), ice: new THREE.Color('#e3f4ff'),
  };
  const v = new THREE.Vector3();
  const cache = new Map();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    const key = `${v.x.toFixed(5)},${v.y.toFixed(5)},${v.z.toFixed(5)}`;
    let hit = cache.get(key);
    if (!hit) {
      const [x, z, side] = dirToFlat(v.x, v.y, v.z);
      const h = heightAt(x, z, side);
      if (h < 0) c.copy(pal.deep).lerp(pal.shelf, smoothstep(SEA_FLOOR, -1, h));
      else if (icy(x, z, side)) c.copy(pal.ice);
      else if (h < 0.9 && landness(x, z, side) < 0.12) c.copy(pal.sand);
      else if (h > 13) c.copy(pal.snow);
      else if (h > 8) c.copy(pal.rock);
      else if (h > 4.5) c.copy(pal.hill);
      else c.copy(((Math.sin(x * 0.3) + Math.cos(z * 0.27)) > 0.4) ? pal.grass2 : pal.grass);
      hit = [h, c.r, c.g, c.b];
      cache.set(key, hit);
    }
    v.multiplyScalar(PLANET_R + hit[0]);
    pos.setXYZ(i, v.x, v.y, v.z);
    col.set([hit[1], hit[2], hit[3]], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const terrain = new THREE.Mesh(geo, new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: gradient }));
  terrain.receiveShadow = true;
  terrain.name = 'terrain';
  scene.add(terrain);

  // Sea: a translucent shell so the sea floor and its cables show through.
  const waterMat = new THREE.MeshToonMaterial({ color: '#36b5e8', gradientMap: gradient, transparent: true, opacity: 0.55, depthWrite: false });
  const water = new THREE.Mesh(new THREE.SphereGeometry(PLANET_R, 160, 120), waterMat);
  water.renderOrder = 2;
  scene.add(water);

  // Atmosphere: a soft rim of light around the planet.
  const glow = new THREE.Mesh(new THREE.SphereGeometry(PLANET_R * 1.16, 64, 48), new THREE.ShaderMaterial({
    side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { color: { value: new THREE.Color('#9fe3ff') } },
    vertexShader: `varying vec3 vN; varying vec3 vV;
      void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform vec3 color; varying vec3 vN; varying vec3 vV;
      void main() { float k = clamp(-dot(vN, vV), 0.0, 1.0); gl_FragColor = vec4(color, k * k * 1.7); }`,
  }));
  glow.raycast = () => {};
  scene.add(glow);

  // Foam: white dabs where land meets water.
  const foam = [];
  for (const side of [0, 1]) {
    for (let x = -158; x < 158; x += 1.6) {
      for (let z = -158; z < 158; z += 1.6) {
        if (Math.hypot(x, z) > 157) continue;
        const h = heightAt(x, z, side);
        if (h < 0 && h > -0.9 && landness(x, z, side) > -0.04 && Math.random() < squeeze(x, z) + 0.1) foam.push([x, z, side]);
      }
    }
  }
  const foamMesh = new THREE.InstancedMesh(new THREE.CircleGeometry(0.9, 8), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.7, depthWrite: false }), foam.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), qx = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));
  const one = new THREE.Vector3(1, 1, 1), p = new THREE.Vector3();
  foam.forEach(([x, z, side], i) => foamMesh.setMatrixAt(i, m4.compose(sph(x, 0.04, z, side, p), frameAt(x, z, side, q).multiply(qx), one)));
  foamMesh.renderOrder = 4;
  foamMesh.raycast = () => {};
  scene.add(foamMesh);

  return { terrain, water, waterMat, foamMesh };
}

// ---------------------------------------------------------------- instanced helpers

const _m = new THREE.Matrix4(), _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _qy = new THREE.Quaternion(), _s = new THREE.Vector3(), _c = new THREE.Color();

// items: {x, y, z, sx, sy, sz, color, ry}
function instanced(geo, items, { line = 0.1, shadow = true, faceted = false } = {}) {
  if (faceted) geo = flat(geo);
  const g = new THREE.Group();
  if (!items.length) return g;
  const body = new THREE.InstancedMesh(geo, toon('#ffffff'), items.length);
  const ink = line ? new THREE.InstancedMesh(geo, inkMat, items.length) : null;
  geo.computeBoundingBox();
  const size = new THREE.Vector3();
  geo.boundingBox.getSize(size);
  items.forEach((it, i) => {
    sph(it.x, it.y, it.z, it.side || 0, _p);
    frameAt(it.x, it.z, it.side || 0, _q).multiply(_qy.setFromAxisAngle(THREE.Object3D.DEFAULT_UP, it.ry || 0));
    _s.set(it.sx, it.sy, it.sz);
    body.setMatrixAt(i, _m.compose(_p, _q, _s));
    body.setColorAt(i, _c.set(it.color));
    if (ink) {
      _s.set(it.sx + (2 * line) / size.x, it.sy + (2 * line) / size.y, it.sz + (2 * line) / size.z);
      ink.setMatrixAt(i, _m.compose(_p, _q, _s));
    }
  });
  body.castShadow = shadow;
  body.receiveShadow = true;
  g.add(body);
  if (ink) { ink.raycast = () => {}; g.add(ink); }
  return g;
}

const unitBox = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
const unitRoof = (() => {
  const s = new THREE.Shape();
  s.moveTo(-0.5, 0); s.lineTo(0.5, 0); s.lineTo(0, 0.6); s.closePath();
  return new THREE.ExtrudeGeometry(s, { depth: 1, bevelEnabled: false }).translate(0, 0, -0.5);
})();

function rand(seed) {
  let s = seed >>> 0;
  return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296);
}

// Segments of every ground link, to keep buildings and trees off the cables.
function cableSegments(world) {
  const segs = [];
  for (const l of world.links) {
    if (l.sea) continue;
    const p = linkPath(world, l), side = world.byId[l.a].side;
    for (let i = 1; i < p.length; i++) segs.push([p[i - 1][0], p[i - 1][1], p[i][0], p[i][1], side]);
  }
  return segs;
}
const clearOf = (segs, nodes, side, x, z, cable, node) =>
  segs.every((s) => s[4] !== side || distToSegment(x, z, s[0], s[1], s[2], s[3]) > cable) &&
  nodes.every((n) => n.side !== side || Math.hypot(n.x - x, n.z - z) > node);

// ---------------------------------------------------------------- towns and scenery

const BUILDING_COLORS = ['#f6f1e7', '#ffd6a5', '#bde0fe', '#cdb4db', '#ffc8dd', '#caffbf', '#e9edc9', '#a2d2ff'];
const ROOF_COLORS = ['#e76f51', '#c0504d', '#6d597a', '#457b9d', '#e9a03b'];

// `regionOf(x, z, side)` sorts the buildings by the network region they stand in, so
// story mode can hide a whole region's town while it is under cloud: the group's
// `byRegion` holds one group per region ('' for the ground outside every region).
function buildTowns(world, regionOf = () => '') {
  const segs = cableSegments(world);
  const ground = world.nodes.filter((n) => !['router', 'repeater'].includes(n.type));
  const r = rand(11);
  const sets = {};
  for (const c of world.cities) {
    // the far side of the planet squeezes the map sideways, so space lots out there
    const step = (c.town ? 1.9 : c.dense ? 1.85 : 2.3) / squeeze(c.x, c.z);
    for (let x = c.x - c.r; x <= c.x + c.r; x += step) {
      for (let z = c.z - c.r; z <= c.z + c.r; z += step) {
        const d = Math.hypot(x - c.x, z - c.z) / c.r;
        if (d > 1 || r() < 0.12) continue;
        const jx = x + (r() - 0.5) * 0.4, jz = z + (r() - 0.5) * 0.4;
        if (heightAt(jx, jz, c.side) < 0.6 || !clearOf(segs, ground, c.side, jx, jz, 1.5, 2.6)) continue;
        const y = heightAt(jx, jz, c.side) - 0.3, side = c.side;
        const color = BUILDING_COLORS[Math.floor(r() * BUILDING_COLORS.length)];
        const { towers, roofs, caps } = sets[regionOf(jx, jz, side) ?? ''] ??= { towers: [], roofs: [], caps: [] };
        if (c.town || (d > 0.6 && r() < 0.6)) {
          const w = 1.1 + r() * 0.5, dd = 0.9 + r() * 0.4, h = 0.9 + r() * 0.5, ry = r() < 0.5 ? 0 : Math.PI / 2;
          towers.push({ x: jx, y, z: jz, side, sx: w, sy: h + 0.3, sz: dd, color, ry });
          roofs.push({ x: jx, y: y + h + 0.3, z: jz, side, sx: dd + 0.15, sy: 1.1, sz: w + 0.15, color: ROOF_COLORS[Math.floor(r() * ROOF_COLORS.length)], ry: ry + Math.PI / 2 });
        } else {
          const w = 1.3 + r() * 0.6, h = 1.5 + (1 - d) * (c.tall ?? 0.4) * 12 * (0.5 + r());
          towers.push({ x: jx, y, z: jz, side, sx: w, sy: h, sz: w, color });
          caps.push({ x: jx, y: y + h, z: jz, side, sx: w * 0.6, sy: 0.35, sz: w * 0.6, color: '#8d99ae' });
        }
      }
    }
  }
  const g = new THREE.Group();
  g.byRegion = {};
  for (const [k, { towers, roofs, caps }] of Object.entries(sets)) {
    const part = g.byRegion[k] = new THREE.Group();
    part.add(instanced(unitBox, towers, { line: 0.09 }), instanced(unitRoof, roofs, { line: 0.08 }), instanced(unitBox, caps, { line: 0.05 }));
    g.add(part);
  }
  return g;
}

function buildTrees(world) {
  const segs = cableSegments(world);
  const ground = world.nodes.filter((n) => !['router', 'repeater'].includes(n.type));
  const r = rand(5);
  const pines = [], rounds = [], trunks = [];
  for (const side of [0, 1]) for (let x = -158; x < 158; x += 1.7) {
    for (let z = -158; z < 158; z += 1.7) {
      const jx = x + (r() - 0.5) * 1.4, jz = z + (r() - 0.5) * 1.4;
      if (Math.hypot(jx, jz) > 157) continue;
      const h = heightAt(jx, jz, side);
      if (h < 1 || h > 12.5 || icy(jx, jz, side) || r() > squeeze(jx, jz)) continue;
      const forest = Math.sin(jx * 0.11 + 1.3 + side * 2) * Math.cos(jz * 0.13) + Math.sin(jx * 0.05 - jz * 0.07);
      if (forest < 0.55 || r() < 0.35) continue;
      if (world.cities.some((c) => c.side === side && Math.hypot(c.x - jx, c.z - jz) < c.r + 2.5)) continue;
      if (!clearOf(segs, ground, side, jx, jz, 1.6, 3)) continue;
      const s = 0.7 + r() * 0.6;
      trunks.push({ x: jx, y: h - 0.2, z: jz, side, sx: 0.25 * s, sy: 0.8 * s, sz: 0.25 * s, color: '#8a5a3b' });
      if (h > 5 || r() < 0.3) pines.push({ x: jx, y: h + 0.5 * s, z: jz, side, sx: s, sy: s * 1.4, sz: s, color: r() < 0.5 ? '#2f8f5b' : '#3a9f60' });
      else rounds.push({ x: jx, y: h + 1.0 * s, z: jz, side, sx: s, sy: s, sz: s, color: r() < 0.5 ? '#5cb85c' : '#7bc96f' });
    }
  }
  const g = new THREE.Group();
  g.add(
    instanced(unitBox, trunks, { line: 0 }),
    instanced(new THREE.ConeGeometry(0.9, 2, 7).translate(0, 1, 0), pines, { line: 0.08, faceted: true }),
    instanced(new THREE.IcosahedronGeometry(0.9, 0), rounds, { line: 0.08, faceted: true }),
  );
  return g;
}

// A cable-laying ship: white hull, yellow deckhouse, the cable sheave over the stern.
function cableShip() {
  const ship = new THREE.Group();
  ship.add(box(5, 0.9, 1.8, '#f1faee', 0, -0.3, 0, 0.08), box(1.6, 1.2, 1.4, '#ffc300', 1.2, 0.6, 0, 0.07),
    cyl(0.12, 0.12, 2.2, '#1d2a44', -1.4, 0.6, 0, 6, 0), box(0.2, 0.2, 1.8, '#1d2a44', -1.9, 2.6, 0, 0),
    cyl(0.5, 0.5, 0.25, '#1d2a44', -2.6, 0.7, 0, 12, 0.04));
  ship.children[4].rotation.x = Math.PI / 2;
  return ship;
}

// A whale, nose along +x: body, flukes, two flippers, a pale belly.
function whale(scale = 1) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(1.1, 3.6, 4, 10), toon('#3d5a80'));
  body.rotation.z = Math.PI / 2;
  body.castShadow = true;
  g.add(outline(body, 0.08));
  const belly = new THREE.Mesh(new THREE.CapsuleGeometry(0.8, 3.2, 4, 10), toon('#c7d7e8'));
  belly.rotation.z = Math.PI / 2;
  belly.position.y = -0.5;
  g.add(belly);
  const tail = new THREE.Group();
  tail.position.x = -2.9;
  const fluke = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.18, 3), toon('#3d5a80'));
  fluke.position.x = -0.6;
  tail.add(outline(fluke, 0.06));
  g.add(tail);
  for (const sgn of [-1, 1]) {
    const fin = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.14, 0.7), toon('#3d5a80'));
    fin.position.set(0.6, -0.5, sgn * 1.2);
    fin.rotation.y = sgn * 0.5;
    g.add(outline(fin, 0.05));
  }
  g.add(ball(0.17, '#1d2a44', 1.6, 0.4, 0.95, 0), ball(0.17, '#1d2a44', 1.6, 0.4, -0.95, 0));
  g.scale.setScalar(scale);
  g.userData.tail = tail;
  return g;
}

// Little things that move: boats, wind turbines, clouds.
function buildLife(scene) {
  const movers = [];
  const boat = (color) => {
    const b = new THREE.Group();
    b.add(box(2.6, 0.6, 1.1, color, 0, -0.2, 0, 0.07), box(1, 0.7, 0.8, '#ffffff', -0.3, 0.4, 0, 0.06));
    return b;
  };
  for (const [cx, cz, r, sp, color, side = 0] of [[52, -20, 10, 0.12, '#e63946'], [60, 50, 14, -0.08, '#264653'], [-112, -40, 9, 0.1, '#f4a261'], [10, 66, 12, 0.07, '#2a9d8f'],
    [-84, 30, 10, 0.1, '#ffbe0b', 1], [70, 20, 12, -0.09, '#3a86ff', 1], [0, 64, 11, 0.08, '#e63946', 1]]) {
    const b = boat(color);
    scene.add(b);
    movers.push((t) => {
      const a = t * sp;
      place(b, cx + Math.cos(a) * r, Math.sin(t * 2 + cx) * 0.08, cz + Math.sin(a) * r, -a + (sp > 0 ? -Math.PI / 2 : Math.PI / 2), side);
    });
  }

  // Cable ship parked over the Lumen City – Coherent Isle cable.
  const ship = cableShip();
  scene.add(ship);
  movers.push((t) => { place(ship, 56, Math.sin(t * 1.6) * 0.1, 30, 0.5); ship.rotateX(Math.sin(t * 1.3) * 0.03); });

  // Wind farm on the moor.
  for (const [x, z] of [[-100, -6], [-104, 0], [-97, -12], [-108, -10]]) {
    const y = heightAt(x, z);
    const t = new THREE.Group();
    t.add(cyl(0.15, 0.3, 6, '#ffffff', 0, 0, 0, 8, 0.05));
    const rotor = new THREE.Group();
    rotor.position.set(0, 6, 0.35);
    for (let k = 0; k < 3; k++) {
      const blade = box(0.25, 3, 0.08, '#ffffff', 0, 0, 0, 0.04);
      const arm = new THREE.Group();
      arm.rotation.z = (k * Math.PI * 2) / 3;
      arm.add(blade);
      rotor.add(arm);
    }
    rotor.add(ball(0.3, '#e63946', 0, 0, 0, 0.04));
    t.add(rotor);
    place(t, x, y, z, 0.4);
    scene.add(t);
    movers.push((tt) => { rotor.rotation.z = -tt * 1.4 + x; });
  }

  // Clouds that drift across and cast soft shadows.
  const clouds = new THREE.Group();
  const cr = rand(3);
  const cloudMat = toon('#ffffff', { transparent: true, opacity: 0.92 });
  const Y = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < 16; i++) {
    const c = new THREE.Group();
    for (let k = 0; k < 5; k++) {
      const m = new THREE.Mesh(flat(new THREE.IcosahedronGeometry(2.4 + cr() * 2, 1)), cloudMat);
      m.position.set((k - 2) * 2.6 + cr(), cr() * 1.2, (cr() - 0.5) * 3);
      m.castShadow = true;
      c.add(m);
    }
    // anywhere between the polar circles, floating above the hills
    const dir = new THREE.Vector3().setFromSphericalCoords(1, 0.5 + cr() * (Math.PI - 1), cr() * Math.PI * 2);
    c.position.copy(dir).multiplyScalar(PLANET_R + 19 + cr() * 4);
    c.quaternion.setFromUnitVectors(Y, dir);
    clouds.add(c);
  }
  scene.add(clouds);
  movers.push((t, dt) => { clouds.rotation.y += dt * 0.012; });
  return { movers, clouds, cloudMat };
}

// ---------------------------------------------------------------- equipment models

const routerTop = (() => {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = '#2f80ed'; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = '#ffffff'; g.fillStyle = '#ffffff'; g.lineWidth = 9; g.lineCap = 'round';
  const arrow = (a, inward) => {
    g.save(); g.translate(64, 64); g.rotate(a);
    const [s, e] = inward ? [46, 14] : [14, 46];
    g.beginPath(); g.moveTo(s, 0); g.lineTo(e, 0); g.stroke();
    g.beginPath(); g.moveTo(e + (inward ? -2 : 2), 0); g.lineTo(e + (inward ? 12 : -12), -11); g.lineTo(e + (inward ? 12 : -12), 11); g.closePath(); g.fill();
    g.restore();
  };
  arrow(Math.PI / 4, false); arrow(-3 * Math.PI / 4, false); arrow(3 * Math.PI / 4, true); arrow(-Math.PI / 4, true);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

function puckModel(r, color) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, 0.6, 24), [toon(color), new THREE.MeshToonMaterial({ map: routerTop, gradientMap: gradient }), toon(color)]);
  m.castShadow = true;
  return outline(m, 0.06);
}

function modelFor(n, layerColor) {
  const g = new THREE.Group();
  const s = n.size || 1;
  switch (n.type) {

// Height a node's model stands at.
function nodeY(world, n) {
  if (n.type === 'repeater') return heightAt(n.x, n.z, n.side);
  return Math.max(0.4, heightAt(n.x, n.z, n.side));
}

// ---------------------------------------------------------------- cables

const LIFT = { backbone: 0.55, regional: 0.45, dci: 0.45, metro: 0.5, submarine: 0.35, ipcore: 0.55, vpn: 0.4, agg: 0.45, access: 0.35, pon: 0.3, xhaul: 0.4 };
const RADIUS = { backbone: 0.42, regional: 0.32, dci: 0.34, metro: 0.36, submarine: 0.36, ipcore: 0.4, vpn: 0.22, agg: 0.32, access: 0.2, pon: 0.18, xhaul: 0.26 };

function groundY(x, z, side) {
  let h = -Infinity;
  for (const [dx, dz] of [[0, 0], [0.8, 0], [-0.8, 0], [0, 0.8], [0, -0.8]]) h = Math.max(h, heightAt(x + dx, z + dz, side));
  return h;
}

const dash = (() => {
  const cv = document.createElement('canvas');
  cv.width = 64; cv.height = 4;
  const g = cv.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 64, 4);
  g.fillStyle = '#fff'; g.fillRect(0, 0, 40, 4);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = THREE.RepeatWrapping;
  return t;
})();

// A cable's centre line as a three.js curve. On the planet by default. Given `space`
// it is laid out for the drill-down instead, with no terrain under it: flat around
// (cx, cz) for a network on one side, or round an invisible planet ({ sphere: true })
// for one that wraps from side to side.
function linkCurve(world, l, nodeYs, space = null) {
  const side = world.byId[l.a].side;
  const len = linkLength(world, l);
  let pts;
  if (l.cross || space?.sphere) {
    pts = linkDirs(world, l, 1.4).map((d) => {
      const h = space ? 0.5 * space.k : heightDir(...d) + LIFT[l.layer];
      return new THREE.Vector3(...d).multiplyScalar(PLANET_R + h);
    });
  } else {
    pts = samplePath(linkPath(world, l), 1.4).map(([x, z]) => {
      if (space) return new THREE.Vector3(x - space.cx, 0.5 * space.k, z - space.cz);
      const h = groundY(x, z, side);
      const y = h < 0 ? heightAt(x, z, side) + LIFT.submarine : h + LIFT[l.layer];
      return sph(x, y, z, side);
    });
  }
  return { curve: new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5), len };
}

function buildCable(world, l, color, nodeYs, space = null) {
  const { curve, len } = linkCurve(world, l, nodeYs, space);
  const r = RADIUS[l.layer] * (space ? space.k : 1);
  const segs = Math.max(8, Math.ceil(len * 1.6));
  // data-network links are dashed: packets, not glass
  const dashed = LAYER[l.layer].data;
  const mat = dashed
    ? new THREE.MeshToonMaterial({ color, gradientMap: gradient, alphaMap: dash.clone(), alphaTest: 0.5 })
    : new THREE.MeshToonMaterial({ color, gradientMap: gradient });
  if (mat.alphaMap) {
    mat.alphaMap.repeat.set(Math.max(2, Math.round(len / (1.6 * (space ? space.k : 1)))), 1);
    mat.alphaMap.needsUpdate = true;
  }
  const sides = space ? 12 : 6;   // fat cables in open space need rounder tubes
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, segs, r, sides, false), mat);
  mesh.castShadow = l.layer !== 'submarine';
  const ink = new THREE.Mesh(new THREE.TubeGeometry(curve, segs, r + 0.11 * (space ? space.k : 1), sides, false),
    dashed ? new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide, alphaMap: mat.alphaMap, alphaTest: 0.5 }) : inkMat.clone());
  ink.raycast = () => {};
  mesh.add(ink);
  const table = curve.getSpacedPoints(Math.max(8, Math.ceil(len * 2)));
  return { mesh, table, len, mat, ink };
}

// The dashed pole that ties a floating router to the building it lives in.
function routerPole(x, yTop, yBottom, z, color) {
  const h = yTop - yBottom;
  const mat = new THREE.MeshBasicMaterial({ color, alphaMap: dash.clone(), alphaTest: 0.5 });
  mat.alphaMap.repeat.set(Math.max(2, Math.round(h / 0.9)), 1);
  mat.alphaMap.needsUpdate = true;
  const geo = new THREE.CylinderGeometry(0.08, 0.08, h, 6, 1, true);
  // swap uv so the dash runs up the pole
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) { const u = uv.getX(i); uv.setXY(i, uv.getY(i), u); }
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, yBottom + h / 2, z);
  m.raycast = () => {};
  return m;
}

// The drill-down view: one major network on its own, floating in open space.
// No planet, terrain or buildings: just its sites, its cables and the traffic on them,
// laid out where they sit on the map but flat, and scaled so a far-flung network
// (the submarine cables) reads as clearly as a compact one (the metro).

const DETAIL_SPEED = { dci: 16, backbone: 20, regional: 13, metro: 15, submarine: 14, ipcore: 18, vpn: 9, agg: 13, access: 8, pon: 8, xhaul: 10 };

function buildDetail(world, part) {
  const scene = new THREE.Scene();
  const nodes = part.nodes.map((id) => world.byId[id]);
  const links = part.links.map((id) => world.links.find((l) => l.id === id));

  // A network on one side is laid flat; one that wraps between sides (the subsea
  // cables) keeps its shape round an invisible planet instead.
  const sphere = new Set(nodes.map((n) => n.side)).size > 1;
  const box = new THREE.Box3();
  for (const n of nodes) box.expandByPoint(sphere ? sph(n.x, 0, n.z, n.side) : new THREE.Vector3(n.x, 0, n.z));
  const size = box.getSize(new THREE.Vector3());
  const extent = Math.max(size.x, size.y, size.z, 30);
  const mid = box.getCenter(new THREE.Vector3());
  const space = { sphere, cx: mid.x, cz: mid.z, k: THREE.MathUtils.clamp(extent / 70, 1, 4) };
  const center = sphere ? new THREE.Vector3(0, mid.y, 0) : new THREE.Vector3();
  // the side of the network to look at it from
  // (a wrap-round network is seen from high over the pole, so the whole loop of it shows)
  // (the subsea cables cross round the southern ocean, so that view is from the south)
  const viewDir = sphere
    ? new THREE.Vector3().setFromSphericalCoords(1, Math.PI - 0.62, Math.atan2(mid.x, mid.z) + 0.4)
    : new THREE.Vector3().setFromSphericalCoords(1, 0.85, 0.3);

  // Sites sit on an invisible floor; routers float above the hubs that house them.
  // In the undersea view the landing stations stand on the shore, above the water,
  // and everything else lies on the sea floor.
  const SURFACE = 5.5 * space.k;
  const ys = {};
  for (const n of nodes) ys[n.id] = n.type === 'router' ? (n.tier === 'core' ? 12 : 8.5) * space.k : sphere && n.type === 'cls' ? SURFACE : 0;

  scene.add(new THREE.HemisphereLight('#ffffff', '#8a9bb5', 1.7));
  const sun = new THREE.DirectionalLight('#fff4e0', 2.2);
  sun.position.copy(center).addScaledVector(viewDir, extent * 1.3).add(new THREE.Vector3(-extent * 0.4, extent * 0.5, 0));
  sun.target.position.copy(center);
  scene.add(sun.target);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -extent, right: extent, top: extent, bottom: -extent, near: 1, far: extent * 4 });
  sun.shadow.bias = -0.003;
  sun.shadow.normalBias = 0.5 * space.k;
  scene.add(sun);

  // Nothing to stand on, but soft shadows underneath give the network some depth.
  if (!sphere) {
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(extent * 3, extent * 3), new THREE.ShadowMaterial({ opacity: 0.16 }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.7 * space.k;
  floor.receiveShadow = true;
  floor.raycast = () => {};
  scene.add(floor);
  }

  const movers = [], toys = [];
  if (sphere) {
    // The sea: a sandy floor, a translucent surface above the network, and whales.
    // deep water behind, a sandy floor under the cables, sunlight filtering down
    scene.background = new THREE.Color('#1b6fa8');
    scene.fog = new THREE.Fog('#1b6fa8', PLANET_R * 1.6, PLANET_R * 4.6);
    scene.add(new THREE.AmbientLight('#7fc4e8', 0.9));
    const floor = new THREE.Mesh(new THREE.SphereGeometry(PLANET_R - 0.9 * space.k, 96, 72),
      new THREE.MeshToonMaterial({ color: '#d8c48c', transparent: true, opacity: 0.6, depthWrite: false }));
    floor.receiveShadow = true;
    floor.raycast = () => {};
    floor.renderOrder = 1;
    scene.add(floor);
    const water = new THREE.Mesh(new THREE.SphereGeometry(PLANET_R + SURFACE - 0.6 * space.k, 96, 72),
      new THREE.MeshToonMaterial({ color: '#5ecbff', transparent: true, opacity: 0.18, depthWrite: false, side: THREE.DoubleSide }));
    water.renderOrder = 2;
    water.raycast = () => {};
    scene.add(water);
    // risers: the cable climbs from the floor up to each landing station
    for (const l of links) for (const id of [l.a, l.b]) {
      const n = world.byId[id];
      if (n.type !== 'cls') continue;
      const bottom = sph(n.x, 0.5 * space.k, n.z, n.side), top = sph(n.x, SURFACE - 0.2 * space.k, n.z, n.side);
      const h = bottom.distanceTo(top);
      const riser = new THREE.Mesh(new THREE.CylinderGeometry(0.36 * space.k, 0.36 * space.k, h, 8), toon(LAYER.submarine.color));
      riser.position.lerpVectors(bottom, top, 0.5);
      riser.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), top.clone().sub(bottom).normalize());
      riser.raycast = () => {};
      scene.add(riser);
    }
    // whales cruising just above the floor, each on its own slow circle round the planet
    const Y = new THREE.Vector3(0, 1, 0);
    [[0.25, 0.9, 1.0], [-0.4, 0.7, 1.3], [0.9, -0.3, 0.8]].forEach(([ax, az, sc], i) => {
      const w = whale(sc * space.k * 0.9);
      scene.add(w);
      toys.push(w);
      const axis = new THREE.Vector3(ax, 1, az).normalize();
      const u0 = new THREE.Vector3().crossVectors(axis, Y).normalize();
      const v0 = new THREE.Vector3().crossVectors(axis, u0).normalize();
      const speed = 0.045 + i * 0.012, phase = i * 2.1;
      movers.push((t) => {
        const a = t * speed + phase;
        const up = u0.clone().multiplyScalar(Math.cos(a)).addScaledVector(v0, Math.sin(a)).normalize();
        const fwd = u0.clone().multiplyScalar(-Math.sin(a)).addScaledVector(v0, Math.cos(a)).normalize();
        const right = new THREE.Vector3().crossVectors(up, fwd).normalize();
        w.position.copy(up).multiplyScalar(PLANET_R + (1.8 + 0.6 * Math.sin(t * 0.7 + phase)) * space.k);
        w.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(fwd, up, right));
        w.userData.tail.rotation.z = Math.sin(t * 2.2 + phase) * 0.35;
      });
    });
  }

  const nodeObjs = {}, pickables = [];
  for (const n of nodes) {
    const g = modelFor(n, LAYER[n.layers[0]].color);
    if (sphere) place(g, n.x, ys[n.id], n.z, 0, n.side);
    else g.position.set(n.x - space.cx, ys[n.id], n.z - space.cz);
    g.scale.setScalar(space.k);
    g.traverse((o) => {
      o.userData.nodeId = n.id;
      // the underwater haze is for the water, not the equipment lying in it
      if (sphere && o.material) for (const m of [].concat(o.material)) m.fog = false;
    });
    if (n.type === 'router' && ys[n.host] !== undefined) {
      g.add(routerPole(0, -0.4, (ys[n.host] + 3 * space.k - ys[n.id]) / space.k, 0, LAYER.mpls.color));
    }
    scene.add(g);
    nodeObjs[n.id] = g;
    pickables.push(g);
  }

  const linkObjs = {};
  for (const l of links) {
    const c = buildCable(world, l, LAYER[l.layer].color, ys, space);
    if (sphere) { c.mesh.renderOrder = 5; c.ink.renderOrder = 5; c.mat.fog = false; c.ink.material.fog = false; c.mat.depthTest = true; }
    scene.add(c.mesh);
    linkObjs[l.id] = { ...c, layer: l.layer };
  }

  // Traffic, one instanced mesh per layer present.
  const packets = [];
  for (const layer of new Set(links.map((l) => l.layer))) {
    const runs = [];
    for (const l of links.filter((x) => x.layer === layer)) {
      const n = Math.max(1, Math.round(linkObjs[l.id].len / (['access', 'pon', 'vpn'].includes(layer) ? 6 : 10)));
      for (let k = 0; k < n; k++) runs.push({ link: linkObjs[l.id], phase: (k + Math.random() * 0.5) / n, dir: k % 2 ? -1 : 1 });
    }
    const col = new THREE.Color(LAYER[layer].color).lerp(new THREE.Color('#ffffff'), 0.45);
    const mesh = new THREE.InstancedMesh(new THREE.SphereGeometry((['access', 'pon', 'vpn'].includes(layer) ? 0.32 : 0.48) * space.k, 10, 8), new THREE.MeshBasicMaterial({ color: col }), runs.length);
    mesh.raycast = () => {};
    scene.add(mesh);
    packets.push({ layer, mesh, runs });
  }
  let fxRef = null;
  const m4 = new THREE.Matrix4(), v = new THREE.Vector3();
  function update(t, traffic, dt = 0) {
    fxRef.update(dt, t);
    for (const m of movers) m(t);
    for (const { layer, mesh, runs } of packets) {
      mesh.visible = traffic;
      if (!traffic) continue;
      runs.forEach((p, i) => {
        const tab = p.link.table;
        let u = (p.phase + (t * DETAIL_SPEED[layer]) / p.link.len) % 1;
        if (p.dir < 0) u = 1 - u;
        const f = u * (tab.length - 1), k = Math.floor(f);
        v.copy(tab[k]).lerp(tab[Math.min(k + 1, tab.length - 1)], f - k);
        mesh.setMatrixAt(i, m4.makeTranslation(v.x, v.y, v.z));
      });
      mesh.instanceMatrix.needsUpdate = true;
    }
    for (const id in linkObjs) if (linkObjs[id].mat.alphaMap) linkObjs[id].mat.alphaMap.offset.x = -t * 0.8;
  }

  // Selection ring, laid flat under the picked site (on whatever counts as flat there).
  const ring = new THREE.Group();
  const ringMesh = new THREE.Mesh(new THREE.TorusGeometry(3 * space.k, 0.28 * space.k, 8, 40), new THREE.MeshBasicMaterial({ color: '#ffffff' }));
  ringMesh.rotation.x = -Math.PI / 2;
  ringMesh.raycast = () => {};
  ring.add(ringMesh);
  ring.visible = false;
  scene.add(ring);

  const fx = buildFx({ scene, nodes, links, nodeObjs, linkObjs, space });
  fxRef = fx;
  return { scene, nodes, links, nodeObjs, linkObjs, pickables, ring, ringMesh, update, extent, space, center, viewDir, fx, toys };
}

// ---------------------------------------------------------------- effects
//
// What a technology explainer can do to the network on screen: light links up or
// dim them, cut or block one, put a glow under a site, run a labelled packet along
// a path, pin an HTML tag or a queue readout to a point. `clear()` puts it all back.


function buildFx({ scene, nodes, links, nodeObjs, linkObjs, space }) {
  const k = space.k;
  const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
  const base = {};
  for (const id in linkObjs) base[id] = linkObjs[id].mat.color.clone();
  const packets = [], spots = [], anchors = [], temps = [];
  const Y = new THREE.Vector3(0, 1, 0);
  const upAt = (o) => Y.clone().applyQuaternion(o.quaternion);

  // the link joining two sites in this view, if any
  const link = (a, b) => links.find((l) => (l.a === a && l.b === b) || (l.a === b && l.b === a))?.id ?? null;
  // every link in this view, or just those of one layer
  const linksOf = (layer) => links.filter((l) => !layer || l.layer === layer).map((l) => l.id);

  // shortest path by hops from one site to another, optionally keeping off some links
  function path(from, to, avoid = []) {
    const skip = new Set(avoid);
    const prev = { [from]: null }, queue = [from];
    while (queue.length) {
      const cur = queue.shift();
      if (cur === to) break;
      for (const l of links) {
        if (skip.has(l.id)) continue;
        const next = l.a === cur ? l.b : l.b === cur ? l.a : null;
        if (next && !(next in prev)) { prev[next] = cur; queue.push(next); }
      }
    }
    if (!(to in prev)) return null;
    const out = [];
    for (let n = to; n; n = prev[n]) out.unshift(n);
    return out;
  }

  const nodePos = (id, lift = 0) => nodeObjs[id].position.clone().addScaledVector(upAt(nodeObjs[id]), lift * k);

  function linkState(id, state) {
    const o = linkObjs[id];
    if (!o) return;
    o.mat.transparent = state === 'dim';
    o.mat.opacity = state === 'dim' ? 0.14 : 1;
    o.mat.depthWrite = state !== 'dim';
    o.ink.visible = state !== 'dim';
    o.mesh.visible = state !== 'off';
    o.mat.color.copy(base[id]);
    if (state === 'glow') o.mat.color.lerp(new THREE.Color('#ffffff'), 0.3);
    if (state === 'cut') o.mat.color.set('#b0b7c3');
    o.mat.needsUpdate = true;
  }

  // light a set of links (and nothing else)
  function focus(linkIds) {
    const keep = new Set(linkIds);
    for (const id in linkObjs) linkState(id, keep.has(id) ? 'glow' : 'dim');
  }
  const pathLinks = (ids) => ids.slice(1).map((b, i) => link(ids[i], b));

  function spot(id, color = '#ffffff') {
    const o = nodeObjs[id];
    const m = new THREE.Mesh(new THREE.TorusGeometry(2.6 * k, 0.22 * k, 8, 36), new THREE.MeshBasicMaterial({ color }));
    m.rotation.x = -Math.PI / 2;
    m.raycast = () => {};
    const g = new THREE.Group();
    g.position.copy(o.position);
    g.quaternion.copy(o.quaternion);
    g.add(m);
    scene.add(g);
    spots.push({ g, m, phase: Math.random() * 6 });
    o.scale.setScalar(k * 1.1);
    return g;
  }

  // an HTML element that follows a 3D point (a fixed vector or a function returning one)
  function anchor(html, at, cls = '') {
    const el = document.createElement('div');
    el.className = 'fxtag ' + cls;
    el.innerHTML = html;
    document.querySelector('#detail-labels').append(el);
    const a = { el, at: typeof at === 'function' ? at : () => at };
    anchors.push(a);
    return a;
  }

  // a cut or a block marker on the middle of a link; the words come from `fx.words`
  // so the beginner and the engineer read it in their own vocabulary
  function marker(linkId, kind) {
    const o = linkObjs[linkId];
    const mid = o.table[Math.floor(o.table.length / 2)].clone();
    if (kind === 'cut') linkState(linkId, 'cut');
    return anchor(kind === 'cut' ? `<b>✕</b> ${fx.words.cut}` : `<b>▮</b> ${fx.words.block}`, mid, 'mark ' + kind);
  }

  // a packet running along a path of sites; `tag` is HTML that rides with it
  function packet(ids, { color = '#ffffff', speed = 14, loop = true, tag = null, size = 0.55, onHop = null, delay = 0 } = {}) {
    const pts = [], hops = [0];
    for (let i = 1; i < ids.length; i++) {
      const lid = link(ids[i - 1], ids[i]);
      if (!lid) continue;
      const l = links.find((x) => x.id === lid);
      let tab = linkObjs[lid].table;
      if (l.a !== ids[i - 1]) tab = [...tab].reverse();
      for (const p of tab) if (!pts.length || pts[pts.length - 1].distanceTo(p) > 1e-4) pts.push(p.clone());
      hops.push(pts.length - 1);
    }
    const mesh = new THREE.Mesh(new THREE.SphereGeometry(size * k, 12, 10), new THREE.MeshBasicMaterial({ color }));
    const halo = new THREE.Mesh(new THREE.SphereGeometry(size * k * 1.5, 12, 10), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.3 }));
    mesh.add(halo);
    mesh.raycast = () => {};
    mesh.visible = false;
    scene.add(mesh);
    const cum = [0];
    for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + pts[i].distanceTo(pts[i - 1]));
    const total = cum[cum.length - 1] || 1;
    const pk = { mesh, pts, cum, total, hops, speed: speed * k, loop, s: -delay * speed * k, hop: 0, onHop, tagEl: null, done: false };
    if (tag) pk.tag = anchor(tag, () => mesh.position.clone().addScaledVector(Y, 1.6 * k), 'ride');
    packets.push(pk);
    return pk;
  }

  // a queue readout pinned above a site: lanes of bars, each a class of traffic
  function queue(id, lanes) {
    const html = `<div class="q">${lanes.map((l) => `<div class="lane"><i style="--c:${l.color};height:${Math.round(l.fill * 100)}%"></i><span>${l.name}</span></div>`).join('')}</div>`;
    const a = anchor(html, nodePos(id, 7), 'queue');
    return { set: (i, fill) => { a.el.querySelectorAll('i')[i].style.height = Math.round(fill * 100) + '%'; } };
  }

  function clear() {
    for (const id in linkObjs) linkState(id, 'normal');
    for (const pk of packets) { scene.remove(pk.mesh); }
    for (const s of spots) scene.remove(s.g);
    for (const a of anchors) a.el.remove();
    for (const o of temps) scene.remove(o);
    for (const n of nodes) nodeObjs[n.id].scale.setScalar(k);
    packets.length = spots.length = anchors.length = temps.length = 0;
  }

  function update(dt, t) {
    for (const s of spots) {
      const p = 1 + 0.12 * Math.sin(t * 4 + s.phase);
      s.m.scale.set(p, p, 1);
    }
    for (const pk of packets) {
      if (pk.done) continue;
      pk.s += pk.speed * dt;
      if (pk.s < 0) continue;
      if (pk.s >= pk.total) {
        if (pk.loop) { pk.s -= pk.total; pk.hop = 0; if (pk.onHop) pk.onHop(0, pk); }
        else { pk.s = pk.total; pk.done = true; if (pk.onHop) pk.onHop(pk.hops.length - 1, pk); }
      }
      pk.mesh.visible = true;
      let i = 1;
      while (i < pk.cum.length - 1 && pk.cum[i] < pk.s) i++;
      const f = (pk.s - pk.cum[i - 1]) / ((pk.cum[i] - pk.cum[i - 1]) || 1);
      pk.mesh.position.lerpVectors(pk.pts[i - 1], pk.pts[i], Math.min(1, f));
      const hop = pk.hops.findIndex((h, j) => j === pk.hops.length - 1 || pk.hops[j + 1] > i - 1);
      if (hop !== pk.hop) { pk.hop = hop; if (pk.onHop) pk.onHop(hop, pk); }
    }
  }

  const fx = { byId, link, linksOf, path, pathLinks, nodePos, linkState, focus, spot, anchor, marker, packet, queue, clear, update, anchors, words: { cut: 'fibre cut', block: 'RPL blocked' } };
  return fx;
}


// Technology explainers: for each network, the technologies that matter in that
// space, each told in a few steps that play out live on the network. A step gets
// a clean scene and describes everything it wants shown, so Back and Next are
// just "show step i". No three.js in here; the steps talk to the view's `fx`.

const TC = {
  wave: '#ff7f50', wave2: '#9b5de5', wave3: '#2ec4b6', red: '#e63946', white: '#ffffff',
  voice: '#e63946', video: '#ff8c1a', biz: '#2f80ed', best: '#8d99ae', ccm: '#2ec4b6', frame: '#7b2cbf',
};

// Reusable scene recipes.
const glowPath = (fx, ids) => { fx.focus(fx.pathLinks(ids)); return ids; };
const cores = (fx) => Object.values(fx.byId).filter((n) => n.type === 'core').map((n) => n.id);
const ofType = (fx, t) => Object.values(fx.byId).filter((n) => n.type === t).map((n) => n.id);
const sidTag = (sid) => `<span class="sid">${sid}</span>`;
const stackTag = (labels) => `<span class="stack">${labels.map((l) => `<b>${l}</b>`).join('')}</span>`;

// A packet whose label stack pops one label at each hop.
function srPacket(fx, ids, sids, color = TC.biz, speed = 9) {
  const pk = fx.packet(ids, { color, speed, tag: stackTag(sids) });
  pk.onHop = (hop) => { pk.tag.el.innerHTML = stackTag(sids.slice(hop)) || '<span class="stack empty">payload</span>'; };
  return pk;
}

// Continuity-check heartbeats both ways between two MEPs.
function ccm(fx, a, b, period = 1.4) {
  const ids = fx.path(a, b);
  fx.focus(fx.pathLinks(ids));
  fx.anchor('<b>MEP</b>', fx.nodePos(a, 6), 'mep');
  fx.anchor('<b>MEP</b>', fx.nodePos(b, 6), 'mep');
  fx.packet(ids, { color: TC.ccm, speed: 16, size: 0.35, tag: '<span class="ccm">CCM</span>' });
  fx.packet([...ids].reverse(), { color: TC.ccm, speed: 16, size: 0.35, delay: period / 2, tag: '<span class="ccm">CCM</span>' });
  return ids;
}

// A tag on every cell site and hub naming the parts of the RAN it hosts.
function ranTags(fx, words = { ru: 'RU', du: 'DU', cu: 'CU', pool: 'DU pool' }) {
  for (const n of Object.values(fx.byId)) {
    if (!n.ran) continue;
    const parts = n.type === 'tower'
      ? [words.ru, ...(n.ran.du === n.id ? [words.du] : [])]
      : [...(n.ran.pool.length ? [words.pool] : []), ...(n.ran.cu.length ? [words.cu] : [])];
    fx.anchor(`<b>${parts.join(' + ')}</b>`, fx.nodePos(n.id, 6), 'mep');
  }
}

// Steps through a topic on a view's fx. Each step starts from a clean scene.
export class TechPlayer {
  constructor(fx) { this.fx = fx; this.topic = null; this.i = 0; }
  open(topic, i = 0) { this.topic = topic; return this.show(i); }
  show(i) {
    this.i = Math.max(0, Math.min(this.topic.steps.length - 1, i));
    this.fx.clear();
    this.topic.steps[this.i].run(this.fx);
    return this.topic.steps[this.i];
  }
  next() { return this.show(this.i + 1); }
  back() { return this.show(this.i - 1); }
  close() { this.fx.clear(); this.topic = null; }
}
