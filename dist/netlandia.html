<style>
/* Board-game HUD: sticker cards with ink outlines over a sky, the map fills the screen.
   Deliberately a single daylight look, so every colour is set here explicitly. */
:root {
  --ink: #1d2a44;
  --paper: #ffffff;
  --sky-1: #a9dcff;
  --sky-2: #e3f4ff;
  --muted: #56627a;
  --accent: #2f80ed;
  --display: 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', ui-rounded, 'Segoe UI', system-ui, sans-serif;
  --line: 2.5px solid var(--ink);
  --lift: 0 4px 0 var(--ink);
  color-scheme: light;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 30%, var(--sky-2), var(--sky-1));
  color: var(--ink);
  font: 500 14px/1.4 var(--body);
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

#app { position: relative; height: 100%; overflow: hidden; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }

/* ------------------------------------------------ labels on the map */
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; }
.lbl.city {
  font: 400 15px/1 var(--display);
  letter-spacing: 0.02em;
  color: var(--paper);
  -webkit-text-stroke: 4px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 3px 0 var(--ink);
}
.lbl.city.big { font-size: 21px; }
.lbl.city.town { font-size: 12.5px; -webkit-text-stroke-width: 3px; text-shadow: 0 2px 0 var(--ink); }
.lbl.tag {
  font: 800 11px/1 var(--body);
  background: var(--paper);
  border: 2px solid var(--ink);
  border-left: 7px solid var(--c);
  border-radius: 6px;
  padding: 3px 6px;
  box-shadow: 0 2px 0 var(--ink);
}
.lbl.tip {
  display: grid; gap: 1px;
  background: var(--paper); border: var(--line); border-radius: 10px;
  padding: 6px 10px; box-shadow: var(--lift);
  border-top: 6px solid var(--c);
}
.lbl.tip b { font: 400 15px/1.1 var(--display); letter-spacing: 0.01em; }
.lbl.tip span { font-size: 12px; color: var(--muted); font-weight: 700; }

/* ------------------------------------------------ HUD pieces */
.title, .panel, .card, .caption {
  position: absolute;
  background: var(--paper);
  border: var(--line);
  border-radius: 16px;
  box-shadow: var(--lift);
}
.title {
  top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px;
  padding: 8px 16px 10px;
  transform: rotate(-1.5deg);
}
.title h1 {
  margin: 0;
  font: 400 34px/1 var(--display);
  letter-spacing: 0.02em;
  color: var(--accent);
  -webkit-text-stroke: 1.5px var(--ink);
  paint-order: stroke fill;
}
.title p { margin: 2px 0 0; font-weight: 800; font-size: 13px; color: var(--muted); }

.panel {
  top: calc(102px + env(safe-area-inset-top, 0px)); left: 16px;
  width: 268px;
  padding: 12px;
  display: grid; gap: 10px;
  max-height: calc(100% - 160px);
  overflow: auto;
}
.panel h2 { margin: 0 2px; font: 400 13px/1 var(--display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
#layers { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.layer { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.toggle {
  display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 9px;
  text-align: left; padding: 6px 8px;
  background: var(--paper); border: 2px solid var(--ink); border-radius: 10px;
  box-shadow: 0 2px 0 var(--ink);
  min-width: 0;
}
.toggle:active, .focus:active, .tools button:active, .opts button:active, .cap-btns button:active { transform: translateY(2px); box-shadow: none; }
.wire {
  height: 10px; border-radius: 6px; background: var(--c);
  border: 2px solid var(--ink);
  position: relative;
}
.wire::after { content: ''; position: absolute; top: 1px; left: 3px; width: 5px; height: 4px; border-radius: 3px; background: rgb(255 255 255 / 0.8); }
.txt { display: grid; min-width: 0; }
.nm { font-weight: 800; font-size: 13.5px; line-height: 1.15; }
.st { font-size: 11.5px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.toggle[aria-pressed="false"] { background: #eef1f6; box-shadow: none; transform: translateY(2px); }
.toggle[aria-pressed="false"] .wire { background: transparent; border-style: dashed; }
.toggle[aria-pressed="false"] .wire::after { display: none; }
.toggle[aria-pressed="false"] .nm { color: var(--muted); }
.focus {
  width: 38px; display: grid; place-items: center;
  background: var(--c); border: 2px solid var(--ink); border-radius: 10px; box-shadow: 0 2px 0 var(--ink);
}
.focus svg { width: 20px; height: 20px; fill: none; stroke: var(--ink); stroke-width: 2.6; stroke-linecap: round; }

.tools { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tools button, .cap-btns button {
  padding: 8px 10px; border: 2px solid var(--ink); border-radius: 10px;
  background: var(--paper); box-shadow: 0 2px 0 var(--ink); font-weight: 800;
}
button.primary { background: var(--accent); color: var(--paper); }
.opts { display: flex; gap: 6px; flex-wrap: wrap; }
.opts button {
  flex: 1; padding: 4px 8px; font-size: 12px; font-weight: 800;
  border: 2px solid var(--ink); border-radius: 999px; background: var(--paper);
}
.opts button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* tour / layer caption */
.caption {
  left: 50%; transform: translateX(-50%);
  bottom: calc(44px + env(safe-area-inset-bottom, 0px));
  width: min(520px, calc(100% - 32px));
  padding: 12px 16px 14px;
  border-top: 10px solid var(--c);
  display: grid; gap: 4px;
}
.cap-k { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.caption h3 { margin: 0; font: 400 24px/1.05 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
.caption p { margin: 0; max-width: 62ch; }
.cap-g { font-size: 12.5px; font-weight: 800; color: var(--muted); }
.cap-g::before { content: 'Built with '; font-weight: 700; }
.cap-btns { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }

/* info card */
.card {
  top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px;
  width: 300px;
  padding: 14px 16px 16px;
  border-top: 10px solid var(--c);
  max-height: calc(100% - 80px); overflow: auto;
}
.card .x {
  position: absolute; top: 6px; right: 8px; width: 30px; height: 30px;
  border: 2px solid var(--ink); border-radius: 50%; background: var(--paper);
  font-size: 20px; line-height: 1; padding: 0;
}
.card-k { font-size: 11px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.card h3 { margin: 2px 36px 6px 0; font: 400 23px/1.05 var(--display); letter-spacing: 0.01em; text-wrap: balance; }
.card-layers { display: flex; gap: 4px; flex-wrap: wrap; }
.chip {
  font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px;
  border: 2px solid var(--ink); background: var(--c);
}
.card-role { margin: 8px 0; }
.card dl { margin: 0; padding: 8px 10px; background: #eef4fb; border-radius: 10px; }
.card dt { font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.card dd { margin: 2px 0 0; font-weight: 800; }
.card h4 { margin: 12px 0 4px; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.card-links { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px; }
.card-links button {
  border: 2px solid var(--ink); background: var(--paper); border-radius: 8px;
  padding: 2px 8px; font-size: 12.5px; font-weight: 700;
}
.card-links button:hover { background: #eef4fb; }

.hint {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  margin: 0; padding: 4px 12px; border-radius: 999px;
  background: rgb(29 42 68 / 0.82); color: var(--paper);
  font-size: 12px; font-weight: 700; white-space: nowrap;
  max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
}
.caption:not([hidden]) ~ .hint { display: none; }

@media (max-width: 760px) {
  .title { padding: 6px 12px 8px; }
  .title h1 { font-size: 26px; }
  .title p { font-size: 12px; }
  .panel {
    top: auto; left: 16px; right: 16px; width: auto;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    padding: 8px; gap: 6px;
    max-height: 42%;
  }
  .panel h2 { display: none; }
  #layers { grid-template-columns: 1fr 1fr; }
  .layer { grid-template-columns: 1fr; }
  .focus { display: none; }
  .toggle { grid-template-columns: 20px 1fr; gap: 6px; padding: 5px 6px; }
  .st { display: none; }
  .nm { font-size: 12px; }
  .hint { display: none; }
  .card { top: auto; left: 16px; right: 16px; width: auto; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-height: 55%; z-index: 2; }
  .caption { bottom: auto; top: calc(78px + env(safe-area-inset-top, 0px)); z-index: 1; }
  .caption .cap-g { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';
// The world of Netlandia: terrain, places and every network, as plain data.
// No three.js in here, so the tests can check it under node.

// The map is drawn flat in x/z and then wrapped onto a small planet: an azimuthal
// equidistant projection around the map centre, so distance from (0, 0) on the
// map is arc length on the planet. Everything far from the centre is the back side.
const PLANET_R = 100;
const SEA_FLOOR = -6;
// The part of the flat map that holds the home country.
const BOARD = { x0: -130, x1: 130, z0: -88, z1: 88 };

// Flat (x, z) -> unit vector from the planet centre. Map centre is +Z, map north (-z) is +Y.
function flatToDir(x, z) {
  const r = Math.hypot(x, z);
  const s = r > 1e-9 ? Math.sin(r / PLANET_R) / r : 1 / PLANET_R;
  return [x * s, -z * s, Math.cos(r / PLANET_R)];
}
function dirToFlat(a, b, c) {
  const th = Math.acos(Math.max(-1, Math.min(1, c)));
  const st = Math.sin(th);
  if (st < 1e-9) return th < 1 ? [0, 0] : [0, Math.PI * PLANET_R];
  const k = (th * PLANET_R) / st;
  return [a * k, -b * k];
}
// How much the map is squeezed sideways at a point: 1 at the centre, ~0.55 at the far islands.
function squeeze(x, z) {
  const th = Math.hypot(x, z) / PLANET_R;
  return th < 1e-6 ? 1 : Math.sin(th) / th;
}

// ---------------------------------------------------------------- noise

function hash(ix, iz) {
  let h = (ix * 374761393 + iz * 668265263) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
const smooth = (t) => t * t * (3 - 2 * t);
function valueNoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = smooth(x - ix), fz = smooth(z - iz);
  const a = hash(ix, iz), b = hash(ix + 1, iz), c = hash(ix, iz + 1), d = hash(ix + 1, iz + 1);
  return (a + (b - a) * fx) + ((c + (d - c) * fx) - (a + (b - a) * fx)) * fz;
}
function fbm(x, z) {
  let s = 0, amp = 0.5, f = 1;
  for (let i = 0; i < 4; i++) { s += amp * (valueNoise(x * f, z * f) * 2 - 1); amp *= 0.5; f *= 2.03; }
  return s;
}
function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

// ---------------------------------------------------------------- land

// Each blob is an ellipse of land; the coast is where the best blob reaches zero.
const BLOBS = [
  [-50, 0, 62, 50],    // western heartland
  [-5, 12, 48, 42],    // the Portsea lowlands
  [-78, -35, 32, 28],  // northern highlands
  [-15, -40, 42, 26],  // Midhill plateau
  [95, 2, 24, 34],     // Isla Verde
  [108, -30, 14, 14],  // Palm Point
];

// Lands on the far side of the planet are round caps measured on the sphere itself,
// so the projection does not stretch them: [flat x, flat z, angular radius].
const CAPS = [
  { id: 'farland', at: [158, 70], r: 0.26 },
  { id: 'westerland', at: [-160, 52], r: 0.21 },
  { id: 'antipoda', at: [-150, 228], r: 0.12 },
  { id: 'north-ice', at: [0, -Math.PI * PLANET_R / 2], r: 0.3, ice: true },
  { id: 'south-ice', at: [0, Math.PI * PLANET_R / 2], r: 0.24, ice: true },
].map((c) => ({ ...c, dir: flatToDir(...c.at) }));

// > 0 on land, < 0 at sea. Roughly the fraction of the way in from the coast.
function landness(x, z) {
  let f = -Infinity;
  for (const [cx, cz, rx, rz] of BLOBS) {
    const dx = (x - cx) / rx, dz = (z - cz) / rz;
    f = Math.max(f, 1 - (dx * dx + dz * dz));
  }
  if (Math.hypot(x, z) > 110) {
    const d = flatToDir(x, z);
    for (const c of CAPS) {
      const ang = Math.acos(Math.min(1, d[0] * c.dir[0] + d[1] * c.dir[1] + d[2] * c.dir[2])) / c.r;
      f = Math.max(f, 1 - ang * ang);
    }
  }
  return f + fbm(x * 0.045, z * 0.045) * 0.14;
}

// True on the polar ice caps.
function icy(x, z) {
  const d = flatToDir(x, z);
  return Math.abs(d[1]) > 0.93;
}

const MOUNTAINS = [
  [-88, -44, 16, 14],
  [-70, -56, 10, 9],
  [-100, -24, 10, 7],
  [104, -32, 6, 5],
];

function rawHeight(x, z) {
  const f = landness(x, z);
  if (f <= 0) return SEA_FLOOR * smoothstep(0, 0.5, -f) - 0.6 * (1 - smoothstep(0, 0.5, -f));
  let h = 0.4 + smoothstep(0, 0.25, f) * 2.2 + Math.max(0, fbm(x * 0.06 + 7, z * 0.06 - 3)) * 5;
  for (const [mx, mz, mh, s] of MOUNTAINS) {
    const d2 = ((x - mx) ** 2 + (z - mz) ** 2) / (s * s);
    h += mh * Math.exp(-d2);
  }
  return h;
}

// Terraced, so the hills read as toy-like steps.
const STEP = 1.6;
function heightAt(x, z) {
  const h = rawHeight(x, z);
  if (h <= 0.4) return h;
  if (Math.hypot(x, z) > 140 && icy(x, z)) return 0.9;   // flat polar ice sheets
  const base = Math.floor(h / STEP) * STEP;
  return Math.max(0.4, base + STEP * smoothstep(0.7, 1, (h - base) / STEP));
}

// ---------------------------------------------------------------- layers

const LAYERS = [
  {
    id: 'dci', name: 'Data center interconnect', short: 'DCI', color: '#9b5de5',
    blurb: 'A ring of waves joining the four Capitalia data centers around downtown. The harbor campus hands its traffic to the subsea cables for Isla Verde and Farland.',
    gear: 'Ciena Waveserver with WaveLogic coherent optics',
  },
  {
    id: 'regional', name: 'Regional transport', short: 'Regional', color: '#ff8c1a',
    blurb: 'Rings through the western towns. Each ring starts on one backbone ROADM and ends on a different one, so neither a fibre cut nor a site failure cuts a town off.',
    gear: 'Ciena 6500 Packet-Optical',
  },
  {
    id: 'backbone', name: 'Countrywide RLS mesh', short: 'RLS mesh', color: '#e63946',
    blurb: 'A meshed line system across the middle of the country. Every ROADM site has at least three ways out, with amplifier huts along each span, and it lands on three of the Capitalia metro hubs.',
    gear: 'Ciena RLS (Reconfigurable Line System) with WaveLogic 6',
  },
  {
    id: 'submarine', name: 'Submarine cable', short: 'Submarine', color: '#ffc300',
    blurb: 'Cables on the sea floor between landing stations, with repeaters along the seabed, out to Isla Verde and over the horizon to Farland and Westerland.',
    gear: 'Ciena GeoMesh Extreme submarine networking',
  },
  {
    id: 'mpls', name: 'MPLS transport', short: 'MPLS', color: '#2f80ed',
    blurb: 'The packet layer over the Capitalia metro: four hub routers in a full mesh of label-switched paths, drawn as arcs in the sky, with a path across to Isla Verde.',
    gear: 'Ciena 8100 Coherent Routers and 5100 series routers',
  },
  {
    id: 'access', name: 'Access network', short: 'Access', color: '#ff4fa3',
    blurb: 'Access rings that leave one hub, pass banks, offices, hospitals and cell towers, and come back into the next hub, so every customer has two ways home.',
    gear: 'Ciena 3900 / 5100 series access devices and NIDs',
  },
];
const LAYER = Object.fromEntries(LAYERS.map((l) => [l.id, l]));

// ---------------------------------------------------------------- places
//
// The country is laid out in three bands so the networks don't sit on top of each other:
//   west   (x < -62)   regional rings through small towns
//   centre (-62..-10)  the countrywide RLS mesh between ROADM towns
//   east   (x > -5)    Capitalia: skyline, data centers, metro hubs, MPLS and access

const METRO = { x: 20, z: 12 };   // downtown Capitalia

const CITIES = [
  { id: 'capitalia', name: 'Capitalia', x: METRO.x, z: METRO.z, r: 12, big: true, tall: 1.2, dense: true },
  // west: regional ring towns
  { id: 'northgate', name: 'Northgate', x: -76, z: -36, r: 3.5, town: true },
  { id: 'ridgeway', name: 'Ridgeway', x: -98, z: -16, r: 3, town: true },
  { id: 'pinecrest', name: 'Pinecrest', x: -84, z: -2, r: 3, town: true },
  { id: 'westmoor', name: 'Westmoor', x: -96, z: 16, r: 3.5, town: true },
  { id: 'fernbank', name: 'Fernbank', x: -86, z: 36, r: 3, town: true },
  { id: 'elmford', name: 'Elmford', x: -62, z: 38, r: 3, town: true },
  // centre: ROADM towns
  { id: 'oakridge', name: 'Oakridge', x: -62, z: -22, r: 3, town: true },
  { id: 'lakeview', name: 'Lakeview', x: -60, z: 10, r: 3, town: true },
  { id: 'southvale', name: 'Southvale', x: -40, z: 32, r: 3, town: true },
  { id: 'midhill', name: 'Midhill', x: -38, z: -36, r: 3, town: true },
  { id: 'junction', name: 'Junction', x: -38, z: -2, r: 3, town: true },
  { id: 'cedargap', name: 'Cedar Gap', x: -14, z: -28, r: 3, town: true },
  { id: 'stonebridge', name: 'Stonebridge', x: -16, z: 0, r: 3, town: true },
  { id: 'millbrook', name: 'Millbrook', x: -16, z: 28, r: 3, town: true },
  // islands
  { id: 'isla', name: 'Isla Verde', x: 92, z: 6, r: 6, big: true, tall: 0.5 },
  { id: 'palmtown', name: 'Palmtown', x: 104, z: -26, r: 3, town: true },
  { id: 'reefside', name: 'Reefside', x: 86, z: 26, r: 3, town: true },
  { id: 'farland', name: 'Farland', x: 160, z: 72, r: 7, big: true, tall: 0.6, far: true },
  { id: 'westerland', name: 'Westerland', x: -162, z: 52, r: 5, tall: 0.4, far: true },
];
const CITY = Object.fromEntries(CITIES.map((c) => [c.id, c]));

// ---------------------------------------------------------------- geometry helpers

function distToSegment(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz || 1)));
  return Math.hypot(px - (ax + t * dx), pz - (az + t * dz));
}

// Polyline in x/z for a link, endpoint to endpoint through its waypoints.
function linkPath(world, link) {
  const a = world.byId[link.a], b = world.byId[link.b];
  return [[a.x, a.z], ...(link.via || []), [b.x, b.z]];
}

function pathLength(pts) {
  let s = 0;
  for (let i = 1; i < pts.length; i++) s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  return s;
}

// Evenly spaced samples along a polyline.
function samplePath(pts, step = 1) {
  const out = [];
  for (let i = 1; i < pts.length; i++) {
    const [ax, az] = pts[i - 1], [bx, bz] = pts[i];
    const n = Math.max(1, Math.ceil(Math.hypot(bx - ax, bz - az) / step));
    for (let k = i === 1 ? 0 : 1; k <= n; k++) out.push([ax + ((bx - ax) * k) / n, az + ((bz - az) * k) / n]);
  }
  return out;
}

// ---------------------------------------------------------------- build

function buildWorld() {
  const nodes = PLACED.map((n) => ({ ...n }));
  for (const n of nodes) if (n.coastOf) Object.assign(n, coastPoint(CITY[n.coastOf], n.toward));
  const byId = Object.fromEntries(nodes.map((n) => [n.id, n]));
  const links = LINKS.map((l) => ({ ...l }));

  for (const [site, tier] of ROUTER_SITES) {
    const s = byId[site];
    const r = N('rtr_' + site, 'router', `${s.name.replace(/ (Central Office|hub)$/, '')} ${tier === 'core' ? 'core router' : 'aggregation router'}`,
      s.x, s.z, ['mpls'], { host: site, tier, role: tier === 'core' ? 'MPLS core (P/PE) router' : 'MPLS aggregation router' });
    nodes.push(r);
    byId[r.id] = r;
  }

  // Access rings: one node per customer, chained from site to site.
  const used = {};
  const pick = (type) => {
    const i = (used[type] = (used[type] ?? -1) + 1);
    return type === 'tower' ? `Cell site ${i + 1}` : NAMES[type][i % NAMES[type].length];
  };
  ACCESS_RINGS.forEach(({ from, to, stops }, r) => {
    let prev = from;
    stops.forEach(([type, x, z], i) => {
      const e = N(`end_${r}_${i}`, type, pick(type), x, z, ['access'], { role: ENDPOINT[type].label, gear: ENDPOINT[type].gear });
      nodes.push(e); byId[e.id] = e;
      links.push(L('access', prev, e.id));
      prev = e.id;
    });
    links.push(L('access', prev, to));
  });

  // RLS line amplifiers along the countrywide spans.
  for (const link of links) {
    if (link.layer !== 'backbone') continue;
    const pts = [[byId[link.a].x, byId[link.a].z], ...(link.via || []), [byId[link.b].x, byId[link.b].z]];
    const len = pathLength(pts);
    const n = Math.floor(len / 15);
    for (let k = 1; k <= n; k++) {
      const [x, z] = pointAt(pts, (k / (n + 1)) * len);
      const ila = N(`ila_${link.a}_${link.b}_${k}`, 'ila', 'In-line amplifier', x, z, [link.layer],
        { role: `Amplifier hut on ${byId[link.a].name} – ${byId[link.b].name}` });
      nodes.push(ila); byId[ila.id] = ila;
    }
  }

  // Submarine repeaters, every ~9 units along each sea path that is actually underwater.
  for (const link of links) {
    if (!link.sea) continue;
    const pts = [[byId[link.a].x, byId[link.a].z], ...link.via, [byId[link.b].x, byId[link.b].z]];
    const len = pathLength(pts);
    let k = 0;
    for (let d = 9; d < len - 4; d += 9) {
      const [x, z] = pointAt(pts, d);
      if (heightAt(x, z) > -3) continue;
      const rep = N(`rep_${link.a}_${link.b}_${k++}`, 'repeater', 'Undersea repeater', x, z, ['submarine'],
        { role: `Repeater on the ${link.name}` });
      nodes.push(rep); byId[rep.id] = rep;
    }
  }

  for (const n of nodes) {
    n.gear = n.gear || gearFor(n);
    n.links = [];
  }
  links.forEach((l, i) => {
    l.id = 'link' + i;
    byId[l.a].links.push(l.id);
    byId[l.b].links.push(l.id);
  });

  return { nodes, links, byId, cities: CITIES, layers: LAYERS };
}

// Last dry spot walking from a town toward a point at sea.
function coastPoint(c, [tx, tz]) {
  let x = c.x, z = c.z;
  const len = Math.hypot(tx - x, tz - z), ux = (tx - x) / len, uz = (tz - z) / len;
  while (heightAt(x + ux * 1.5, z + uz * 1.5) >= 0.6) { x += ux * 0.5; z += uz * 0.5; }
  return { x, z };
}

function pointAt(pts, d) {
  for (let i = 1; i < pts.length; i++) {
    const seg = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (d <= seg) {
      const t = d / seg;
      return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t];
    }
    d -= seg;
  }
  return pts[pts.length - 1];
}

function gearFor(n) {
  switch (n.type) {
    case 'dc': return 'Ciena Waveserver 5 with WaveLogic 6 Extreme';
    case 'pop': return 'Ciena RLS ROADM with WaveLogic 6 transponders';
    case 'hub': return 'Ciena 6500 Packet-Optical and RLS, 8100 router';
    case 'regional': return 'Ciena 6500 Packet-Optical';
    case 'ila': return 'Ciena RLS line amplifier';
    case 'cls': return 'Ciena GeoMesh Extreme submarine line terminal';
    case 'repeater': return 'Submarine optical repeater';
    case 'router': return n.tier === 'core' ? 'Ciena 8100 Coherent Router' : 'Ciena 5100 series router';
    case 'access': return 'Ciena 5100 series access router';
    default: return '';
  }
}

// Everything three.js: the little planet, towns, equipment models, cables and traffic.

const INK = new THREE.Color('#1d2a44');

// ---------------------------------------------------------------- materials

const gradient = (() => {
  const t = new THREE.DataTexture(new Uint8Array([110, 185, 255]), 3, 1, THREE.RedFormat);
  t.minFilter = t.magFilter = THREE.NearestFilter;
  t.needsUpdate = true;
  return t;
})();

const matCache = new Map();
function toon(color, opts = {}) {
  const key = !Object.keys(opts).length && String(color);
  if (key && matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshToonMaterial({ color, gradientMap: gradient, ...opts });
  if (key) matCache.set(key, m);
  return m;
}
// Faceted look: toon materials have no flatShading, so split the vertices instead.
function flat(geo) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  g.computeVertexNormals();
  return g;
}
const inkMat = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide });

// A black back-face shell slightly bigger than the mesh: the cartoon outline.
function outline(mesh, t = 0.09) {
  mesh.geometry.computeBoundingBox();
  const s = new THREE.Vector3();
  mesh.geometry.boundingBox.getSize(s);
  const o = new THREE.Mesh(mesh.geometry, inkMat);
  o.scale.set((s.x + 2 * t) / Math.max(s.x, 1e-3), (s.y + 2 * t) / Math.max(s.y, 1e-3), (s.z + 2 * t) / Math.max(s.z, 1e-3));
  o.raycast = () => {};
  mesh.add(o);
  return mesh;
}

function box(w, h, d, color, x = 0, y = 0, z = 0, line = 0.08) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), toon(color));
  m.position.set(x, y + h / 2, z);
  m.castShadow = m.receiveShadow = true;
  return line ? outline(m, line) : m;
}
function cyl(rt, rb, h, color, x = 0, y = 0, z = 0, seg = 12, line = 0.06) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), toon(color));
  m.position.set(x, y + h / 2, z);
  m.castShadow = true;
  return line ? outline(m, line) : m;
}
function ball(r, color, x, y, z, line = 0.06) {
  const m = new THREE.Mesh(flat(new THREE.IcosahedronGeometry(r, 1)), toon(color));
  m.position.set(x, y, z);
  m.castShadow = true;
  return line ? outline(m, line) : m;
}
// Gable roof: a triangular prism along x.
function gable(w, h, d, color, y) {
  const shape = new THREE.Shape();
  shape.moveTo(-d / 2, 0); shape.lineTo(d / 2, 0); shape.lineTo(0, h); shape.closePath();
  const g = new THREE.ExtrudeGeometry(shape, { depth: w, bevelEnabled: false });
  g.translate(0, 0, -w / 2);
  g.rotateY(Math.PI / 2);
  const m = new THREE.Mesh(g, toon(color));
  m.position.y = y;
  m.castShadow = true;
  return outline(m, 0.07);
}

// ---------------------------------------------------------------- planet

// Flat map point (x, z) at height y -> position on the planet.
function sph(x, y, z, out = new THREE.Vector3()) {
  const [a, b, c] = flatToDir(x, z);
  return out.set(a, b, c).multiplyScalar(PLANET_R + y);
}

// Orientation that stands an object upright on the planet at (x, z), with its
// local +x pointing map-east and +z map-south, as it would on the flat map.
const _e = new THREE.Vector3(), _u = new THREE.Vector3(), _so = new THREE.Vector3(), _bm = new THREE.Matrix4();
function frameAt(x, z, out = new THREE.Quaternion()) {
  sph(x, 0, z, _u).normalize();
  sph(x + 0.05, 0, z, _e).sub(sph(x - 0.05, 0, z, _so));
  _so.crossVectors(_e, _u).normalize();
  _e.crossVectors(_u, _so).normalize();
  return out.setFromRotationMatrix(_bm.makeBasis(_e, _u, _so));
}

// Put an object on the planet where it would sit on the flat map.
function place(obj, x, y, z, ry = 0) {
  sph(x, y, z, obj.position);
  frameAt(x, z, obj.quaternion);
  if (ry) obj.rotateY(ry);
  return obj;
}

function buildPlanet(scene) {
  // Ground and sea floor in one closed, faceted sphere.
  const geo = new THREE.IcosahedronGeometry(1, 110);
  const pos = geo.attributes.position;
  const col = new Float32Array(pos.count * 3);
  const c = new THREE.Color();
  const pal = {
    deep: new THREE.Color('#1c5fa8'), shelf: new THREE.Color('#5fd0e0'), sand: new THREE.Color('#f3dc9a'),
    grass: new THREE.Color('#8fd16a'), grass2: new THREE.Color('#6dbb55'), hill: new THREE.Color('#4f9d4a'),
    rock: new THREE.Color('#a39283'), snow: new THREE.Color('#ffffff'), ice: new THREE.Color('#e3f4ff'),
  };
  const v = new THREE.Vector3();
  const cache = new Map();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i).normalize();
    const key = `${v.x.toFixed(5)},${v.y.toFixed(5)},${v.z.toFixed(5)}`;
    let hit = cache.get(key);
    if (!hit) {
      const [x, z] = dirToFlat(v.x, v.y, v.z);
      const h = heightAt(x, z);
      if (h < 0) c.copy(pal.deep).lerp(pal.shelf, smoothstep(SEA_FLOOR, -1, h));
      else if (icy(x, z)) c.copy(pal.ice);
      else if (h < 0.9 && landness(x, z) < 0.12) c.copy(pal.sand);
      else if (h > 13) c.copy(pal.snow);
      else if (h > 8) c.copy(pal.rock);
      else if (h > 4.5) c.copy(pal.hill);
      else c.copy(((Math.sin(x * 0.3) + Math.cos(z * 0.27)) > 0.4) ? pal.grass2 : pal.grass);
      hit = [h, c.r, c.g, c.b];
      cache.set(key, hit);
    }
    v.multiplyScalar(PLANET_R + hit[0]);
    pos.setXYZ(i, v.x, v.y, v.z);
    col.set([hit[1], hit[2], hit[3]], i * 3);
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();
  const terrain = new THREE.Mesh(geo, new THREE.MeshToonMaterial({ vertexColors: true, gradientMap: gradient }));
  terrain.receiveShadow = true;
  terrain.name = 'terrain';
  scene.add(terrain);

  // Sea: a translucent shell so the sea floor and its cables show through.
  const waterMat = new THREE.MeshToonMaterial({ color: '#36b5e8', gradientMap: gradient, transparent: true, opacity: 0.55, depthWrite: false });
  const water = new THREE.Mesh(new THREE.SphereGeometry(PLANET_R, 160, 120), waterMat);
  water.renderOrder = 2;
  scene.add(water);

  // Atmosphere: a soft rim of light around the planet.
  const glow = new THREE.Mesh(new THREE.SphereGeometry(PLANET_R * 1.16, 64, 48), new THREE.ShaderMaterial({
    side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    uniforms: { color: { value: new THREE.Color('#9fe3ff') } },
    vertexShader: `varying vec3 vN; varying vec3 vV;
      void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `uniform vec3 color; varying vec3 vN; varying vec3 vV;
      void main() { float k = clamp(-dot(vN, vV), 0.0, 1.0); gl_FragColor = vec4(color, k * k * 1.7); }`,
  }));
  glow.raycast = () => {};
  scene.add(glow);

  // Foam: white dabs where land meets water.
  const foam = [];
  for (let x = -200; x < 200; x += 1.6) {
    for (let z = -170; z < 240; z += 1.6) {
      if (Math.hypot(x, z) > 290) continue;
      const h = heightAt(x, z);
      if (h < 0 && h > -0.9 && landness(x, z) > -0.04 && Math.random() < squeeze(x, z) + 0.1) foam.push([x, z]);
    }
  }
  const foamMesh = new THREE.InstancedMesh(new THREE.CircleGeometry(0.9, 8), new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.7, depthWrite: false }), foam.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), qx = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));
  const one = new THREE.Vector3(1, 1, 1), p = new THREE.Vector3();
  foam.forEach(([x, z], i) => foamMesh.setMatrixAt(i, m4.compose(sph(x, 0.04, z, p), frameAt(x, z, q).multiply(qx), one)));
  foamMesh.renderOrder = 4;
  foamMesh.raycast = () => {};
  scene.add(foamMesh);

  return { terrain, water, waterMat, foamMesh };
}

// ---------------------------------------------------------------- instanced helpers

const _m = new THREE.Matrix4(), _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _qy = new THREE.Quaternion(), _s = new THREE.Vector3(), _c = new THREE.Color();

// items: {x, y, z, sx, sy, sz, color, ry}
function instanced(geo, items, { line = 0.1, shadow = true, faceted = false } = {}) {
  if (faceted) geo = flat(geo);
  const g = new THREE.Group();
  if (!items.length) return g;
  const body = new THREE.InstancedMesh(geo, toon('#ffffff'), items.length);
  const ink = line ? new THREE.InstancedMesh(geo, inkMat, items.length) : null;
  geo.computeBoundingBox();
  const size = new THREE.Vector3();
  geo.boundingBox.getSize(size);
  items.forEach((it, i) => {
    sph(it.x, it.y, it.z, _p);
    frameAt(it.x, it.z, _q).multiply(_qy.setFromAxisAngle(THREE.Object3D.DEFAULT_UP, it.ry || 0));
    _s.set(it.sx, it.sy, it.sz);
    body.setMatrixAt(i, _m.compose(_p, _q, _s));
    body.setColorAt(i, _c.set(it.color));
    if (ink) {
      _s.set(it.sx + (2 * line) / size.x, it.sy + (2 * line) / size.y, it.sz + (2 * line) / size.z);
      ink.setMatrixAt(i, _m.compose(_p, _q, _s));
    }
  });
  body.castShadow = shadow;
  body.receiveShadow = true;
  g.add(body);
  if (ink) { ink.raycast = () => {}; g.add(ink); }
  return g;
}

const unitBox = new THREE.BoxGeometry(1, 1, 1).translate(0, 0.5, 0);
const unitRoof = (() => {
  const s = new THREE.Shape();
  s.moveTo(-0.5, 0); s.lineTo(0.5, 0); s.lineTo(0, 0.6); s.closePath();
  return new THREE.ExtrudeGeometry(s, { depth: 1, bevelEnabled: false }).translate(0, 0, -0.5);
})();

function rand(seed) {
  let s = seed >>> 0;
  return () => ((s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296);
}

// Segments of every ground link, to keep buildings and trees off the cables.
function cableSegments(world) {
  const segs = [];
  for (const l of world.links) {
    if (l.layer === 'mpls' || l.sea) continue;
    const p = linkPath(world, l);
    for (let i = 1; i < p.length; i++) segs.push([p[i - 1][0], p[i - 1][1], p[i][0], p[i][1]]);
  }
  return segs;
}
const clearOf = (segs, nodes, x, z, cable, node) =>
  segs.every((s) => distToSegment(x, z, ...s) > cable) &&
  nodes.every((n) => Math.hypot(n.x - x, n.z - z) > node);

// ---------------------------------------------------------------- towns and scenery

const BUILDING_COLORS = ['#f6f1e7', '#ffd6a5', '#bde0fe', '#cdb4db', '#ffc8dd', '#caffbf', '#e9edc9', '#a2d2ff'];
const ROOF_COLORS = ['#e76f51', '#c0504d', '#6d597a', '#457b9d', '#e9a03b'];

function buildTowns(world) {
  const segs = cableSegments(world);
  const ground = world.nodes.filter((n) => !['router', 'repeater'].includes(n.type));
  const r = rand(11);
  const towers = [], roofs = [], caps = [];
  for (const c of world.cities) {
    // the far side of the planet squeezes the map sideways, so space lots out there
    const step = (c.town ? 1.9 : c.dense ? 1.85 : 2.3) / squeeze(c.x, c.z);
    for (let x = c.x - c.r; x <= c.x + c.r; x += step) {
      for (let z = c.z - c.r; z <= c.z + c.r; z += step) {
        const d = Math.hypot(x - c.x, z - c.z) / c.r;
        if (d > 1 || r() < 0.12) continue;
        const jx = x + (r() - 0.5) * 0.4, jz = z + (r() - 0.5) * 0.4;
        if (heightAt(jx, jz) < 0.6 || !clearOf(segs, ground, jx, jz, 1.5, 2.6)) continue;
        const y = heightAt(jx, jz) - 0.3;
        const color = BUILDING_COLORS[Math.floor(r() * BUILDING_COLORS.length)];
        if (c.town || (d > 0.6 && r() < 0.6)) {
          const w = 1.1 + r() * 0.5, dd = 0.9 + r() * 0.4, h = 0.9 + r() * 0.5, ry = r() < 0.5 ? 0 : Math.PI / 2;
          towers.push({ x: jx, y, z: jz, sx: w, sy: h + 0.3, sz: dd, color, ry });
          roofs.push({ x: jx, y: y + h + 0.3, z: jz, sx: dd + 0.15, sy: 1.1, sz: w + 0.15, color: ROOF_COLORS[Math.floor(r() * ROOF_COLORS.length)], ry: ry + Math.PI / 2 });
        } else {
          const w = 1.3 + r() * 0.6, h = 1.5 + (1 - d) * (c.tall ?? 0.4) * 12 * (0.5 + r());
          towers.push({ x: jx, y, z: jz, sx: w, sy: h, sz: w, color });
          caps.push({ x: jx, y: y + h, z: jz, sx: w * 0.6, sy: 0.35, sz: w * 0.6, color: '#8d99ae' });
        }
      }
    }
  }
  const g = new THREE.Group();
  g.add(instanced(unitBox, towers, { line: 0.09 }), instanced(unitRoof, roofs, { line: 0.08 }), instanced(unitBox, caps, { line: 0.05 }));
  return g;
}

function buildTrees(world) {
  const segs = cableSegments(world);
  const ground = world.nodes.filter((n) => !['router', 'repeater'].includes(n.type));
  const r = rand(5);
  const pines = [], rounds = [], trunks = [];
  for (let x = -200; x < 200; x += 1.7) {
    for (let z = -170; z < 240; z += 1.7) {
      const jx = x + (r() - 0.5) * 1.4, jz = z + (r() - 0.5) * 1.4;
      if (Math.hypot(jx, jz) > 290) continue;
      const h = heightAt(jx, jz);
      if (h < 1 || h > 12.5 || icy(jx, jz) || r() > squeeze(jx, jz)) continue;
      const forest = Math.sin(jx * 0.11 + 1.3) * Math.cos(jz * 0.13) + Math.sin(jx * 0.05 - jz * 0.07);
      if (forest < 0.55 || r() < 0.35) continue;
      if (world.cities.some((c) => Math.hypot(c.x - jx, c.z - jz) < c.r + 2.5)) continue;
      if (!clearOf(segs, ground, jx, jz, 1.6, 3)) continue;
      const s = 0.7 + r() * 0.6;
      trunks.push({ x: jx, y: h - 0.2, z: jz, sx: 0.25 * s, sy: 0.8 * s, sz: 0.25 * s, color: '#8a5a3b' });
      if (h > 5 || r() < 0.3) pines.push({ x: jx, y: h + 0.5 * s, z: jz, sx: s, sy: s * 1.4, sz: s, color: r() < 0.5 ? '#2f8f5b' : '#3a9f60' });
      else rounds.push({ x: jx, y: h + 1.0 * s, z: jz, sx: s, sy: s, sz: s, color: r() < 0.5 ? '#5cb85c' : '#7bc96f' });
    }
  }
  const g = new THREE.Group();
  g.add(
    instanced(unitBox, trunks, { line: 0 }),
    instanced(new THREE.ConeGeometry(0.9, 2, 7).translate(0, 1, 0), pines, { line: 0.08, faceted: true }),
    instanced(new THREE.IcosahedronGeometry(0.9, 0), rounds, { line: 0.08, faceted: true }),
  );
  return g;
}

// Little things that move: boats, wind turbines, clouds.
function buildLife(scene) {
  const movers = [];
  const boat = (color) => {
    const b = new THREE.Group();
    b.add(box(2.6, 0.6, 1.1, color, 0, -0.2, 0, 0.07), box(1, 0.7, 0.8, '#ffffff', -0.3, 0.4, 0, 0.06));
    return b;
  };
  for (const [cx, cz, r, sp, color] of [[52, -20, 10, 0.12, '#e63946'], [60, 50, 14, -0.08, '#264653'], [-112, -40, 9, 0.1, '#f4a261'], [10, 66, 12, 0.07, '#2a9d8f']]) {
    const b = boat(color);
    scene.add(b);
    movers.push((t) => {
      const a = t * sp;
      place(b, cx + Math.cos(a) * r, Math.sin(t * 2 + cx) * 0.08, cz + Math.sin(a) * r, -a + (sp > 0 ? -Math.PI / 2 : Math.PI / 2));
    });
  }

  // Cable ship parked over the Portsea – Isla Verde cable.
  const ship = new THREE.Group();
  ship.add(box(5, 0.9, 1.8, '#f1faee', 0, -0.3, 0, 0.08), box(1.6, 1.2, 1.4, '#ffc300', 1.2, 0.6, 0, 0.07),
    cyl(0.12, 0.12, 2.2, '#1d2a44', -1.4, 0.6, 0, 6, 0), box(0.2, 0.2, 1.8, '#1d2a44', -1.9, 2.6, 0, 0));
  scene.add(ship);
  movers.push((t) => { place(ship, 56, Math.sin(t * 1.6) * 0.1, 30, 0.5); ship.rotateX(Math.sin(t * 1.3) * 0.03); });

  // Wind farm on the moor.
  for (const [x, z] of [[-100, -6], [-104, 0], [-97, -12], [-108, -10]]) {
    const y = heightAt(x, z);
    const t = new THREE.Group();
    t.add(cyl(0.15, 0.3, 6, '#ffffff', 0, 0, 0, 8, 0.05));
    const rotor = new THREE.Group();
    rotor.position.set(0, 6, 0.35);
    for (let k = 0; k < 3; k++) {
      const blade = box(0.25, 3, 0.08, '#ffffff', 0, 0, 0, 0.04);
      const arm = new THREE.Group();
      arm.rotation.z = (k * Math.PI * 2) / 3;
      arm.add(blade);
      rotor.add(arm);
    }
    rotor.add(ball(0.3, '#e63946', 0, 0, 0, 0.04));
    t.add(rotor);
    place(t, x, y, z, 0.4);
    scene.add(t);
    movers.push((tt) => { rotor.rotation.z = -tt * 1.4 + x; });
  }

  // Clouds that drift across and cast soft shadows.
  const clouds = new THREE.Group();
  const cr = rand(3);
  const cloudMat = toon('#ffffff', { transparent: true, opacity: 0.92 });
  const Y = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i < 16; i++) {
    const c = new THREE.Group();
    for (let k = 0; k < 5; k++) {
      const m = new THREE.Mesh(flat(new THREE.IcosahedronGeometry(2.4 + cr() * 2, 1)), cloudMat);
      m.position.set((k - 2) * 2.6 + cr(), cr() * 1.2, (cr() - 0.5) * 3);
      m.castShadow = true;
      c.add(m);
    }
    // anywhere between the polar circles, floating above the hills
    const dir = new THREE.Vector3().setFromSphericalCoords(1, 0.5 + cr() * (Math.PI - 1), cr() * Math.PI * 2);
    c.position.copy(dir).multiplyScalar(PLANET_R + 19 + cr() * 4);
    c.quaternion.setFromUnitVectors(Y, dir);
    clouds.add(c);
  }
  scene.add(clouds);
  movers.push((t, dt) => { clouds.rotation.y += dt * 0.012; });
  return { movers, clouds, cloudMat };
}

const routerTop = (() => {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = '#2f80ed'; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = '#ffffff'; g.fillStyle = '#ffffff'; g.lineWidth = 9; g.lineCap = 'round';
  const arrow = (a, inward) => {
    g.save(); g.translate(64, 64); g.rotate(a);
    const [s, e] = inward ? [46, 14] : [14, 46];
    g.beginPath(); g.moveTo(s, 0); g.lineTo(e, 0); g.stroke();
    g.beginPath(); g.moveTo(e + (inward ? -2 : 2), 0); g.lineTo(e + (inward ? 12 : -12), -11); g.lineTo(e + (inward ? 12 : -12), 11); g.closePath(); g.fill();
    g.restore();
  };
  arrow(Math.PI / 4, false); arrow(-3 * Math.PI / 4, false); arrow(3 * Math.PI / 4, true); arrow(-Math.PI / 4, true);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

    case 'factory': {
      g.add(box(4, 2, 3, '#a8dadc', 0, -0.3));
      for (let i = 0; i < 3; i++) g.add(gable(3, 0.7, 1.3, '#457b9d', 1.7).translateX(-1.3 + i * 1.3).rotateY(Math.PI / 2));
      g.add(cyl(0.35, 0.45, 4, '#e9ecef', 1.5, -0.3, -1, 10, 0.05));
      g.add(cyl(0.36, 0.36, 0.5, '#e63946', 1.5, 3.2, -1, 10, 0.03));
      for (let k = 0; k < 3; k++) {
        const puff = ball(0.45 + k * 0.15, '#f1f3f5', 1.5, 4.4 + k * 0.9, -1, 0.03);

  return g;

// Height a node's model stands at.
function nodeY(world, n) {
  if (n.type === 'router') return Math.max(0, heightAt(n.x, n.z)) + (n.tier === 'core' ? 12 : 8.5);
  if (n.type === 'repeater') return heightAt(n.x, n.z);
  return Math.max(0.4, heightAt(n.x, n.z));
}

// ---------------------------------------------------------------- cables

const LIFT = { backbone: 0.55, regional: 0.45, dci: 0.45, access: 0.3, submarine: 0.35 };
const RADIUS = { backbone: 0.42, regional: 0.32, dci: 0.34, access: 0.18, submarine: 0.36, mpls: 0.2 };

function groundY(x, z) {
  let h = -Infinity;
  for (const [dx, dz] of [[0, 0], [0.8, 0], [-0.8, 0], [0, 0.8], [0, -0.8]]) h = Math.max(h, heightAt(x + dx, z + dz));
  return h;
}

const dash = (() => {
  const cv = document.createElement('canvas');
  cv.width = 64; cv.height = 4;
  const g = cv.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, 64, 4);
  g.fillStyle = '#fff'; g.fillRect(0, 0, 40, 4);
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = THREE.RepeatWrapping;
  return t;
})();

// A cable's centre line as a three.js curve.
function linkCurve(world, l, nodeYs) {
  if (l.layer === 'mpls') {
    // an arc over the planet: straight on the map, raised in the middle
    const a = world.byId[l.a], b = world.byId[l.b];
    const ya = nodeYs[a.id], yb = nodeYs[b.id];
    const len = Math.hypot(b.x - a.x, b.z - a.z);
    const ym = Math.max(ya, yb) + 3 + len * 0.16;
    const pts = [];
    for (let i = 0, n = Math.max(12, Math.ceil(len / 2)); i <= n; i++) {
      const t = i / n;
      const y = (1 - t) * (1 - t) * ya + 2 * t * (1 - t) * ym + t * t * yb;
      pts.push(sph(a.x + (b.x - a.x) * t, y, a.z + (b.z - a.z) * t));
    }
    return { curve: new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5), len };
  }
  const path = linkPath(world, l);
  const pts = samplePath(path, 1.4).map(([x, z]) => {
    const h = groundY(x, z);
    const y = h < 0 ? heightAt(x, z) + LIFT.submarine : h + LIFT[l.layer];
    return sph(x, y, z);
  });
  return { curve: new THREE.CatmullRomCurve3(pts, false, 'centripetal', 0.5), len: pathLength(path) };
}

function buildCable(world, l, color, nodeYs) {
  const { curve, len } = linkCurve(world, l, nodeYs);
  const r = RADIUS[l.layer];
  const segs = Math.max(8, Math.ceil(len * 1.6));
  const mat = l.layer === 'mpls'
    ? new THREE.MeshToonMaterial({ color, gradientMap: gradient, alphaMap: dash.clone(), alphaTest: 0.5 })
    : new THREE.MeshToonMaterial({ color, gradientMap: gradient });
  if (mat.alphaMap) {
    mat.alphaMap.repeat.set(Math.max(2, Math.round(len / 2.2)), 1);
    mat.alphaMap.needsUpdate = true;
  }
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, segs, r, 6, false), mat);
  mesh.castShadow = l.layer !== 'submarine';
  const ink = new THREE.Mesh(new THREE.TubeGeometry(curve, segs, r + 0.11, 6, false),
    l.layer === 'mpls' ? new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide, alphaMap: mat.alphaMap, alphaTest: 0.5 }) : inkMat.clone());
  ink.raycast = () => {};
  mesh.add(ink);
  const table = curve.getSpacedPoints(Math.max(8, Math.ceil(len * 2)));
  return { mesh, table, len, mat, ink };
}

// The dashed pole that ties a floating router to the building it lives in.
function routerPole(x, yTop, yBottom, z, color) {
  const h = yTop - yBottom;
  const mat = new THREE.MeshBasicMaterial({ color, alphaMap: dash.clone(), alphaTest: 0.5 });
  mat.alphaMap.repeat.set(Math.max(2, Math.round(h / 0.9)), 1);
  mat.alphaMap.needsUpdate = true;
  const geo = new THREE.CylinderGeometry(0.08, 0.08, h, 6, 1, true);
  // swap uv so the dash runs up the pole
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) { const u = uv.getX(i); uv.setXY(i, uv.getY(i), u); }
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, yBottom + h / 2, z);
  m.raycast = () => {};
  return m;
}

// OrbitControls spins a stand-in camera around the planet's centre; the real camera
// is then set from it each frame: straight down at the planet when far away, tilting
// toward the horizon as it comes in close, the way a little-planet game frames it.
const rig = new THREE.PerspectiveCamera(38, 1, 1, 3000);
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 3000);
const dirOf = (x, z) => new THREE.Vector3(...flatToDir(x, z));
// Open over the home country, a little west so the layer panel doesn't hide Westmoor.

rig.position.copy(HOME.dir).multiplyScalar(HOME.dist);

const controls = new OrbitControls(rig, canvas);
controls.target.set(0, 0, 0);
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minPolarAngle = 0.25;
controls.maxPolarAngle = Math.PI - 0.25;
controls.minDistance = R + 26;
controls.maxDistance = R * 4.5;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

const _d = new THREE.Vector3(), _n = new THREE.Vector3(), _f = new THREE.Vector3();
function aimCamera() {
  const dist = rig.position.length();
  const h = dist - R;
  _d.copy(rig.position).normalize();
  _n.copy(UP).addScaledVector(_d, -_d.y);                        // map north at this spot
  if (_n.lengthSq() < 1e-6) _n.set(0, 0, -1);
  _n.normalize();
  const tilt = 0.72 * (1 - THREE.MathUtils.smoothstep(h, 45, 190));
  _f.copy(_d).multiplyScalar(R);                                  // the spot under the camera
  camera.position.copy(_f).addScaledVector(_d, h * Math.cos(tilt)).addScaledVector(_n, -h * Math.sin(tilt));
  camera.up.copy(_n).multiplyScalar(Math.cos(tilt)).addScaledVector(_d, Math.sin(tilt));
  camera.lookAt(_f.addScaledVector(_n, h * 0.12 * Math.sin(tilt)));
  // drag moves the ground under the pointer at about the same rate at any zoom
  controls.rotateSpeed = THREE.MathUtils.clamp(h / (R * 1.9), 0.1, 1);
  // keep the sun and sky light over whatever is in view, so it's always daytime
  sun.position.copy(_d).multiplyScalar(300).addScaledVector(_n, 120).addScaledVector(_side.crossVectors(_n, _d), -140);
  hemi.position.copy(_d);
  // clouds would sit in your face when zoomed in, so they thin out as you come down
  life.cloudMat.opacity = 0.92 * THREE.MathUtils.smoothstep(h, 70, 150);
  life.clouds.visible = opts.clouds && life.cloudMat.opacity > 0.02;
}
const _side = new THREE.Vector3();

// Each node is drawn once, on its first layer, and is shown while any of its layers is.
const nodeObjs = {};
const pickables = [];
const blinkers = [], puffs = [];
for (const n of world.nodes) {
  const home = n.layers[0];
  const g = modelFor(n, LAYER[home].color);
  place(g, n.x, nodeYs[n.id], n.z);
  g.userData.node = n;
  g.traverse((o) => {
    o.userData.nodeId = n.id;
    if (o.userData.blink) blinkers.push(o);
    if (o.userData.puff !== undefined) puffs.push(o);
  });
  scene.add(g);
  nodeObjs[n.id] = g;
  pickables.push(g);
  if (n.type === 'router') {
    const host = world.byId[n.host];
    g.add(routerPole(0, -0.4, nodeYs[host.id] + 3 - nodeYs[n.id], 0, LAYER.mpls.color));
  }
}

const linkObjs = {};
for (const l of world.links) {
  const c = buildCable(world, l, LAYER[l.layer].color, nodeYs);
  c.mesh.userData.linkId = l.id;
  layerGroups[l.layer].add(c.mesh);
  linkObjs[l.id] = c;
}

// Traffic: little glowing packets running both ways along every link.
const SPEED = { dci: 16, backbone: 20, regional: 13, submarine: 14, mpls: 15, access: 8 };
const packets = {};
for (const layer of LAYERS) {
  const runs = [];
  for (const l of world.links.filter((x) => x.layer === layer.id)) {
    const n = Math.max(1, Math.round(linkObjs[l.id].len / (layer.id === 'access' ? 9 : 14)));
    for (let k = 0; k < n; k++) runs.push({ link: linkObjs[l.id], phase: (k + Math.random() * 0.5) / n, dir: k % 2 ? -1 : 1 });
  }
  const r = layer.id === 'access' ? 0.32 : 0.48;
  const col = new THREE.Color(layer.color).lerp(new THREE.Color('#ffffff'), 0.45);
  const mesh = new THREE.InstancedMesh(new THREE.SphereGeometry(r, 10, 8), new THREE.MeshBasicMaterial({ color: col }), runs.length);
  mesh.raycast = () => {};
  layerGroups[layer.id].add(mesh);
  packets[layer.id] = { mesh, runs };
}
const _pm = new THREE.Matrix4(), _v = new THREE.Vector3();
function movePackets(t) {
  for (const id in packets) {
    const { mesh, runs } = packets[id];
    if (!mesh.parent.visible) continue;
    runs.forEach((p, i) => {
      const tab = p.link.table;
      let u = (p.phase + (t * SPEED[id]) / p.link.len) % 1;
      if (p.dir < 0) u = 1 - u;
      const f = u * (tab.length - 1), k = Math.floor(f);
      _v.copy(tab[k]).lerp(tab[Math.min(k + 1, tab.length - 1)], f - k);
      mesh.setMatrixAt(i, _pm.makeTranslation(_v.x, _v.y, _v.z));
    });
    mesh.instanceMatrix.needsUpdate = true;
  }
}

// Selection ring.
const ring = new THREE.Group();
const ringMesh = new THREE.Mesh(new THREE.TorusGeometry(3, 0.28, 8, 40), new THREE.MeshBasicMaterial({ color: '#ffffff' }));

// ---------------------------------------------------------------- layer state

const shown = Object.fromEntries(LAYERS.map((l) => [l.id, true]));
let selected = null;

function applyLayers() {
  for (const l of LAYERS) layerGroups[l.id].visible = shown[l.id];
  for (const n of world.nodes) nodeObjs[n.id].visible = n.layers.some((id) => shown[id]);
  // see-through sea when the cables underneath are the point
  const onlySub = shown.submarine && LAYERS.filter((l) => shown[l.id]).length <= 2;
  board.waterMat.opacity = onlySub ? 0.3 : 0.55;
  for (const btn of document.querySelectorAll('[data-layer]')) btn.setAttribute('aria-pressed', String(shown[btn.dataset.layer]));
  if (selected && !nodeObjs[selected].visible) select(null);
}

function emphasise() {
  const keep = selected ? new Set(world.byId[selected].links) : null;
  for (const l of world.links) {
    const o = linkObjs[l.id];
    const dim = keep && !keep.has(l.id);
    o.mat.transparent = dim;
    o.mat.opacity = dim ? 0.18 : 1;
    o.mat.depthWrite = !dim;
    o.ink.visible = !dim;
    o.mat.needsUpdate = true;
  }
}

// ---------------------------------------------------------------- camera moves

let flight = null;
// Spin the planet to bring `dir` under the camera, ending `h` above the ground.
function flyToDir(dir, h, ms = 1400) {
  const from = rig.position.clone().normalize();
  const turn = new THREE.Quaternion().setFromUnitVectors(from, dir.clone().normalize());
  flight = { from, turn, d0: rig.position.length(), d1: R + h, t0: performance.now(), ms: reduceMotion ? 1 : ms };
}
const flyTo = (x, z, h, ms) => flyToDir(dirOf(x, z), h, ms);
const _fq = new THREE.Quaternion();
function stepFlight(now) {
  if (!flight) return;
  const k = Math.min(1, (now - flight.t0) / flight.ms);
  const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  _fq.identity().slerp(flight.turn, e);
  rig.position.copy(flight.from).applyQuaternion(_fq).multiplyScalar(THREE.MathUtils.lerp(flight.d0, flight.d1, e));
  if (k >= 1) flight = null;
}
const height = () => rig.position.length() - R;

// Frame a set of nodes: aim at their middle on the sphere, back off to fit the widest.
function frameNodes(ids) {
  const mid = new THREE.Vector3();
  const dirs = ids.map((id) => dirOf(world.byId[id].x, world.byId[id].z));
  for (const d of dirs) mid.add(d);
  mid.normalize();
  const spread = Math.max(...dirs.map((d) => d.angleTo(mid))) * R;
  flyToDir(mid, THREE.MathUtils.clamp(spread * 2.2 / Math.min(1, camera.aspect), 45, R * 2.6));
}

function focusLayer(id) {
  for (const l of LAYERS) shown[l.id] = l.id === id;
  applyLayers();
  const ids = world.nodes.filter((n) => n.layers.includes(id)).map((n) => n.id);
  frameNodes(ids);
  showCaption(LAYER[id]);
}
function showAll() {
  for (const l of LAYERS) shown[l.id] = true;
  applyLayers();
  flyToDir(HOME.dir, HOME.dist - R);
  showCaption(null);
}

const TYPE_LABEL = {
  dc: 'Data center', pop: 'RLS ROADM site', hub: 'Metro hub', regional: 'Regional ring hut', ila: 'RLS amplifier hut',
  cls: 'Cable landing station', repeater: 'Undersea repeater', router: 'MPLS router',

function layerStats(id) {
  const ns = world.nodes.filter((n) => n.layers.includes(id));
  const ls = world.links.filter((l) => l.layer === id);
  const c = (t) => ns.filter((n) => n.type === t).length;
  switch (id) {
    case 'dci': return `${c('dc')} campuses on a metro ring`;
    case 'regional': return `3 rings · ${c('regional')} huts`;
    case 'backbone': return `${ns.filter((n) => n.id.startsWith('bb_')).length} ROADMs · ${c('ila')} amp huts`;
    case 'submarine': return `${ls.length} cables · ${c('repeater')} repeaters`;
    case 'mpls': return `${c('router')} routers · full mesh`;
    case 'access': return `${ns.filter((n) => n.id.startsWith('end_')).length} customers on rings`;
  }
  return '';
}

// Info card for the clicked thing.
const card = $('#card');
function select(id) {
  selected = id;
  ring.visible = !!id;
  emphasise();
  if (!id) { card.hidden = true; return; }
  const n = world.byId[id];
  const layer = LAYER[n.layers[0]];
  place(ring, n.x, nodeYs[id] + (n.type === 'router' ? -0.6 : 0.25), n.z);

const _lp = new THREE.Vector3(), _fv = new THREE.Vector3();
// On the side of the planet facing the camera (not over the horizon).
const facing = (p) => _fv.copy(camera.position).sub(p).dot(p) > 0;
function placeLabels() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const hh = height();
  for (const L of labels) {
    let vis = opts.labels && facing(L.pos);
    if (L.town) vis &&= hh < 150;
    if (L.tag) vis &&= hh < 140 && nodeObjs[L.node].visible;
    if (vis) {
      _lp.copy(L.pos).project(camera);
      vis = _lp.z < 1 && Math.abs(_lp.x) < 1.1 && Math.abs(_lp.y) < 1.1;
      if (vis) L.el.style.transform = `translate(${((_lp.x + 1) / 2) * w}px, ${((1 - _lp.y) / 2) * h}px) translate(-50%, -100%)`;

  }
}

// ---------------------------------------------------------------- picking

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function pick(ev) {
  const r = canvas.getBoundingClientRect();
  ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  for (const hit of ray.intersectObjects(pickables, true)) {
    let o = hit.object, ok = true;
    for (; o; o = o.parent) if (!o.visible) { ok = false; break; }
    if (ok && hit.object.userData.nodeId && facing(nodeObjs[hit.object.userData.nodeId].position)) return hit.object.userData.nodeId;
  }
  return null;
}
let hoverId = null, lastMove = null;
canvas.addEventListener('pointermove', (ev) => { lastMove = ev; });
canvas.addEventListener('pointerleave', () => { lastMove = null; hoverId = null; tip.hidden = true; canvas.style.cursor = ''; });
let down = null;
canvas.addEventListener('pointerdown', (ev) => { down = [ev.clientX, ev.clientY]; });
canvas.addEventListener('pointerup', (ev) => {
  if (!down || Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) > 5) return;
  const id = pick(ev);
  select(id);
  if (id) {
    const n = world.byId[id];
    if (height() > 140) flyTo(n.x, n.z, 110);
  }
});
function hover() {
  if (!lastMove || flight) return;
  const id = pick(lastMove);
  hoverId = id;
  canvas.style.cursor = id ? 'pointer' : '';
  tip.hidden = !id;
  if (id) {
    const n = world.byId[id];
    tip.style.setProperty('--c', LAYER[n.layers[0]].color);
    tip.innerHTML = `<b>${n.name}</b><span>${TYPE_LABEL[n.type]}</span>`;
    const r = canvas.getBoundingClientRect();
    tip.style.transform = `translate(${lastMove.clientX - r.left + 14}px, ${lastMove.clientY - r.top + 14}px)`;
  }
  lastMove = null;
}

// ---------------------------------------------------------------- tour

let tour = null;
function startTour() {
  tour = { i: 0, timer: null };
  $('#btn-tour').textContent = 'Stop tour';
  $('#btn-tour').setAttribute('aria-pressed', 'true');
  select(null);
  nextStop();
}
function nextStop() {
  if (!tour) return;
  if (tour.i >= LAYERS.length) { stopTour(); showAll(); return; }
  const l = LAYERS[tour.i];
  focusLayer(l.id);
  showCaption(l, `Stop ${tour.i + 1} of ${LAYERS.length}`);
  tour.i++;
  tour.timer = setTimeout(nextStop, 7000);
}
function stopTour() {
  if (!tour) return;
  clearTimeout(tour.timer);
  tour = null;
  $('#btn-tour').textContent = 'Take the tour';
  $('#btn-tour').setAttribute('aria-pressed', 'false');
}
$('#cap-next').addEventListener('click', () => {
  if (!tour) { const i = LAYERS.findIndex((l) => l.name === caption.querySelector('.cap-t').textContent); focusLayer(LAYERS[(i + 1) % LAYERS.length].id); return; }
  clearTimeout(tour.timer);
  nextStop();
});
addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { stopTour(); select(null); }
});

// ---------------------------------------------------------------- loop

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) {
    renderer.setSize(w, h, false);
    camera.aspect = rig.aspect = w / h;
    camera.updateProjectionMatrix();
    rig.updateProjectionMatrix();
  }
}

const clock = new THREE.Clock();
let t = 0;
function frame(now) {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (!reduceMotion) t += dt;
  resize();
  stepFlight(now);
  controls.update();
  aimCamera();
  for (const m of life.movers) m(t, reduceMotion ? 0 : dt);
  movePackets(t);
  for (const b of blinkers) b.visible = Math.sin(t * 4 + b.id) > -0.2;
  for (const p of puffs) p.position.y = 4.4 + p.userData.puff * 0.9 + ((t * 0.8 + p.userData.puff / 3) % 1) * 0.9;
  for (const id in linkObjs) if (linkObjs[id].mat.alphaMap) linkObjs[id].mat.alphaMap.offset.x = -t * 0.8;
  ringMesh.rotation.z = t;
  ringMesh.position.y = Math.sin(t * 3) * 0.3;
  hover();
  placeLabels();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
applyLayers();
requestAnimationFrame(frame);
window.netlandia = { world, select, focusLayer, showAll, flyTo, camera, controls };

</script>
