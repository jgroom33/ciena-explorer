// The 5G radio at a cell site or hub, split into its three parts (see CRAN and DRAN in
// world.js). Explorer calls them the radio, the signal computer and the organiser.
const andList = (xs) => (xs.length < 2 ? xs.join('') : `${xs.slice(0, -1).join(', ')} and ${xs[xs.length - 1]}`);
function ranLine(n, byId, plain, nameOf) {
  const r = n.ran;
  if (!r) return '';
  const at = (id) => (plain ? `the ${nameOf(byId[id])}` : nameOf(byId[id]));
  if (n.type === 'tower') {
    const own = r.du === n.id;
    if (plain) {
      return own
        ? `The radio and its signal computer are both here. The signal computer sends finished data along the loop to the organiser at ${at(r.cu)}.`
        : `Only the radio is here. Its raw signal rushes down the fibre to a signal computer at ${at(r.du)}, shared with other towers.`;
    }
    return own
      ? `D-RAN: RU and DU on site · midhaul (F1) to the CU at ${at(r.cu)}`
      : `C-RAN: RU only · eCPRI fronthaul to the DU pool at ${at(r.du)} · CU at ${at(r.cu)}`;
  }
  const pool = r.pool.map((id) => nameOf(byId[id]));
  const cu = r.cu.map((id) => {
    if (id === n.id) return plain ? 'its own signal computers' : 'its own DU pool';
    if (byId[id].type === 'xhub') return plain ? `the signal computers at ${at(id)}` : `the DU pool at ${at(id)}`;
    return nameOf(byId[id]);
  });
  if (plain) {
    return [
      pool.length && `Signal computers for ${andList(pool)}, which keep only their radios.`,
      cu.length && `The organiser for ${andList(cu)}: it keeps track of every phone and hands it from tower to tower.`,
    ].filter(Boolean).join(' ');
  }
  return [pool.length && `DU pool (C-RAN) for ${andList(pool)}`, cu.length && `CU for ${andList(cu)} · backhaul (N2/N3) to the 5G core`]
    .filter(Boolean).join(' · ');
}

    sideName: (s) => (plain ? SIDE_PLAIN[s].name : SIDES[s].name),

// ---------------------------------------------------------------- the rules

// Points for one answer: 100 if right, plus up to 50 for answering quickly.
function answerPoints(right, seconds) {
  if (!right) return 0;
  return 100 + Math.max(0, Math.round(50 * (1 - seconds / STORY_SECONDS)));
}
// A challenge won without a single mistake earns a bonus.
const FLAWLESS_BONUS = 200;

// Two ways to play. The full story plays every stop of every network (about an hour).
// The quick run, for a booth, plays one game per level, picked at random, in its short
// version, then a short quiz; each win brings back the level's networks together, and
// Lord Lag ends it with two rounds from the games just played (about ten minutes).
const STORY_MODES = ['quick', 'full'];
const QUICK_QUIZ = 2;
// a quick run's games: one from each level, at random
function quickPicks(random = Math.random) {
  return Object.fromEntries(STORY_LEVELS.filter((l) => !l.boss).map((l) => {
    const games = l.chapters.flatMap((id) => STORY[id].stages);
    return [l.n, games[Math.floor(random() * games.length)]];
  }));
}
function newStory(mode = 'full', random = Math.random) {
  // the score is two scores added up: knowledge (questions and exams) and games
  return { mode, picks: mode === 'quick' ? quickPicks(random) : {}, unlocked: [], stage: 0, final: false, score: 0, know: 0, play: 0, best: 0 };
}
const isQuick = (s) => s.mode === 'quick';
// the network that plays a game
const ownerOf = (gid) => STORY_ORDER.find((id) => STORY[id].stages.includes(gid)) ?? null;
// Saved progress, checked: anything unknown or out of order is dropped.
function loadStory(saved) {
  const s = newStory();
  if (!saved || typeof saved !== 'object') return s;
  if (saved.mode === 'quick') {
    s.mode = 'quick';
    // a pick has to be one of its own level's games, else a fresh one
    const fresh = quickPicks();
    for (const l of STORY_LEVELS.filter((x) => !x.boss)) {
      const p = saved.picks?.[l.n];
      s.picks[l.n] = l.chapters.some((id) => STORY[id].stages.includes(p)) ? p : fresh[l.n];
    }
  }
  for (const id of Array.isArray(saved.unlocked) ? saved.unlocked : []) {
    if (id === STORY_ORDER[s.unlocked.length]) s.unlocked.push(id); else break;
  }
  // a quick run brings a level back whole, so a level half won is not won at all
  if (isQuick(s)) s.unlocked = s.unlocked.filter((id) => levelOf(id).chapters.every((c) => s.unlocked.includes(c)));
  const next = nextChapter(s);
  s.stage = next && Number.isInteger(saved.stage) && saved.stage > 0 && saved.stage < stagesOf(s, next).length ? saved.stage : 0;
  s.final = saved.final === true && s.unlocked.length === STORY_ORDER.length;
  const pts = (x) => (Number.isFinite(x) && x > 0 ? Math.round(x) : 0);
  s.know = pts(saved.know);
  // a save from before the two scores counts all its points as games
  s.play = saved.play == null ? Math.max(0, pts(saved.score) - s.know) : pts(saved.play);
  s.score = s.know + s.play;
  s.best = Math.max(s.score, pts(saved.best));
  return s;
}
// the network to win back next; in a quick run, the one that plays its level's game
function nextChapter(s) {
  const id = STORY_ORDER[s.unlocked.length] ?? null;
  return id && isQuick(s) ? ownerOf(s.picks[levelOf(id).n]) : id;
}
// a network's stops: all of them, or in a quick run just its level's game
const stagesOf = (s, id) => (isQuick(s) ? [s.picks[levelOf(id).n]] : STORY[id].stages);
// the game to play next in the network being won back
const nextStage = (s) => { const id = nextChapter(s); return id ? stagesOf(s, id)[s.stage] : null; };
const isUnlocked = (s, id) => s.unlocked.includes(id);
// every network back, and Lord Lag still to beat
const bossNext = (s) => !nextChapter(s) && !s.final;
const rankOf = (s) => STORY_RANKS[Math.min(s.unlocked.length + (s.final ? 1 : 0), STORY_RANKS.length - 1)];
const storyDone = (s) => s.final;
const bankPoints = (s, play, know = 0) => {
  s.play += play; s.know += know; s.score = s.play + s.know;
  s.best = Math.max(s.best, s.score);
};
// A stop cleared that is not the network's last: on to its next game.
function winStage(s, id, points) {
  if (nextChapter(s) !== id || s.stage >= stagesOf(s, id).length - 1) return s;
  s.stage++;
  bankPoints(s, points);
  return s;
}
// One attempt at a chapter's questions (or a level's exam): answers shuffled,
// lives, and the points earned so far (which only count if it is won).
function startChallenge(id, random = Math.random, questions = STORY[id].questions) {
  return {
    id, questions, i: 0, lives: STORY_LIVES, points: 0, mistakes: 0, over: null,
    wrong: [],          // the questions missed, for the review at the end: { i, pick } (pick null: time ran out)
    order: questions.map(() => shuffle([0, 1, 2], random)),
  };
}
// Answer the current question with the answer at screen position `pick` (or null when
// the time ran out). Returns { right, points } and moves the challenge on.
function answer(c, pick, seconds) {
  if (c.over) return { right: false, points: 0 };
  const right = pick != null && c.order[c.i][pick] === 0;
  const points = answerPoints(right, seconds);
  c.points += points;
  if (!right) { c.mistakes++; c.lives--; c.wrong.push({ i: c.i, pick: pick == null ? null : c.order[c.i][pick] }); }
  if (c.lives <= 0) c.over = 'lost';
  else if (++c.i >= c.questions.length) {
    c.over = 'won';
    if (!c.mistakes) c.points += FLAWLESS_BONUS;
  }
  return { right, points };
}
// The network's last stop won (and its level's exam, if it closes one): it unlocks and
// the points join the score: the questions' to knowledge, the last game's (`play`) to games.
function winChapter(s, c, play = 0) {
  if (c.over !== 'won' || nextChapter(s) !== c.id) return s;
  // a quick run brings back the whole level at once
  if (isQuick(s)) s.unlocked.push(...levelOf(c.id).chapters.filter((id) => !s.unlocked.includes(id)));
  else s.unlocked.push(c.id);
  s.stage = 0;
  bankPoints(s, play, c.points);
  return s;
}
// Lord Lag beaten: the story is over.
function winFinal(s, points) {
  if (!bossNext(s)) return s;
  s.final = true;
  bankPoints(s, points);
  return s;
}
// Start the story again from the top, keeping the best score.
function restartStory(s, mode = s.mode, random = Math.random) {
  return Object.assign(s, { mode, picks: mode === 'quick' ? quickPicks(random) : {}, unlocked: [], stage: 0, final: false, score: 0, know: 0, play: 0 });
}
// the quiz that closes a level in a quick run: a couple of its exam's questions, at random
function quickQuiz(id, random = Math.random) {
  return shuffle([...examAt(levelOf(id).chapters.at(-1))], random).slice(0, QUICK_QUIZ);
}
// For testing (the ?dev menu): put the story just before a stop, every network before
// it already won. `id` null means just before the fight with Lord Lag.
function jumpTo(s, id, stage = 0) {
  const k = id ? STORY_ORDER.indexOf(id) : STORY_ORDER.length;
  if (k < 0) return s;
  // a jump is into the full story, where every stop has its place
  return Object.assign(s, { mode: 'full', picks: {}, unlocked: STORY_ORDER.slice(0, k), stage: id ? Math.max(0, Math.min(stage, STORY[id].stages.length - 1)) : 0, final: false });
}

function shuffle(a, random) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------------------------------------------------------------- the notebook
// What the player has learned and where they slipped, kept across restarts: every game
// and exam tried and how it went, every question ever missed (and whether it was got
// right later), and the networks won back, whose lessons it collects.
function newNotebook() {
  return { games: {}, exams: {}, misses: {}, won: [] };
}
// every question has a stable name, so a miss survives a reload: 'ipcore.2', 'extra.sea.0'
const QUESTION_KEYS = new Map([
  ...Object.entries(STORY).flatMap(([id, ch]) => ch.questions.map((q, k) => [q, `${id}.${k}`])),
  ...Object.entries(EXTRA_QUESTIONS).flatMap(([id, qs]) => qs.map((q, k) => [q, `extra.${id}.${k}`])),
]);
const QUESTIONS_BY_KEY = new Map([...QUESTION_KEYS].map(([q, k]) => [k, q]));
const questionKey = (q) => QUESTION_KEYS.get(q) ?? null;
const questionOf = (key) => QUESTIONS_BY_KEY.get(key) ?? null;
const tally = (x) => ({ tries: Math.max(0, Math.round(+x?.tries || 0)), wins: Math.max(0, Math.round(+x?.wins || 0)) });
// Saved notebook, checked: games, exams and questions that don't exist any more are dropped.
function loadNotebook(saved, gameIds = []) {
  const nb = newNotebook();
  if (!saved || typeof saved !== 'object') return nb;
  for (const [gid, x] of Object.entries(saved.games ?? {})) if (gameIds.includes(gid)) nb.games[gid] = tally(x);
  for (const [id, x] of Object.entries(saved.exams ?? {})) if (STORY[id]) nb.exams[id] = tally(x);
  for (const [key, x] of Object.entries(saved.misses ?? {})) {
    const q = questionOf(key);
    if (!q || !x) continue;
    const picks = (Array.isArray(x.picks) ? x.picks : []).filter((p) => p === null || [1, 2].includes(p));
    nb.misses[key] = { times: Math.max(1, Math.round(+x.times || 1)), picks: picks.slice(-3), fixed: x.fixed === true };
  }
  nb.won = STORY_ORDER.filter((id) => Array.isArray(saved.won) && saved.won.includes(id));
  return nb;
}
// a game played to the end (or given up): won or not
function noteGame(nb, gid, won) {
  const g = nb.games[gid] ??= { tries: 0, wins: 0 };
  g.tries++; if (won) g.wins++;
  return nb;
}
// a level's exam, named by the network it closes
function noteExam(nb, id, won) {
  const e = nb.exams[id] ??= { tries: 0, wins: 0 };
  e.tries++; if (won) e.wins++;
  return nb;
}
// one answer: a miss is kept with the answer picked (null: the time ran out); a miss
// answered right later is marked fixed, but stays in the notebook
function noteAnswer(nb, q, right, pick) {
  const key = questionKey(q);
  if (!key) return nb;
  const m = nb.misses[key];
  if (right) { if (m) m.fixed = true; return nb; }
  const x = nb.misses[key] ??= { times: 0, picks: [], fixed: false };
  x.times++; x.picks = [...x.picks, pick].slice(-3); x.fixed = false;
  return nb;
}
function noteChapter(nb, id) {
  if (STORY[id] && !nb.won.includes(id)) nb.won = STORY_ORDER.filter((x) => x === id || nb.won.includes(x));
  return nb;
}

// ---------------------------------------------------------------- the board
// The best runs played on this device, for a booth: a name, the score and its two
// halves, and the rank reached. Kept to the top ten.
const BOARD_SIZE = 10;
// a name as typed, kept short and plain: letters, digits, spaces and . ' -
const boardName = (s) => String(s ?? '').replace(/[^\p{L}\p{N} .'-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 12);
const byScore = (a, b) => b.score - a.score || a.at - b.at;
function loadBoard(saved) {
  if (!Array.isArray(saved)) return [];
  const pts = (x) => (Number.isFinite(x) && x > 0 ? Math.round(x) : 0);
  return saved
    .filter((e) => e && boardName(e.name) && pts(e.score) > 0)
    .map((e) => ({ name: boardName(e.name), score: pts(e.score), know: pts(e.know), play: pts(e.play), rank: STORY_RANKS.includes(e.rank) ? e.rank : STORY_RANKS[0], at: pts(e.at) }))
    .sort(byScore).slice(0, BOARD_SIZE);
}
// Put a run on the board: returns its place (0 is the top), or -1 when it doesn't make
// the top ten (or has no name or no points).
function addToBoard(board, name, s, at = Date.now()) {
  const n = boardName(name);
  if (!n || !(s.score > 0)) return -1;
  const e = { name: n, score: s.score, know: s.know, play: s.play, rank: rankOf(s), at };
  board.push(e);
  board.sort(byScore);
  board.length = Math.min(board.length, BOARD_SIZE);
  return board.indexOf(e);
}

// Netlandia Quest's mini-games, played on a 2D canvas inside the challenge card. Each
// game is a small simulation (start, tick, press, result) with no page in it, so the
// tests can play it, plus a draw() for the canvas. js/game.js runs them; a chapter
// with no game here falls back to its three questions.
//
// Lanes are what the player taps: a row (Keep the Beat) or a column (Packet Tetris),
// by touch, click or the keys 1, 2 and 3.

const clamp01 = (x) => Math.max(0, Math.min(1, x));
// floating words over the board: "Perfect!", "Call dropped!"
const float = (s, lane, text, good) => s.fx.push({ lane, text, good, t: 0 });

// ---------------------------------------------------------------- Keep the Beat (5G xhaul)
// Timing packets run from the hub to three cell towers. Tap a tower's lane as its
// packet reaches the tower; a miss lets the tower drift out of sync. From a few seconds
// in, the Jitterbugs ride the packets and make them speed up and slow down.
const BEAT = {
  lanes: 3, seconds: 30, zone: [0.8, 1.02], perfect: 0.03, center: 0.91, bugsAt: 10,
};
const KeepTheBeat = {
  id: 'beat',
  name: { plain: 'Keep the Beat', eng: 'Keep the Beat' },
  how: {
    plain: 'Clock messages race to three phone towers. Tap a tower\'s lane (or press 1, 2, 3) just as its clock reaches the tower. Miss and the tower drifts out of time. Watch out for the Jitterbugs!',
    eng: 'PTP timing packets run from the hub to three cell sites. Tap the lane (or 1, 2, 3) as each packet hits its site. A miss costs phase sync; the Jitterbugs add delay variation from a few seconds in.',
  },
  goal: { plain: `Keep the towers in time for ${BEAT.seconds} seconds`, eng: `Hold phase sync for ${BEAT.seconds} s` },
  laneNames: { plain: ['Tower 1', 'Tower 2', 'Tower 3'], eng: ['Cell site 1', 'Cell site 2', 'Cell site 3'] },
  start(random = Math.random, opts = {}) {
    return { len: opts.seconds ?? BEAT.seconds, t: 0, random, packets: [], next: 0.6, sync: 100, score: 0, combo: 0, best: 0, hits: 0, perfects: 0, misses: 0, bugged: 0, fx: [], over: null, bugs: false };
  },
  tick(s, dt) {
    if (s.over) return;
    s.t += dt;
    const k = Math.min(1, s.t / s.len);
    if (!s.bugs && s.t > BEAT.bugsAt) { s.bugs = true; float(s, 1, '🐞 Jitterbugs!', false); }
    // a packet on the beat, coming faster as the song goes on
    if ((s.next -= dt) <= 0) {
      const lane = Math.floor(s.random() * BEAT.lanes);
      s.packets.push({ lane, x: 0, v: 0.26 + 0.12 * k, phase: s.random() * 6.3, bug: s.bugs && s.random() < 0.4 });
      s.next = 1.6 - 0.5 * k;
    }
    for (const p of s.packets) {
      // a Jitterbug makes its packet surge and stall, but never go backwards
      const wobble = p.bug ? 0.4 * p.v * Math.sin(s.t * 4 + p.phase) : 0;
      p.x += (p.v + wobble) * dt;
    }
    for (const p of s.packets.filter((q) => q.x > 1.04)) {
      s.packets.splice(s.packets.indexOf(p), 1);
      s.misses++; s.combo = 0; s.sync -= 14;
      float(s, p.lane, 'Drifted!', false);
    }
    for (const f of s.fx) f.t += dt;
    s.fx = s.fx.filter((f) => f.t < 1);
    if (s.sync <= 0) { s.sync = 0; s.over = 'lost'; } else if (s.t >= s.len) s.over = 'won';
  },
  press(s, lane) {
    if (s.over) return;
    const inZone = s.packets.filter((p) => p.lane === lane && p.x >= BEAT.zone[0] - 0.04 && p.x <= BEAT.zone[1] + 0.04);
    if (!inZone.length) { s.sync -= 3; s.combo = 0; float(s, lane, 'Off beat', false); return; }
    const p = inZone.sort((a, b) => b.x - a.x)[0];
    s.packets.splice(s.packets.indexOf(p), 1);
    const perfect = Math.abs(p.x - BEAT.center) <= BEAT.perfect + 0.02;
    s.combo++; s.hits++; s.best = Math.max(s.best, s.combo);
    if (perfect) s.perfects++;
    if (p.bug) s.bugged++;
    s.score += Math.round((perfect ? 30 : 15) * (1 + Math.min(s.combo, 10) / 10));
    s.sync = Math.min(100, s.sync + 5);
    float(s, lane, perfect ? 'Perfect!' : 'In sync', true);
  },
  result(s) {
    if (!s.over) return null;
    return { won: s.over === 'won', points: s.over === 'won' ? s.score + s.sync * 2 : 0, flawless: s.misses === 0 };
  },
  summary(s, words) {
    return words === 'plain'
      ? `You caught ${s.hits} of ${s.hits + s.misses} clock messages, ${s.perfects} of them dead on time, with a longest streak of ${s.best}. ${s.bugged} had a Jitterbug riding them and still got there on the beat. The towers ended ${Math.round(s.sync)}% in step.`
      : `${s.hits}/${s.hits + s.misses} PTP packets delivered in the window (${s.perfects} centred, best run ${s.best}); ${s.bugged} survived Jitterbug delay variation. Final phase sync ${Math.round(s.sync)}%.`;
  },
  draw(g, s, w, h, words, theme) {
    g.clearRect(0, 0, w, h);
    const top = 34, rowH = (h - top - 8) / BEAT.lanes, x0 = 64, x1 = w - 54;
    hud(g, w, theme, `${words === 'plain' ? 'Time in step' : 'Phase sync'}`, s.sync / 100, s.score, Math.max(0, s.len - s.t));
    // the hub on the left
    g.fillStyle = theme.well; roundRect(g, 8, top + 6, 44, h - top - 20, 8); g.fill();
    g.fillStyle = theme.ink; g.font = `700 11px ${theme.font}`; g.textAlign = 'center';
    g.fillText(words === 'plain' ? 'Hub' : 'DU/CU', 30, top + 22);
    for (let i = 0; i < BEAT.lanes; i++) {
      const y = top + rowH * (i + 0.5);
      // the fibre to the tower, the beat zone and the tower itself
      g.strokeStyle = theme.muted; g.lineWidth = 3; g.setLineDash([]);
      g.beginPath(); g.moveTo(52, y); g.lineTo(x1, y); g.stroke();
      const zx = x0 + (x1 - x0) * BEAT.zone[0], zw = (x1 - x0) * (BEAT.zone[1] - BEAT.zone[0]);
      g.fillStyle = theme.accentSoft; roundRect(g, zx, y - rowH * 0.32, zw, rowH * 0.64, 8); g.fill();
      g.strokeStyle = theme.accent; g.lineWidth = 2; g.beginPath(); g.moveTo(x0 + (x1 - x0) * BEAT.center, y - rowH * 0.32); g.lineTo(x0 + (x1 - x0) * BEAT.center, y + rowH * 0.32); g.stroke();
      emoji(g, '📡', x1 + 26, y, Math.min(30, rowH * 0.6));
      g.fillStyle = theme.muted; g.font = `700 11px ${theme.font}`; g.textAlign = 'left';
      g.fillText(`${i + 1} · ${KeepTheBeat.laneNames[words][i]}`, x0, y - rowH * 0.36);
    }
    for (const p of s.packets) {
      const y = top + rowH * (p.lane + 0.5), x = x0 + (x1 - x0) * clamp01(p.x);
      g.fillStyle = theme.gold; g.beginPath(); g.arc(x, y, Math.min(15, rowH * 0.28), 0, 7); g.fill();
      g.strokeStyle = theme.ink; g.lineWidth = 2; g.stroke();
      emoji(g, '⏱', x, y + 1, Math.min(16, rowH * 0.3));
      if (p.bug) emoji(g, '🐞', x + 12, y - 14, Math.min(18, rowH * 0.32));
    }
    floats(g, s, (lane) => [x1 - 40, top + rowH * (lane + 0.5) - rowH * 0.2], theme);
  },
  laneAt(x, y, w, h) {
    const top = 34;
    return y < top ? null : Math.min(BEAT.lanes - 1, Math.floor(((y - top) / (h - top - 8)) * BEAT.lanes));
  },
};

const PacketTetris = {

  how: {

  goal: { plain: `Sort ${SORT.goal} packets without losing three calls`, eng: `Queue ${SORT.goal} packets, three strikes and you're out` },

  start(random = Math.random, opts = {}) {

    q.items.push({ kind: f.kind, size: k.size, left: k.size });

      s.right++;

  },
  result(s) {

  },
  summary(s, words) {
    return words === 'plain'
      ? `You sorted ${s.sorted} packets, ${s.right} of them into exactly the right lane. ${s.calls} calls and clocks rode the fast lane, ${s.parked} giant backup${s.parked === 1 ? '' : 's'} waited politely in "everything else", and ${s.dropped ? `${s.dropped} call${s.dropped === 1 ? ' was' : 's were'} dropped` : 'not a single call was dropped'}.`

    }

    g.fillStyle = theme.muted; g.font = `700 11px ${theme.font}`; g.textAlign = 'center';
    g.fillText(words === 'plain' ? '↓ road to the main routers · the fast lane goes first' : '↓ uplink to the core · strict priority: EF, then AF, then BE', w / 2, h - 8);

      g.strokeStyle = theme.ink; g.lineWidth = 2; g.stroke();
      g.fillStyle = theme.paper; roundRect(g, w / 2 - bw / 2 + 6, y - size / 2 + 2, size - 4, size - 4, 8); g.fill();

      g.fillStyle = '#ffffff'; g.font = `800 14px ${theme.font}`; g.textAlign = 'left';
      g.fillText(k[words], w / 2 - bw / 2 + size + 10, y + 5);

  laneAt(x, y, w) { return Math.min(2, Math.floor((x / w) * 3)); },

}

// ---------------------------------------------------------------- Packet Race (IP/MPLS core)
// Your video packet races Lord Lag's from Gateway Bay to Edgewater, three times. At each
// router you pick the next hop; elephants jam different links each race, so read the
// map before you go. Lord Lag always takes the shortest way (the IGP path). In the last
// race a fibre is cut in front of you, and you have to find another way round.
const RACE = { races: 3, need: 2, speed: 0.42, reconverge: 1.5, think: 0.15, lag: 1.15 };
const RNODES = {
  gw: { x: 0.08, y: 0.55, plain: 'Gateway Bay', sid: 16001 },
  c1: { x: 0.36, y: 0.78, plain: 'Coreburg 1', sid: 16002 },
  c2: { x: 0.64, y: 0.78, plain: 'Coreburg 2', sid: 16003 },
  np: { x: 0.5, y: 0.2, plain: 'Northport', sid: 16004 },
  ed: { x: 0.92, y: 0.55, plain: 'Edgewater', sid: 16005 },

const RLINKS = [['gw', 'c1'], ['c1', 'c2'], ['c2', 'ed'], ['gw', 'np'], ['np', 'ed'], ['c1', 'np'], ['np', 'c2']];
const rkey = (a, b) => (a < b ? `${a}-${b}` : `${b}-${a}`);

// the morning's jams, one per race: where the elephants sit
const JAMS = [
  { 'c1-c2': 0.95 },                               // the backups fill the Coreburg pair: go round by Northport
  { 'c2-ed': 0.95, 'gw-np': 0.9 },                 // now both obvious ways are jammed: Coreburg 1, then up to Northport

];
function raceNeighbours(s, n) {
  return RLINKS.filter(([a, b]) => (a === n || b === n) && !s.cut.has(rkey(a, b))).map(([a, b]) => (a === n ? b : a));

  while (todo.size) {
    let u = null;
    for (const n of todo) if (dist[n] != null && (u == null || dist[n] < dist[u])) u = n;
    if (u == null) break;
    todo.delete(u);

const PacketRace = {
  id: 'race',
  name: { plain: 'Packet Race', eng: 'Packet Race' },
  how: {
    plain: 'Your video call races Lord Lag\'s packet from Gateway Bay to Edgewater. At each router, tap where to go next (or press 1, 2, 3); the race slows right down while you choose. Elephants 🐘 jam different roads each race, so look before you go. Lord Lag\'s packet is a little faster than yours, and always takes the shortest road. Win two of the three races!',
    eng: 'Your EF video packet races Lord Lag\'s from the Gateway Bay PE to Edgewater. At each node pick the next segment (1, 2, 3): you are the SR-TE head end. Elephant flows load different links each race; Lord Lag follows the IGP shortest path, a little faster than you. In race 3 a link fails: reroute. Win two of three.',
  },
  goal: { plain: 'Three races: beat Lord Lag in at least two', eng: 'Three races to Edgewater: win at least two' },
  laneNames: { plain: ['—', '—', '—'], eng: ['—', '—', '—'] },
  start(random = Math.random, opts = {}) {
    const first = opts.first ?? 0, races = opts.races ?? RACE.races;

  },
  // the choices at the router your packet is waiting at
  options(s) {

  // seconds to Edgewater going first to `n`, with the elephants where they are

  tick(s, dt) {
    if (s.over) return;

    // the game is about reading the map, not about quick fingers

      const ahead = s.you.to ?? s.you.at;
      const victim = RLINKS.map(([a, b]) => rkey(a, b)).find((k) => k.includes(ahead) && k.includes('ed')) ?? 'c2-ed';

      if (s.lag.to && rkey(s.lag.at, s.lag.to) === victim) { s.lag.to = null; s.lag.p = 0; }

      const onHisWay = [s.lag.at, ...s.lagPath].some((n, i, a) => i && rkey(a[i - 1], n) === victim);

      s.lag.to = s.lagPath[0] ?? null;
    }
    raceMove(s, s.you, dt);
    raceMove(s, s.lag, dt);

    if (s.you.done) {
      s.margins.push(raceLead(s)); s.wins++;
      if (!s.hitJam) s.dodged++;
      float(s, 1, 'You beat Lord Lag!', true);

  },
  press(s, lane) {

  result(s) {

      g.font = `800 12px ${theme.font}`; const tw = g.measureText(lbl).width;

// ---------------------------------------------------------------- Repeater Rescue (submarine)
// Light crosses the ocean through repeaters on the seabed. One at a time they start to
// lose power and blink red: tap them before they go dark. Then the Anchor Dragger cuts the
// North cable, and the island's traffic has to move to the South cable while the repair
// ship sails out, with the South cable's repeaters to look after in turn.
const REP = { power: 22, decide: 14, ship: 14, drain: 0.16, every: 2.6, perCable: 6, lives: 3 };
// two cables to the island, named on the board so the choice after the cut is clear
const REP_CABLES = [
  { from: 'Gateway Bay', to: 'Coherent Isle West', y: 0.3, name: { plain: 'North cable', eng: 'North system' } },
  { from: 'Lightmoor', to: 'Coherent Isle South', y: 0.74, name: { plain: 'South cable', eng: 'South system' } },
];
const REP_CHOICES = [
  { key: 'move', right: true, plain: 'Move it to the South cable', eng: 'Restore onto the South system' },
  { key: 'wait', plain: 'Wait for the repair ship', eng: 'Wait for the cable ship' },
  { key: 'boost', plain: 'Turn the light up', eng: 'Raise launch power' },
];
const repThird = (r) => Math.min(2, Math.floor((r.i * 3) / REP.perCable));

  { key: 'detective', icon: '🔍', cost: 4, range: 0.42, reload: 1.0, hits: ['bot', 'mask', 'flood'], plain: 'Detective', eng: 'Deep inspection' },

  mask: { icon: '🥸', speed: 0.12, foe: true },
  flood: { icon: '🌊', speed: 0.22, foe: true, small: true },
  good: { icon: '📦', speed: 0.2, foe: false },

const FWD_WAVES = [
  { mix: { bot: 6, good: 6 }, plain: 'Wave 1: bots! Build 🧱 guards by the road.', eng: 'Wave 1: known-bad sources. Deploy 🧱 ACL rules along the path.' },
  { mix: { bot: 5, mask: 3, good: 6 }, plain: 'Wave 2: some bots wear a disguise 🥸. Only a 🔍 detective can spot them.', eng: 'Wave 2: payloads disguised as normal traffic 🥸. Only 🔍 deep inspection catches them.' },
  { mix: { flood: 4, bot: 3, good: 6 }, plain: 'Wave 3: a flood 🌊! Too many at once for one guard: add more, or a ⏱ speed bump.', eng: 'Wave 3: a flood 🌊. One filter saturates: add capacity, or ⏱ rate-limit it.' },
  { mix: { bot: 4, mask: 3, flood: 2, good: 6 }, plain: 'Wave 4: everything at once. Hold the gate!', eng: 'Wave 4: mixed attack. Defence in depth.' },

const GuardTheGate = {

    eng: 'Bots are routed toward the data center mixed with legitimate traffic 📦. Tap a free slot by the path, then deploy: 1 🧱 an ACL rule (drops known-bad traffic, fast), 2 🔍 deep inspection (also catches disguised payloads, slower), 3 ⏱ a rate limiter (slows all traffic in range). Tap a deployed control to replace it (half refund). Legitimate packets always pass and earn a credit 🪙; so does each drop.',
  },
  goal: { plain: 'Keep the bots out for four waves', eng: 'Hold the perimeter through four waves' },
  laneNames: { plain: FWD_TOWERS.map((x) => `${x.icon} ${x.plain}`), eng: FWD_TOWERS.map((x) => `${x.icon} ${x.eng}`) },
  start(random = Math.random, opts = {}) {

  },
  tick(s, dt) {

// ---------------------------------------------------------------- Robot Dive (undersea cables)
// The anchor cut a cable somewhere along the seabed, in the dark. A ping sends a flash
// of light down the fibre from the shore; its echo comes back from the cut and marks
// roughly where it is, more closely with every ping (that is what an OTDR does). Drive
// the robot there by its headlamp, dodging the glowing jellyfish, before its battery
// runs out. Three cuts to find.
const DIVE = { rounds: 3, lives: 3, battery: 26, speed: 0.12, ping: 2, echo: 1.2, hit: 5, see: 0.09, found: 0.025, check: 0.5, bands: [0.12, 0.05, 0.015], robotY: 0.6 };
const RobotDive = {
  id: 'dive',
  name: { plain: 'Robot Dive', eng: 'Robot Dive' },
  how: {
    plain: 'Somewhere along the sea floor the cable is cut, buried in the sand where nobody can see it. Press 2 📡 to send a flash of light down the cable: its echo bounces back from the cut and marks 📍 about where it is, closer with every flash. Drive the robot there with ◀ ▶ (press again to stop) or tap where it should go, and stop on the spot: the robot checks the cable under it. Dodge the jellyfish 🪼: they drain the battery. Find three cuts!',
    eng: 'A fibre break lies somewhere along a buried seabed cable. Press 2 📡 to fire an OTDR pulse from the landing station: the reflection from the break gives its distance 📍, more precisely with each shot. Drive the ROV there with ◀ ▶ (press again to stop) or tap a position, and hold station to inspect the cable below. Avoid the jellyfish 🪼: each hit drains the battery. Locate three faults.',
  },
  goal: { plain: 'Find all three cuts before the battery runs out', eng: 'Locate three faults within battery' },
  laneNames: { plain: ['◀ Left', '📡 Ping', 'Right ▶'], eng: ['◀ Back', '📡 OTDR', 'Ahead ▶'] },
  start(random = Math.random, opts = {}) {
    const s = { t: 0, random, rounds: opts.rounds ?? DIVE.rounds, round: 0, lives: DIVE.lives, found: 0, hits: 0, pings: 0, score: 0, fx: [], over: null };
    RobotDive.newRound(s);
    return s;
  },
  newRound(s) {
    const r = s.random;
    s.x = 0.04; s.dir = 0; s.goto = null; s.battery = DIVE.battery; s.cut = 0.32 + r() * 0.6;
    s.pulse = null; s.mark = null; s.roundPings = 0; s.shield = 0; s.between = 0; s.dwell = 0; s.checking = 0;
    s.jellies = Array.from({ length: 3 + s.round }, (_, i) => ({ x: 0.2 + (0.72 * (i + r() * 0.6)) / (3 + s.round), ph: r() * 6.28, w: 0.9 + r() * 0.6 }));
  },
  jellyY: (j, t) => 0.42 + 0.3 * Math.sin(j.ph + t * j.w),
  tick(s, dt) {
    if (s.over) return;
    s.t += dt;
    for (const f of s.fx) f.t += dt;
    s.fx = s.fx.filter((f) => f.t < 1.4);
    if (s.between > 0) { if ((s.between -= dt) <= 0) RobotDive.newRound(s); return; }
    s.battery -= dt; s.shield = Math.max(0, s.shield - dt);
    // the robot drives toward a tapped spot, or keeps going the way it was sent
    if (s.goto != null) {
      const d = s.goto - s.x;
      if (Math.abs(d) < 0.006) { s.goto = null; s.dir = 0; } else s.dir = Math.sign(d);
    }
    s.x = clamp01(s.x + s.dir * DIVE.speed * dt);
    if (s.x <= 0 || s.x >= 1) { s.dir = 0; s.goto = null; }
    // a ping's flash runs down the cable to the cut and back
    if (s.pulse) {
      s.pulse.t += dt;
      if (s.pulse.t >= DIVE.echo) {
        const band = DIVE.bands[Math.min(DIVE.bands.length - 1, s.roundPings - 1)];
        s.mark = { x: clamp01(s.cut + (s.random() - 0.5) * band), band };
        s.pulse = null;
      }
    }
    // jellyfish
    if (!s.shield) for (const j of s.jellies) {
      if (Math.abs(j.x - s.x) < 0.045 && Math.abs(RobotDive.jellyY(j, s.t) - DIVE.robotY) < 0.07) {
        s.battery -= DIVE.hit; s.hits++; s.shield = 1.5; float(s, 1, 'Ouch! 🪼 −battery', false);
        break;
      }
    }
    // the cable is buried: the robot checks the spot it stops on, and there it is, or not
    if (s.dir === 0 && s.goto == null) s.dwell += dt; else s.dwell = 0;
    s.checking = s.dwell > 0.05 ? Math.min(1, s.dwell / DIVE.check) : 0;
    if (s.dwell >= DIVE.check && s.dwell - dt < DIVE.check && Math.abs(s.x - s.cut) >= DIVE.found) float(s, 1, 'Nothing here…', false);
    if (s.dwell >= DIVE.check && Math.abs(s.x - s.cut) < DIVE.found) {
      s.found++; const pts = 100 + Math.round(Math.max(0, s.battery) * 5); s.score += pts;
      float(s, 1, `Found it! +${pts}`, true);
      s.dir = 0; s.goto = null; s.dwell = 0;
      if (s.found >= s.rounds) { s.over = 'won'; return; }
      s.round++; s.between = 1.6; s.why = 'found';
      return;
    }
    if (s.battery <= 0) {
      s.lives--; float(s, 1, 'Battery flat! The robot is hauled up', false);
      if (s.lives <= 0) { s.over = 'lost'; return; }
      s.between = 1.6; s.why = 'flat';
    }
  },
  press(s, lane) {
    if (s.over || s.between > 0) return;
    if (lane >= 10) { s.goto = clamp01((lane - 10) / 100); return; }
    if (lane === 1) {
      if (s.pulse) return;
      s.pulse = { t: 0 }; s.pings++; s.roundPings++; s.battery -= DIVE.ping;
      return;
    }
    const d = lane === 0 ? -1 : 1;
    s.goto = null;
    s.dir = s.dir === d ? 0 : d;
  },
  lanes(s, words) {
    const names = RobotDive.laneNames[words];
    return [s.dir === -1 ? '■ Stop' : names[0], s.pulse ? '📡 …' : names[1], s.dir === 1 ? '■ Stop' : names[2]];
  },
  result(s) {
    if (!s.over) return null;
    return { won: s.over === 'won', points: s.over === 'won' ? s.score + s.lives * 50 : 0, flawless: s.hits === 0 && s.lives === DIVE.lives };
  },
  summary(s, words) {
    return words === 'plain'
      ? `You found ${s.found} cut${s.found === 1 ? '' : 's'} on the sea floor with ${s.pings} flash${s.pings === 1 ? '' : 'es'} of light${s.hits ? `, and bumped into ${s.hits} jellyfish on the way` : ', and never touched a jellyfish'}.`
      : `${s.found} faults located with ${s.pings} OTDR shot${s.pings === 1 ? '' : 's'}; ${s.hits} ROV collision${s.hits === 1 ? '' : 's'}, ${DIVE.lives - s.lives} recover${DIVE.lives - s.lives === 1 ? 'y' : 'ies'}.`;
  },
  box: (w, h) => ({ x: 14, y: 34, w: w - 28, h: h - 42 }),
  draw(g, s, w, h, words, theme) {
    g.clearRect(0, 0, w, h);
    const plain = words === 'plain', b = RobotDive.box(w, h), X = (x) => b.x + 24 + (b.w - 48) * x, Y = (y) => b.y + b.h * y;
    hud(g, w, theme, `${plain ? 'Cut' : 'Fault'} ${Math.min(s.found + 1, s.rounds)} / ${s.rounds} · ${'♥'.repeat(Math.max(0, s.lives))}${'♡'.repeat(DIVE.lives - Math.max(0, s.lives))} · 🔋`, clamp01(s.battery / DIVE.battery), s.score, null);
    // the deep sea, the seabed and the cable along it
    const sea = g.createLinearGradient(0, b.y, 0, b.y + b.h);
    sea.addColorStop(0, '#1b6fa8'); sea.addColorStop(1, '#06233a');
    g.fillStyle = sea; roundRect(g, b.x, b.y, b.w, b.h, 10); g.fill();
    g.fillStyle = '#c9a66b'; g.fillRect(b.x, Y(0.9), b.w, b.h * 0.1);
    const cy = Y(0.86);
    g.strokeStyle = '#ffc43d'; g.lineWidth = 4;
    g.beginPath(); g.moveTo(X(0) - 20, cy); g.lineTo(X(s.cut) - 3, cy); g.moveTo(X(s.cut) + 3, cy); g.lineTo(X(1) + 20, cy); g.stroke();
    const rx = X(s.x), ry = Y(DIVE.robotY);
    // the dark: all but the headlamp's pool of light
    const light = (b.w - 48) * DIVE.see * 1.6, lx = rx, ly = (ry + cy) / 2;
    g.save(); roundRect(g, b.x, b.y, b.w, b.h, 10); g.moveTo(lx + light, ly); g.arc(lx, ly, light, 0, Math.PI * 2, true);
    g.fillStyle = 'rgba(2, 12, 24, 0.88)'; g.fill('evenodd'); g.restore();
    // the ship up top, and the robot's tether down to it
    emoji(g, '🚢', X(0.02), b.y + 16, 22);
    g.strokeStyle = 'rgba(255,255,255,0.45)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(X(0.02), b.y + 26); g.quadraticCurveTo((X(0.02) + rx) / 2, ry, rx, ry); g.stroke();
    const glow = g.createRadialGradient(lx, ly, 0, lx, ly, light);
    glow.addColorStop(0, 'rgba(255,240,180,0.22)'); glow.addColorStop(1, 'rgba(255,240,180,0)');
    g.fillStyle = glow; g.beginPath(); g.arc(lx, ly, light, 0, Math.PI * 2); g.fill();
    // the cable is faintly seen all the way, so you know where to look
    g.strokeStyle = 'rgba(255,196,61,0.25)'; g.lineWidth = 2; g.beginPath(); g.moveTo(X(0), cy); g.lineTo(X(1), cy); g.stroke();
    // the robot checking the spot under it: a ring that fills
    if (s.checking) { g.strokeStyle = '#7dffb0'; g.lineWidth = 3; g.beginPath(); g.arc(X(s.x), cy, 12, -Math.PI / 2, -Math.PI / 2 + 6.283 * s.checking); g.stroke(); }
    if (s.why === 'found' && s.between > 0) emoji(g, '✂', X(s.cut), cy - 14, 18);
    // the ping's flash running along it, and where its echo says the cut is
    if (s.pulse) {
      const k = s.pulse.t / DIVE.echo, at = k < 0.5 ? s.cut * k * 2 : s.cut * (2 - k * 2);
      g.fillStyle = '#ffffff'; g.shadowColor = '#ffffff'; g.shadowBlur = 16; g.beginPath(); g.arc(X(at), cy, 5, 0, 7); g.fill(); g.shadowBlur = 0;
    }
    if (s.mark) {
      // the echo's guess: a pin, and a bracket on the cable for how sure it is
      const x0 = X(s.mark.x - s.mark.band / 2), x1 = X(s.mark.x + s.mark.band / 2);
      g.strokeStyle = '#ffc43d'; g.lineWidth = 3;
      g.beginPath(); g.moveTo(x0, cy - 9); g.lineTo(x0, cy + 9); g.moveTo(x1, cy - 9); g.lineTo(x1, cy + 9); g.moveTo(x0, cy + 9); g.lineTo(x1, cy + 9); g.stroke();
      emoji(g, '📍', X(s.mark.x), cy - 20, 20);
    }
    // the jellyfish glow in the dark
    for (const j of s.jellies) {
      const jx = X(j.x), jy = Y(RobotDive.jellyY(j, s.t));
      const halo = g.createRadialGradient(jx, jy, 0, jx, jy, 22);
      halo.addColorStop(0, 'rgba(255,140,220,0.45)'); halo.addColorStop(1, 'rgba(255,140,220,0)');
      g.fillStyle = halo; g.beginPath(); g.arc(jx, jy, 22, 0, Math.PI * 2); g.fill();
      emoji(g, '🪼', jx, jy, 22);
    }
    // the robot: a little yellow submarine with a lamp
    g.globalAlpha = s.shield ? 0.5 + 0.5 * Math.sin(s.t * 30) : 1;
    g.fillStyle = '#ffc43d'; roundRect(g, rx - 16, ry - 10, 32, 20, 9); g.fill();
    g.strokeStyle = '#1d2a44'; g.lineWidth = 2; g.stroke();
    g.fillStyle = '#9fd8ff'; g.beginPath(); g.arc(rx + (s.dir < 0 ? -6 : 6), ry - 1, 5, 0, 7); g.fill(); g.stroke();
    g.fillStyle = '#1d2a44'; g.fillRect(rx + (s.dir < 0 ? 15 : -21), ry - 5, 6, 10);
    g.globalAlpha = 1;
    // the shore and the island at either end
    g.fillStyle = 'rgba(255,255,255,0.75)'; g.font = `800 10px ${theme.font}`; g.textAlign = 'left';
    g.fillText(plain ? 'Shore' : 'Landing station', b.x + 6, b.y + b.h - 4);
    g.textAlign = 'right'; g.fillText(plain ? 'Island' : 'Coherent Isle', b.x + b.w - 6, b.y + b.h - 4);
    if (s.between > 0 && s.over == null) { g.fillStyle = '#ffffff'; g.font = `800 15px ${theme.font}`; g.textAlign = 'center'; g.fillText(s.why === 'found' ? (plain ? 'Next cut…' : 'Next fault…') : (plain ? 'New robot coming down…' : 'Relaunching the ROV…'), w / 2, Y(0.3)); }
    floats(g, s, () => [w / 2, Y(0.2)], { ...theme, good: '#7dffb0', bad: '#ff8a94' });
  },
  laneAt(x, y, w, h, s) {
    // a tap in the water sends the robot to that spot
    const b = RobotDive.box(w, h);
    if (y < b.y || !s) return null;
    return 10 + Math.round(clamp01((x - b.x - 24) / (b.w - 48)) * 100);
  },
};

// ---------------------------------------------------------------- Fiber Splice (undersea cables)
// On the repair ship, the two ends of each broken fibre meet in the splicer. The swell
// rocks the ship and the right-hand end drifts; nudge it up or down until its core lines
// up with the left one, then fire the arc. The better the cores line up, the less light
// the splice loses; a splice too far off leaks so much it must be redone. Six fibres,
// before the storm arrives, and the losses add up to a budget the link can afford.
const SPLICE = { fibres: 6, lives: 3, time: 80, nudge: 0.16, budget: 1.0, perfect: 0.15, good: 0.35, ok: 0.65, swell: [0.35, 1.0], arc: 1.2 };
const spliceLoss = (o) => 0.02 + 0.5 * o * o;
const FiberSplice = {
  id: 'splice',
  name: { plain: 'Fiber Splice', eng: 'Fusion Splice' },
  how: {
    plain: 'The cable is up on the ship, and each fibre in it must be joined again. The two glowing cores must line up before you melt them together, but the waves keep rocking the right one. Press 1 ▲ or 3 ▼ (or tap above or below) to nudge it, and 2 ⚡ (or tap the middle) to join them when the cores line up. The straighter the join, the less light it loses. Six fibres before the storm!',
    eng: 'Fusion-splice the six fibres of the recovered cable. Swell moves the right fibre: nudge it with 1 ▲ / 3 ▼ (or tap above or below the joint) until the cores align, then 2 ⚡ (or tap the joint) to fire the arc. Core offset becomes splice loss; a splice over tolerance must be remade, and the total must fit the loss budget.',
  },
  goal: { plain: 'Join six fibres before the storm, without losing too much light', eng: 'Six splices within the weather window and the loss budget' },
  laneNames: { plain: ['▲ Up', '⚡ Join', '▼ Down'], eng: ['▲ Up', '⚡ Arc', '▼ Down'] },
  start(random = Math.random, opts = {}) {
    return {
      t: 0, random, fibres: opts.fibres ?? SPLICE.fibres, done: [], fibre: 0, o: 0.8, v: 0, ph: random() * 6.28, lives: SPLICE.lives,
      time: opts.time ?? SPLICE.time, total: 0, redone: 0, arc: 0, last: null, score: 0, fx: [], over: null,
    };
  },
  // how hard the swell rocks this fibre: more with every one done
  swell: (s) => SPLICE.swell[0] + (SPLICE.swell[1] - SPLICE.swell[0]) * (s.fibre / Math.max(1, s.fibres - 1)),
  tick(s, dt) {
    if (s.over) return;
    s.t += dt; s.time -= dt;
    for (const f of s.fx) f.t += dt;
    s.fx = s.fx.filter((f) => f.t < 1.4);
    if (s.arc > 0) {
      // the next fibre slides in, off-centre
      if ((s.arc -= dt) <= 0) { if (s.last?.kept) { s.o = (s.random() < 0.5 ? -1 : 1) * (0.6 + s.random() * 0.5); s.v = 0; } s.slide = 0.5; }
    } else {
      s.slide = Math.max(0, (s.slide ?? 0) - dt);
      // the swell: a slow roll plus a wander
      s.v += (s.random() - 0.5) * 1.4 * dt - s.v * 0.8 * dt;
      s.o += (Math.cos(s.t * 0.8 + s.ph) * 0.8 * FiberSplice.swell(s) + s.v) * dt;
      s.o = Math.max(-1.6, Math.min(1.6, s.o));
    }
    if (s.time <= 0 && !s.over) { s.over = 'lost'; s.why = 'storm'; }
  },
  press(s, lane) {
    if (s.over || s.arc > 0) return;
    // a tap above, below or on the joint
    if (lane >= 10) lane = lane - 10;
    if (lane === 0) { s.o -= SPLICE.nudge; return; }
    if (lane === 2) { s.o += SPLICE.nudge; return; }
    if (s.slide > 0) return;
    const off = Math.abs(s.o), loss = spliceLoss(off);
    s.arc = SPLICE.arc;
    if (off >= SPLICE.ok) {
      s.lives--; s.redone++; s.last = { loss, kept: false, off };
      float(s, 1, `Light leaks out (${loss.toFixed(2)} dB): cut and try again`, false);
      if (s.lives <= 0) { s.over = 'lost'; s.why = 'leaks'; }
      return;
    }
    s.total += loss; s.done.push(loss); s.fibre++;
    s.last = { loss, kept: true, off };
    const word = off < SPLICE.perfect ? 'Perfect!' : off < SPLICE.good ? 'Good' : 'OK';
    const pts = Math.round(150 * (1 - off / SPLICE.ok)) + 30; s.score += pts;
    float(s, 1, `${word} ${loss.toFixed(2)} dB  +${pts}`, off < SPLICE.good);
    if (s.total > SPLICE.budget) { s.over = 'lost'; s.why = 'budget'; return; }
    if (s.fibre >= s.fibres) s.over = 'won';
  },
  result(s) {
    if (!s.over) return null;
    return { won: s.over === 'won', points: s.over === 'won' ? s.score + Math.round(Math.max(0, s.time)) * 3 : 0, flawless: s.redone === 0 && s.done.every((l) => l < spliceLoss(SPLICE.good)) };
  },
  summary(s, words) {
    const best = s.done.length ? Math.min(...s.done) : 0;
    return words === 'plain'
      ? `You joined ${s.done.length} fibres, losing ${s.total.toFixed(2)} dB of light in all (the best join lost only ${best.toFixed(2)} dB)${s.redone ? `, and ${s.redone} join${s.redone === 1 ? '' : 's'} had to be done again` : ', and never had to redo one'}.`
      : `${s.done.length} splices, ${s.total.toFixed(2)} dB total of a ${SPLICE.budget} dB budget (best ${best.toFixed(2)} dB), ${s.redone} remade.`;
  },
  draw(g, s, w, h, words, theme) {
    g.clearRect(0, 0, w, h);
    const plain = words === 'plain', top = 62, cx = w / 2, cy = top + (h - top - 40) / 2;
    hud(g, w, theme, `${plain ? 'Fibre' : 'Fibre'} ${Math.min(s.fibre + 1, s.fibres)} / ${s.fibres} · ${'♥'.repeat(Math.max(0, s.lives))}${'♡'.repeat(SPLICE.lives - Math.max(0, s.lives))}`, clamp01(s.time / SPLICE.time), s.score, s.time);
    // the light budget, as a bar
    const bw = Math.min(260, w - 40), bx = (w - bw) / 2;
    g.fillStyle = theme.well; roundRect(g, bx, 34, bw, 12, 6); g.fill();
    g.fillStyle = s.total > SPLICE.budget * 0.75 ? theme.bad : theme.good; roundRect(g, bx, 34, Math.max(8, bw * clamp01(s.total / SPLICE.budget)), 12, 6); g.fill();
    g.fillStyle = theme.ink; g.font = `800 10px ${theme.font}`; g.textAlign = 'center';
    g.fillText(`${plain ? 'Light lost' : 'Loss'} ${s.total.toFixed(2)} / ${SPLICE.budget} dB`, w / 2, 56);
    // the splicer's view: a dark screen, two fibres, the cores glowing
    const vw = Math.min(w - 24, 560), vh = h - top - 40, vx = (w - vw) / 2;
    g.fillStyle = '#0d1b2a'; roundRect(g, vx, top, vw, vh, 12); g.fill();
    g.strokeStyle = theme.muted; g.lineWidth = 1.5; g.stroke();
    const unit = Math.min(26, vh / 9), clad = unit * 3.2, core = unit * 0.9, gap = 10;
    g.strokeStyle = 'rgba(255,255,255,0.18)'; g.setLineDash([5, 6]); g.lineWidth = 1;
    g.beginPath(); g.moveTo(vx + 10, cy); g.lineTo(vx + vw - 10, cy); g.stroke(); g.setLineDash([]);
    const ry = cy + (s.arc > 0 && s.last?.kept ? s.last.off * Math.sign(s.o || 1) : s.o) * unit;
    const fibre = (x0, x1, y) => {
      g.fillStyle = '#c9d6e3'; g.globalAlpha = 0.55; g.fillRect(x0, y - clad / 2, x1 - x0, clad); g.globalAlpha = 1;
      g.fillStyle = '#5ee7ff'; g.shadowColor = '#5ee7ff'; g.shadowBlur = 12; g.fillRect(x0, y - core / 2, x1 - x0, core); g.shadowBlur = 0;
    };
    fibre(vx + 8, cx - gap / 2, cy);
    fibre(cx + gap / 2 + (s.slide ?? 0) * vw, vx + vw - 8 + (s.slide ?? 0) * vw, ry);
    // the arc, then the join glowing (or the leak)
    if (s.arc > 0) {
      const k = 1 - s.arc / SPLICE.arc;
      if (k < 0.35) { g.strokeStyle = '#fff6a8'; g.lineWidth = 3; g.shadowColor = '#fff6a8'; g.shadowBlur = 20; g.beginPath(); g.moveTo(cx, cy - clad); for (let i = 1; i <= 6; i++) g.lineTo(cx + (i % 2 ? 6 : -6), cy - clad + (i * clad) / 3); g.stroke(); g.shadowBlur = 0; }
      else if (s.last?.kept) { g.fillStyle = '#5ee7ff'; g.globalAlpha = 0.6 * (1 - k); g.beginPath(); g.arc(cx, (cy + ry) / 2, 18, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1; }
      else emoji(g, '💨', cx + 14, cy - clad, 22);
    }
    // the guide marks for "lined up"
    g.strokeStyle = 'rgba(125,255,176,0.5)'; g.lineWidth = 2;
    for (const d of [-1, 1]) { g.beginPath(); g.moveTo(cx + gap, cy + d * SPLICE.good * unit); g.lineTo(cx + gap + 30, cy + d * SPLICE.good * unit); g.stroke(); }
    const off = Math.abs(s.o);
    g.fillStyle = off < SPLICE.perfect ? '#7dffb0' : off < SPLICE.good ? '#c8ff7d' : off < SPLICE.ok ? '#ffc43d' : '#ff8a94';
    g.font = `800 12px ${theme.font}`; g.textAlign = 'right';
    g.fillText(off < SPLICE.perfect ? (plain ? 'Lined up!' : 'Aligned') : off < SPLICE.ok ? (plain ? 'Almost…' : 'Offset') : (plain ? 'Too far off' : 'Out of tolerance'), vx + vw - 12, top + 20);
    g.fillStyle = 'rgba(255,255,255,0.6)'; g.textAlign = 'left'; g.font = `700 10px ${theme.font}`;
    g.fillText(plain ? 'splicer view · ×400' : 'core view · ×400', vx + 12, top + 18);
    // the fibres done so far, as little dots
    for (let i = 0; i < s.fibres; i++) { g.fillStyle = i < s.done.length ? (s.done[i] < spliceLoss(SPLICE.good) ? '#7dffb0' : '#ffc43d') : 'rgba(255,255,255,0.2)'; g.beginPath(); g.arc(vx + 16 + i * 14, top + vh - 14, 5, 0, Math.PI * 2); g.fill(); }
    floats(g, s, () => [w / 2, h - 14], theme);
  },
  laneAt(x, y, w, h) {
    // above the joint nudges up, below nudges down, on it joins
    const top = 62, cy = top + (h - top - 40) / 2;
    if (y < top) return null;
    return 10 + (Math.abs(y - cy) < 26 ? 1 : y < cy ? 0 : 2);
  },
};

// ---------------------------------------------------------------- Colour Memory (metro optical ring)
// The hub sends a test pattern down the fibre, one colour at a time: each colour is its
// own channel. Send the same pattern back, so both ends agree which colour goes where.
// Every round adds a colour, and from the third the pattern plays faster.
const MEM = { rounds: 5, start: 3, lives: 3, wait: 6, show: [0.75, 0.75, 0.6, 0.55, 0.5], gap: 0.22, pause: 1.1 };
const MEM_COLOURS = [
  { key: 'red', hex: '#ff4d6d', plain: 'Red', eng: 'λ1 red' },
  { key: 'green', hex: '#2ecc71', plain: 'Green', eng: 'λ2 green' },
  { key: 'blue', hex: '#3d8bff', plain: 'Blue', eng: 'λ3 blue' },
];
const ColourMemory = {
  id: 'memory',
  name: { plain: 'Colour Memory', eng: 'Channel Memory' },
  how: {
    plain: 'The hub sends a pattern of colours down the light ring, one at a time: each colour is its own channel. Watch it, then send the same colours back in the same order with 1 🔴, 2 🟢, 3 🔵 (or tap the pads). Every round adds one colour, and it gets faster!',
    eng: 'The hub transmits a test sequence across the ring, one wavelength at a time. Echo it back in order with 1 🔴, 2 🟢, 3 🔵 (or tap the pads) so both ends agree on the channel plan. Each round adds a channel, and the sequence speeds up.',
  },
  goal: { plain: 'Repeat five patterns of colours', eng: 'Echo five channel sequences' },
  laneNames: { plain: MEM_COLOURS.map((c) => c.plain), eng: MEM_COLOURS.map((c) => c.eng) },
  start(random = Math.random, opts = {}) {
    const seq = Array.from({ length: MEM.start }, () => Math.floor(random() * 3));
    return { t: 0, random, rounds: opts.rounds ?? MEM.rounds, round: 0, seq, longest: 0, phase: 'pause', pt: 0.8, step: 0, pos: 0, wait: 0, lit: null, pulses: [], lives: MEM.lives, right: 0, wrong: 0, timeouts: 0, score: 0, fx: [], over: null };
  },
  speed: (s) => MEM.show[Math.min(MEM.show.length - 1, s.round)],
  tick(s, dt) {
    if (s.over) return;
    s.t += dt;
    for (const f of s.fx) f.t += dt;
    s.fx = s.fx.filter((f) => f.t < 1.4);
    for (const p of s.pulses) p.k += dt / 0.9;
    s.pulses = s.pulses.filter((p) => p.k < 1);
    if (s.lit) { s.lit.t -= dt; if (s.lit.t <= 0) s.lit = null; }
    if (s.phase === 'pause') {
      if ((s.pt -= dt) <= 0) { s.phase = 'show'; s.step = 0; s.pt = 0; }
    } else if (s.phase === 'show') {
      // one colour at a time, sent from the hub across the ring
      if ((s.pt -= dt) <= 0) {
        if (s.step >= s.seq.length) { s.phase = 'input'; s.pos = 0; s.wait = 0; return; }
        const c = s.seq[s.step++];
        s.lit = { c, t: ColourMemory.speed(s) }; s.pulses.push({ c, k: 0, back: false });
        s.pt = ColourMemory.speed(s) + MEM.gap;
      }
    } else if (s.phase === 'input') {
      if ((s.wait += dt) > MEM.wait) { s.timeouts++; ColourMemory.miss(s, 'Too slow! The channel timed out'); }
    }
  },
  miss(s, why) {
    s.lives--; s.wrong++; float(s, 1, why, false);
    if (s.lives <= 0) { s.over = 'lost'; return; }
    s.phase = 'pause'; s.pt = MEM.pause;           // the same pattern again
  },
  press(s, lane) {
    if (s.over || s.phase !== 'input') return;
    if (lane >= 10) lane -= 10;
    if (lane < 0 || lane > 2) return;

// ---------------------------------------------------------------- Light Path (long-haul mesh)
// Professor Prism has scrambled the light switches between Prismfield and Spectraville.
// Each tile is a switch with a straight or a bent path through it; tap one to turn it.
// The light runs live from the source as far as the switches let it: set every one on

  },

  start(random = Math.random, opts = {}) {

// ---------------------------------------------------------------- Level 5: the fight with Lord Lag
// The last level is a recap of the whole Quest: one round for each level before it, in a

// and a little meaner, with Lord Lag taunting between rounds. Each round won knocks off

  { plain: 'Back to the city, apprentice. Let\'s see if you remember!', eng: 'Round one, the city network. Show me you still remember.' },

// ---------------------------------------------------------------- drawing helpers

// Which chapter plays which game; the rest keep their questions for now.
